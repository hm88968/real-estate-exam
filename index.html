 "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 9}, {"subject": "土地法與土地相關稅法概要", "year": "112", "q": "依平均地權條例之規定，委託不動產經紀業代銷預售屋者，應於何時向直轄市、縣（市）主管機\n關申報登錄資訊？", "options": ["(A)應於簽訂買賣契約之日起至少十日內申報", "(B)應於簽訂買賣契約之日起至少十五日內申報", "(C)應於簽訂買賣契約之日起三十日內申報", "(D)應於簽訂買賣契約之日起四十五日內申報"], "qnum": 10, "ans": "C", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 10}, {"subject": "土地法與土地相關稅法概要", "year": "112", "q": "依土地徵收條例規定，因受領遲延、拒絕受領或不能受領之補償費，下列何者正確？", "options": ["(A)依提存法提存於直轄市或縣（市）主管機關於國庫設立之土地徵收補償費保管專戶", "(B)直轄市或縣（市）主管機關應於補償費發給期限屆滿之日起三個月內存入專戶保管", "(C)保管專戶儲存之補償費應給付利息", "(D)已依規定繳存專戶保管之徵收補償費，自徵收公告期滿之日起，逾十五年未領取者，歸屬國庫"], "qnum": 13, "ans": "C", "law_ref": {"law": "土地法", "article": "第208條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 13}, {"subject": "土地法與土地相關稅法概要", "year": "112", "q": "依土地登記規則之規定，於何種情形下登記機關應以書面敘明理由或法令依據，通知申請人於接\n到通知書之日起十五日內補正，下列何者錯誤？", "options": ["(A)申請人之資格不符或其代理人之代理權有欠缺", "(B)登記申請書不合程式，或應提出之文件不符或欠缺", "(C)未依規定繳納登記規費", "(D)登記之權利人、義務人或其與申請登記之法律關係有關之權利關係人間有爭執"], "qnum": 15, "ans": "D", "law_ref": {"law": "土地法", "article": "第37條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 15}, {"subject": "土地法與土地相關稅法概要", "year": "112", "q": "我國物權係採法定主義，於土地所有權以外之其他不動產物權，謂之他項權利，依民法及土地法\n之規定，下列何者非屬物權？", "options": ["(A)抵押權", "(B)農育權", "(C)耕作權", "(D)租賃權"], "qnum": 16, "ans": "D", "law_ref": {"law": "民法", "article": "第765條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 16}, {"subject": "土地法與土地相關稅法概要", "year": "112", "q": "依土地法之規定，外國人為供自用、投資或公益之目的使用，得取得所需之土地，其面積及所在\n地點，應受該管直轄市或縣（市）政府依法所定之限制，下列何種用途不屬之？", "options": ["(A)長照機構", "(B)住宅", "(C)醫院", "(D)營業處所、辦公場所、商店及工廠"], "qnum": 17, "ans": "A", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 17}, {"subject": "土地法與土地相關稅法概要", "year": "112", "q": "依土地法規定，有關地籍測量之相關規定，下列何者錯誤？", "options": ["(A)地籍測量時，土地所有權人應設立界標，並永久保存之", "(B)地籍測量，如由該管直轄市或縣（市）政府辦理，其實施計畫應經該地方之地政機關核定", "(C)重新實施地籍測量時，土地所有權人應於地政機關通知之限期內，自行設立界標，並到場指界", "(D)重新實施地籍測量之結果，應予公告，其期間為三十日"], "qnum": 19, "ans": "B", "law_ref": {"law": "民法物權編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000003"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 19}, {"subject": "土地法與土地相關稅法概要", "year": "112", "q": "依土地法之規定，有關土地登記之損害賠償，下列何者錯誤？", "options": ["(A)因登記錯誤遺漏或虛偽致受損害者，由該地政機關負損害賠償責任", "(B)登記人員或利害關係人，於登記完畢後，發見登記錯誤或遺漏時，非以書面聲請該管上級機關"], "qnum": 20, "ans": "C", "law_ref": {"law": "民法", "article": "第213條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 20}, {"subject": "土地法與土地相關稅法概要", "year": "112", "q": "依平均地權條例規定，對私有空地之處置，下列何者錯誤？", "options": ["(A)規定照價收買者，以收買當期之平均市價為準", "(B)逾期未建築、增建、改建或重建者，按該宗土地應納地價稅基本稅額加徵二倍至五倍之空地稅"], "qnum": 21, "ans": "A", "law_ref": {"law": "土地稅法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0060027"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 21}, {"subject": "土地法與土地相關稅法概要", "year": "112", "q": "依都市計畫法之規定，市鎮計畫之主要計畫書，除用文字、圖表說明外，應附主要計畫圖，其比\n例尺不得小於多少？", "options": ["(A)五百分之一", "(B)一千分之一", "(C)一萬分之一", "(D)一萬五千分之一"], "qnum": 22, "ans": "C", "law_ref": {"law": "都市計畫法", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0110001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 22}, {"subject": "土地法與土地相關稅法概要", "year": "112", "q": "依所得稅法之規定，個人依第14 條之4 前2 項規定計算之房屋、土地交易所得，減除當次交易\n依土地稅法第30 條第1 項規定公告土地現值計算之土地漲價總數額後之餘額，不併計綜合所得\n總額，按相關規定稅率計算應納稅額，其在中華民國境內居住之個人應納稅額，下列何者正確？", "options": ["(A)持有房屋、土地之期間在二年以內者，稅率為百分之三十五", "(B)持有房屋、土地之期間超過二年，未逾五年者，稅率為百分之二十五", "(C)因財政部公告之調職、非自願離職或其他非自願性因素，交易持有期間在五年以下之房屋、土"], "qnum": 23, "ans": "C", "law_ref": {"law": "所得稅法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0150018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 23}, {"subject": "土地法與土地相關稅法概要", "year": "112", "q": "依土地稅法之規定，主管稽徵機關得指定土地使用人負責代繳其使用部分之地價稅或田賦，下列\n何項非屬所規範者？", "options": ["(A)土地進行訴訟者", "(B)權屬不明者", "(C)納稅義務人行蹤不明者", "(D)土地所有權人申請由占有人代繳者"], "qnum": 24, "ans": "A", "law_ref": {"law": "土地稅法", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130013"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 24}, {"subject": "土地法與土地相關稅法概要", "year": "112", "q": "有關土地利用計畫之通盤檢討相關規定，下列何者正確？", "options": ["(A)全國國土計畫每五年通盤檢討一次", "(B)直轄市、縣（市）國土計畫每十年通盤檢討一次", "(C)都市計畫每三年內或五年內至少應通盤檢討一次", "(D)區域計畫每十年通盤檢討一次"], "qnum": 25, "ans": "C", "law_ref": {"law": "都市計畫法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070021"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 25}, {"subject": "民法概要", "year": "112", "q": "有關權利能力之敘述，下列何者錯誤？", "options": ["(A)人的權利能力始於出生終於死亡，因此胎兒尚未出生所以沒有權利能力", "(B)人的權利能力不得拋棄，更不得轉讓", "(C)法人除於法令或性質上之限制外，仍享有權利能力", "(D)植物人仍享有權利能力"], "qnum": 1, "ans": "A", "law_ref": {"law": "民法總則編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 1}, {"subject": "民法概要", "year": "112", "q": "有關權利客體之敘述，下列何者錯誤？", "options": ["(A)甲未經乙的同意在乙的土地上種植樹木，該樹木為乙土地上之部分", "(B)甲飼養一頭母牛，後來該母牛生下一頭小牛，小牛所有權仍屬於甲所有", "(C)為收容災民而臨時拼裝之貨櫃屋，仍為定著物，性質上為不動產", "(D)主物之處分效力及於從物，所以購買汽車之契約效力及於備胎"], "qnum": 2, "ans": "C", "law_ref": {"law": "民法物權編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000003"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 2}, {"subject": "民法概要", "year": "112", "q": "有關限制行為能力之敘述，下列何者正確？", "options": ["(A)滿16 歲之未成年人寫遺囑時，仍須經法定代理人同意，否則效力未定", "(B)16 歲之甲偽造身分證，使相對人乙誤信甲已滿18 歲，而與甲簽訂買賣契約，該買賣契約有效", "(C)限制行為能力人為代理人時，代理人受領代理權仍須經法定代理人之同意", "(D)法定代理人可以概括允許限制行為能力人為法律行為"], "qnum": 3, "ans": "B", "law_ref": {"law": "民法", "article": "第15條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 3}, {"subject": "民法概要", "year": "112", "q": "下列情形，那一行為需向法院聲請撤銷，才會發生撤銷之效力？", "options": ["(A)通謀虛偽意思表示所為之法律行為", "(B)因錯誤或誤傳之意思表示而為法律行為", "(C)被詐欺而為意思表示之法律行為", "(D)因暴利行為所為之法律行為"], "qnum": 4, "ans": "D", "law_ref": {"law": "民法", "article": "第86條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 4}, {"subject": "民法概要", "year": "112", "q": "甲向乙推銷一只古董錶，甲出價新臺幣（下同）10 萬元問乙要不要買，乙答覆說：「如果8 萬元\n我就買」，請問乙的答覆性質上為何？", "options": ["(A)要約之引誘", "(B)承諾", "(C)要約", "(D)意思實現"], "qnum": 5, "ans": "C", "law_ref": {"law": "民法", "article": "第154條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 5}, {"subject": "民法概要", "year": "112", "q": "依民法之規定，約定利率超過週年百分之多少，則超過之部分會無效？", "options": ["(A)12", "(B)16", "(C)20", "(D)25"], "qnum": 7, "ans": "B", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 7}, {"subject": "民法概要", "year": "112", "q": "下列何種契約性質上屬於要物契約？", "options": ["(A)消費借貸契約", "(B)房屋租賃契約", "(C)贈與契約", "(D)合會契約"], "qnum": 8, "ans": "A", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 8}, {"subject": "民法概要", "year": "112", "q": "依民法之規定，有關租賃契約之效力，下列何者錯誤？", "options": ["(A)租賃物有修繕之必要時，原則上承租人可直接自行修繕後再請求出租人給付修繕費用", "(B)如租賃物是房屋時，倘出租人無反對之約定，承租人可以將房屋一部轉租", "(C)租賃物因承租人失火而造成損害，承租人僅就重大過失負賠償責任", "(D)租賃物應納之一切稅捐，由出租人負擔"], "qnum": 9, "ans": "A", "law_ref": {"law": "民法", "article": "第421條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 9}, {"subject": "民法概要", "year": "112", "q": "為動產物權讓與之交付，倘受讓人已先占有動產，於讓與合意時即生動產所有權取得之效力，學\n理上稱之為何？", "options": ["(A)現實交付", "(B)占有改定", "(C)簡易交付", "(D)指示交付"], "qnum": 10, "ans": "C", "law_ref": {"law": "民法", "article": "第765條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 10}, {"subject": "民法概要", "year": "112", "q": "有關遺失物拾得之敘述，下列何者錯誤？", "options": ["(A)遺失物自通知或最後招領日起逾6 個月，未有受領人認領者，由拾得人取得遺失物之所有權", "(B)受領權人認領遺失物時，拾得人原則上可以請求報酬，但不得超過遺失物價值之十分之三", "(C)拾得人之報酬請求權因6 個月不行使而消滅", "(D)倘受領權人為低收入戶時，依法可以拒絕拾得人之報酬請求"], "qnum": 12, "ans": "B", "law_ref": {"law": "民法物權編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000003"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 12}, {"subject": "民法概要", "year": "112", "q": "民法關於死亡宣告的規定，下列何者正確？", "options": ["(A)失蹤人失蹤滿三年後，法院得因利害關係人之聲請，為死亡之宣告", "(B)受死亡宣告者，以判決內所確定死亡之時，推定其為死亡", "(C)遺產稅捐徵收機關得為失蹤人向法院聲請死亡宣告", "(D)死亡宣告會剝奪失蹤人之權利能力"], "qnum": 14, "ans": "B", "law_ref": {"law": "稅捐稽徵法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=G0340023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 14}, {"subject": "民法概要", "year": "112", "q": "甲於民國（下同）107 年9 月間向乙租車公司租用自小客車環島，然卻積欠乙租金新臺幣3 萬元，\n乙於108 年9 月催告後甲仍不為給付，乙便於109 年8 月訴請甲給付租金，於110 年9 月獲勝訴\n判決確定。下列何者正確？", "options": ["(A)乙租車公司的租金請求權時效本為5 年", "(B)乙於108 年9 月催告後6 個月內未起訴，仍生中斷時效之效力", "(C)乙於109 年8 月訴請甲給付租金時，時效不完成", "(D)判決確定後，時效重新起算5 年"], "qnum": 15, "ans": "D", "law_ref": {"law": "民法總則編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 15}, {"subject": "民法概要", "year": "112", "q": "土地所有人非因故意或重大過失逾越地界建築房屋，而鄰地所有人知其越界，卻不即時提出異議\n者，下列何者正確？", "options": ["(A)鄰地所有人不為異議，即表示拋棄所有權利，不得再為主張", "(B)土地所有人有權得請求購買越界之土地", "(C)鄰地所有人得請求移去或變更越界建築之房屋，並請求支付償金", "(D)鄰地所有人不得請求移去或變更越界建築之房屋，但得請求所受損害之償金"], "qnum": 17, "ans": "D", "law_ref": {"law": "民法物權編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000003"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 17}, {"subject": "民法概要", "year": "112", "q": "關於民法區分所有建築物規定之敘述，下列何者錯誤？", "options": ["(A)專有部分與其所屬之共有部分及其基地之權利，得分離而為移轉或設定負擔", "(B)就區分所有建築物共有部分及基地之應有部分，區分所有人得約定其比例", "(C)專有部分得經其所有人之同意，依規約之約定供區分所有建築物之所有人共同使用", "(D)共有部分除法律另有規定外，得經規約之約定供區分所有建築物之特定所有人使用"], "qnum": 18, "ans": "A", "law_ref": {"law": "建築法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070105"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 18}, {"subject": "民法概要", "year": "112", "q": "甲在其所有A 地上興建B 屋，但B 屋為未辦理建物所有權第一次登記的違章建物，嗣後甲與乙\n訂立A 地與B 屋的買賣契約，下列何者錯誤？", "options": ["(A)B 屋雖為違章建築亦為融通物，得為交易之客體", "(B)甲應將A 地所有權辦妥移轉登記給乙，乙始取得A 地所有權", "(C)興建B 屋時因未為建物所有權保存登記，故甲未取得B 屋所有權", "(D)甲將Ｂ屋讓與乙，乙僅取得對Ｂ屋之事實上處分權"], "qnum": 19, "ans": "C", "law_ref": {"law": "民法", "article": "第345條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 19}, {"subject": "民法概要", "year": "112", "q": "關於善意占有人之敘述，下列何者錯誤？", "options": ["(A)善意占有人於本權訴訟敗訴時，自判決確定之日起，視為惡意占有人", "(B)善意占有人自確知其無占有本權時起，為惡意占有人", "(C)善意占有人因保存占有物所支出之必要費用，得向回復請求人請求償還", "(D)善意占有人，因改良占有物所支出之有益費用，於其占有物現存之增加價值限度內，得向回復"], "qnum": 20, "ans": "A", "law_ref": {"law": "民法", "article": "第944條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 20}, {"subject": "民法概要", "year": "112", "q": "就法定夫妻財產制之敘述，下列何者錯誤？", "options": ["(A)夫或妻婚前財產，於婚姻關係存續中所生之孳息，視為婚後財產", "(B)不能證明為夫或妻所有之財產，視為夫妻共有", "(C)夫或妻之財產分為婚前財產與婚後財產，由夫妻各自所有", "(D)夫妻各自對其債務負清償之責"], "qnum": 21, "ans": "B", "law_ref": {"law": "民法", "article": "第1047條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 21}, {"subject": "民法概要", "year": "112", "q": "關於遺產繼承之敘述，下列何者錯誤？", "options": ["(A)非婚生子女非經生父認領或準正，不得繼承其生父之遺產", "(B)遺產繼承人，除配偶外，其繼承順序為直系血親卑親屬、父母、兄弟姊妹、祖父母", "(C)配偶與被繼承人直系血親尊親屬同為繼承時，其應繼分為遺產之三分之一", "(D)特留分之規定，係為保障法定繼承人之權利免受侵害"], "qnum": 23, "ans": "C", "law_ref": {"law": "民法", "article": "第1147條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 23}, {"subject": "民法概要", "year": "112", "q": "關於回復喪失繼承權之敘述，下列何者錯誤？", "options": ["(A)子女為了遺產而謀殺父親，即喪失對父親之繼承權，因被繼承人原諒繼承人之行為而回復繼承權", "(B)偽造、變造、隱匿、湮滅被繼承人關於繼承之遺囑者，喪失繼承權，得因被繼承人原諒繼承人"], "qnum": 24, "ans": "A", "law_ref": {"law": "民法", "article": "第1147條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 24}, {"subject": "民法概要", "year": "112", "q": "關於拋棄繼承之敘述，下列何者錯誤？", "options": ["(A)應於知悉其得繼承之時起三個月內，以書面向法院為之", "(B)拋棄繼承後，應通知因其拋棄而應為繼承之人。未為通知者，不生拋棄繼承之效力", "(C)配偶拋棄繼承權者，其應繼分歸屬於與其同為繼承之人", "(D)繼承之拋棄，溯及於繼承開始時發生效力"], "qnum": 25, "ans": "B", "law_ref": {"law": "民法", "article": "第1154條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/民法概要ANS.pdf", "source_qnum": 25}, {"subject": "不動產估價概要", "year": "113", "q": "不動產市場循環受到諸多經濟因素的影響，評估不動產價格時都訂有價格日期，依價格日期評估\n時必須掌握那項原則？", "options": ["(A)預測原則", "(B)變動原則", "(C)收益分配原則", "(D)外部性原則"], "qnum": 1, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第6條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 1}, {"subject": "不動產估價概要", "year": "113", "q": "王小姐住家旁有一個高壓電塔，電塔周遭的房子不太容易售出，價格也比較低，不動產估價師評\n估該嫌惡設施對於房屋價格的影響是基於那一項原則？", "options": ["(A)適合原則", "(B)外部性原則", "(C)貢獻原則", "(D)競爭原則"], "qnum": 2, "ans": "B", "law_ref": {"law": "公平交易法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=G0300024"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 2}, {"subject": "不動產估價概要", "year": "113", "q": "某預售建案因取得綠建築黃金級標章，每坪開價比附近未取得標章之建案貴，建商申請綠建築標\n章的行為是基於不動產估價之何種經濟原則？", "options": ["(A)最高最有效原則", "(B)貢獻原則", "(C)供需原則", "(D)外部性原則"], "qnum": 4, "ans": "B", "law_ref": {"law": "建築法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070105"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 4}, {"subject": "不動產估價概要", "year": "113", "q": "下列有關租金估計的敘述何者錯誤？", "options": ["(A)租金估價的價格種類包括正常租金與限定租金兩種", "(B)名目租金，指承租人每期支付予出租人之租金，加計押金或保證金、權利金及其他相關運用收"], "qnum": 5, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 5}, {"subject": "不動產估價概要", "year": "113", "q": "不動產估價技術規則對不動產估價方法運用的規定，下列何者錯誤？", "options": ["(A)不動產估價師應兼採二種以上估價方法推算勘估標的價格", "(B)不動產估價師應就不同估價方法估價所獲得之價格進行綜合比較，就其中金額顯著差異者重新"], "qnum": 6, "ans": "C", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 6}, {"subject": "不動產估價概要", "year": "113", "q": "不動產估價技術規則第26 條第1 項：經比較調整後求得之勘估標的試算價格，應就價格偏高或\n偏低者重新檢討，經檢討確認適當合理者，始得作為決定比較價格之基礎。檢討後試算價格之間\n差距仍達百分之二十以上者，應排除該試算價格之適用。若比較標的一、二、三之試算價格分別\n為79 萬元/坪，77 萬元/坪及95 萬元/坪，下列敘述何者正確？", "options": ["(A)三個試算價格之間皆符合排除條件", "(B)三個試算價格之間皆不符合排除條件", "(C)比較標的一與三之間符合排除條件", "(D)比較標的二與三之間符合排除條件"], "qnum": 8, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 8}, {"subject": "不動產估價概要", "year": "113", "q": "下列何者非屬營造或施工費的內含項目？", "options": ["(A)直接人工費", "(B)間接材料費", "(C)開發商的合理利潤", "(D)資本利息"], "qnum": 9, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 9}, {"subject": "不動產估價概要", "year": "113", "q": "有關營造或施工費的敘述何者錯誤？", "options": ["(A)營造或施工費屬於建物總成本的一部分，房屋愈舊，營造或施工費就愈低", "(B)勘估標的之營造或施工費，得按直接法或間接法擇一求取之。功能性退化造成的折舊屬於房屋"], "qnum": 10, "ans": "A", "law_ref": {"law": "不動產估價技術規則", "article": "第27條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 10}, {"subject": "不動產估價概要", "year": "113", "q": "中央銀行理監事會於113 年第3 季會議決議調升存款準備率及調整選擇性信用管制措施，此項宣\n布可能會影響不動產市場與價值，此為影響不動產價值之何種因素？", "options": ["(A)一般因素", "(B)情況因素", "(C)區域因素", "(D)個別因素"], "qnum": 11, "ans": "A", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 11}, {"subject": "不動產估價概要", "year": "113", "q": "下列對於有效總收入與總收入之間關係的敘述何者正確？", "options": ["(A)總收入必定大於或等於有效總收入", "(B)有效總收入與總收入只是說法上不同，兩者在實質的意義上一樣", "(C)總收入減去總費用等於淨收益", "(D)總收入=有效總收入+總費用"], "qnum": 12, "ans": "A", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 12}, {"subject": "不動產估價概要", "year": "113", "q": "收益資本化率決定的方法中與銀行貸款成數相關的是那一個方法？", "options": ["(A)市場萃取法", "(B)有效總收入乘數法", "(C)債務保障比率法", "(D)風險溢酬法"], "qnum": 13, "ans": "C", "law_ref": {"law": "不動產估價技術規則", "article": "第20條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 13}, {"subject": "不動產估價概要", "year": "113", "q": "有關收益法的公式，下列何者錯誤？", "options": ["(A)淨收益未扣除折舊提存費者，建物收益價格＝建物淨收益／建物收益資本化率", "(B)直接資本化法之收益價格＝勘估標的未來平均一年期間之客觀淨收益／收益資本化率", "(C)地上有建物者，土地收益價格＝（房地淨收益－建物淨收益）／土地收益資本化率", "(D)淨收益已扣除折舊提存費者，房地綜合收益資本化率＝土地收益資本化率×土地價值比率＋建"], "qnum": 14, "ans": "A", "law_ref": {"law": "不動產估價技術規則", "article": "第20條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 14}, {"subject": "不動產估價概要", "year": "113", "q": "有關特殊宗地估價敘述，下列何者錯誤？", "options": ["(A)農場或牧場之估價，以比較法估價為原則", "(B)公共設施用地及公共設施保留地之估價，應考慮政府徵收土地之可能價格評估之", "(C)高爾夫球場之估價，應考慮會員制度、球場設施、開發成本、收益及營運費用等因素", "(D)鹽田之估價無買賣實例者，得以附近土地價格為基礎，考慮其日照、通風、位置及形狀等差異，"], "qnum": 15, "ans": "B", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 15}, {"subject": "不動產估價概要", "year": "113", "q": "有關權利估價敘述，下列何者正確？", "options": ["(A)市地重劃前後土地估價係作為地主分配的依據，不屬於權利估價", "(B)永佃權估價，不需要考慮佃租支付情形，依民間習慣估計之", "(C)地上權估價，應考慮其用途、權利存續期間、支付地租之有無、權利讓與之限制及地上權設定"], "qnum": 16, "ans": "C", "law_ref": {"law": "民法物權編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000003"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 16}, {"subject": "不動產估價概要", "year": "113", "q": "影響不動產價格的三大因素中區域因素甚為重要，下列敘述何者非屬區域因素的描述？", "options": ["(A)王小姐的房子位於信義計畫區內房價水準很高", "(B)張先生的房子距離大安森林公園約50 公尺條件很好", "(C)板橋埔墘生活圈生活機能很好", "(D)中正紀念堂周遭的房子有很好的價值條件"], "qnum": 18, "ans": "B", "law_ref": {"law": "民法", "article": "第99條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 18}, {"subject": "不動產估價概要", "year": "113", "q": "A 把忠孝東路五段鄰近市政府的店面出租給一間連鎖咖啡店，每月租金100,000 元，押金2 個月，假\n設年利率2.5%，約定每年管理費120,000 元由咖啡店支付，請問其一年支付之實質租金為多少元？", "options": ["(A)1,200,000", "(B)1,205,000", "(C)1,085,000", "(D)1,080,000"], "qnum": 19, "ans": "B", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 19}, {"subject": "不動產估價概要", "year": "113", "q": "某公寓因為隔壁基地正在興建危老建案造成外牆龜裂現象，此現象屬於那一種折舊類型？", "options": ["(A)物理性折舊", "(B)功能性折舊", "(C)經濟性折舊", "(D)外部性折舊"], "qnum": 20, "ans": "A", "law_ref": {"law": "不動產估價技術規則", "article": "第27條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 20}, {"subject": "不動產估價概要", "year": "113", "q": "一棟屋齡30 年的公寓，假設現在重建成本是3,000 萬元，耐用年數為50 年，殘餘價格率為10%，\n以定額法計算折舊的情況下，目前公寓的價值是多少？", "options": ["(A)1,620 萬元", "(B)1,380 萬元", "(C)1,080 萬元", "(D)1,200 萬元"], "qnum": 21, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第27條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 21}, {"subject": "不動產估價概要", "year": "113", "q": "比較標的於112 年9 月以3,060 萬元售出，當時房價指數為102；勘估標的價格日期為113 年5\n月，房價指數上漲至105。假設其他條件相同，勘估標的經價格日期調整後的應該是多少？", "options": ["(A)2,970 萬元", "(B)3,150 萬元", "(C)3,240 萬元", "(D)3,210 萬元"], "qnum": 22, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 22}, {"subject": "不動產估價概要", "year": "113", "q": "依據不動產估價技術規則規定試算價格的價格決定，那一項不適用？", "options": ["(A)試算價格調整過程中，任一單獨項目之價格調整率大於15%時應排除", "(B)試算價格調整過程中，總調整率大於20%應排除", "(C)試算價格調整過程中，總調整率大於30%應排除", "(D)試算價格調整過程中，試算價格之間差距達20%以上應排除"], "qnum": 23, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 23}, {"subject": "不動產估價概要", "year": "113", "q": "某一開發案自有資金比例是30%，其餘資金向銀行貸款，貸款利率為3%，自有資金報酬率為2%，\n其資本化率為何？", "options": ["(A)2.3%", "(B)2.7%", "(C)2.5%", "(D)2.6%"], "qnum": 24, "ans": "B", "law_ref": {"law": "不動產經紀業管理條例", "article": "第19條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 24}, {"subject": "不動產估價概要", "year": "113", "q": "某一棟四層樓公寓，各樓層面積皆相同，一樓單價每坪50 萬元，4 樓單價每坪40 萬元，假設4\n樓之樓層別效用比為100%，請問一樓的樓層別效用比是多少？", "options": ["(A)150%", "(B)130%", "(C)115%", "(D)125%"], "qnum": 25, "ans": "D", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產估價概要ANS.pdf", "source_qnum": 25}, {"subject": "不動產經紀相關法規概要", "year": "113", "q": "不動產說明書係不動產交易過程中極為重要之資訊揭露文件，下列關於不動產說明書之敘述，何\n者與不動產經紀業管理條例之規定不符？", "options": ["(A)不動產之買賣如委由經紀業代銷者，不動產說明書應由經紀業指派經紀人簽章", "(B)經紀人員在執行業務過程中，應以不動產說明書向與委託人交易之相對人解說", "(C)經紀人員於提供解說後，應將不動產說明書交由委託人簽章", "(D)雙方當事人簽訂買賣契約書後，不動產說明書視為買賣契約書之一部分"], "qnum": 1, "ans": "C", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產經紀相關法規概要ANS.pdf", "source_qnum": 1}, {"subject": "不動產經紀相關法規概要", "year": "113", "q": "有關公寓大廈專有部分、共用部分之修繕義務及費用負擔，下列敘述何者錯誤？", "options": ["(A)專有部分之修繕，由各該區分所有權人為之，並負擔其費用", "(B)共用部分之修繕，由管理負責人或管理委員會為之。其費用由公共基金支付或由區分所有權人"], "qnum": 4, "ans": "C", "law_ref": {"law": "公寓大廈管理條例", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產經紀相關法規概要ANS.pdf", "source_qnum": 4}, {"subject": "不動產經紀相關法規概要", "year": "113", "q": "某老舊公寓社區因近來地震頻繁嚴重毀損，有危害公共安全之虞。經召開臨時區分所有權人會議，\n在符合公寓大廈管理條例第30 條及第31 條規定下，決議同意重建。惟甲自始即反對重建，於臨\n時會議時，亦投下反對票。依公寓大廈管理條例之規定，應如何處理？", "options": ["(A)因未經全體區分所有權人之同意，該公寓社區不得進行重建", "(B)管理負責人或管理委員會得訴請法院命甲出讓其區分所有權及其基地所有權應有部分", "(C)管理負責人或管理委員會得訴請法院將甲強制遷離", "(D)管理負責人或管理委員會得請求主管機關為必要之處置"], "qnum": 6, "ans": "B", "law_ref": {"law": "公寓大廈管理條例", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產經紀相關法規概要ANS.pdf", "source_qnum": 6}, {"subject": "不動產經紀相關法規概要", "year": "113", "q": "依公寓大廈管理條例規定，起造人於符合下列何種情形後三個月內，應召集區分所有權人召開區\n分所有權人會議，成立管理委員會或推選管理負責人，並向直轄市、縣（市）主管機關報備？", "options": ["(A)公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計半數以上", "(B)公寓大廈建築物所有權登記之區分所有權人達半數以上及其區分所有權比例合計三分之二以上", "(C)公寓大廈建築物所有權登記之區分所有權人達三分之二以上及其區分所有權比例合計半數以上", "(D)公寓大廈建築物所有權登記之區分所有權人達三分之二以上及其區分所有權比例合計三分之"], "qnum": 7, "ans": "A", "law_ref": {"law": "公寓大廈管理條例", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產經紀相關法規概要ANS.pdf", "source_qnum": 7}, {"subject": "不動產經紀相關法規概要", "year": "113", "q": "內政部公告之「預售屋買賣定型化契約應記載及不得記載事項」及「不動產說明書應記載或不得\n記載事項（預售屋部分）」，均要求預售屋之買賣須具備履約擔保制度。試問：由建商或起造人將\n建案土地及興建資金信託予某金融機構或經政府許可之信託業者執行履約管理。興建資金應依工\n程進度專款專用。簽定預售屋買賣契約時，賣方應提供上開信託之證明文件或影本予買方。此係\n屬何種履約擔保？", "options": ["(A)不動產開發信託", "(B)價金返還保證", "(C)價金信託", "(D)同業連帶擔保"], "qnum": 8, "ans": "A", "law_ref": {"law": "不動產經紀業管理條例", "article": "第19條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產經紀相關法規概要ANS.pdf", "source_qnum": 8}, {"subject": "不動產經紀相關法規概要", "year": "113", "q": "甲建商於預售屋銷售廣告單中表示：「現場簽約，贈送德國進口高級廚衛設備」。首次購屋者乙於\n建商接待中心看完樣品屋後，隨即與銷售人員丙簽定預售屋買賣契約書。惟交屋時，始發現建商\n所贈送者，係國產中等品質設備，與廣告內容不符。就此案例，下列敘述，何者正確？", "options": ["(A)廣告係要約引誘，對甲並不具拘束力", "(B)廣告內容若未經甲、乙合意成為個別磋商條款，並訂入預售屋買賣契約中，對甲不生效力", "(C)廣告內容即為契約內容，於契約成立後，甲應確實履行", "(D)甲得以廣告內容係媒體經營者所為，未註記其公司名稱，主張免除履約責任"], "qnum": 9, "ans": "C", "law_ref": {"law": "民法", "article": "第345條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產經紀相關法規概要ANS.pdf", "source_qnum": 9}, {"subject": "不動產經紀相關法規概要", "year": "113", "q": "下列關於公平交易法之敘述，何者錯誤？", "options": ["(A)維護消費者利益為本法立法目的之一", "(B)依照著作權法、商標法、專利法或其他智慧財產權法規行使權利之行為，不適用本法之規定", "(C)事業關於競爭之行為，優先適用本法之規定。但其他法律另有規定且不牴觸本法立法意旨者，"], "qnum": 10, "ans": "B", "law_ref": {"law": "消費者保護法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070029"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產經紀相關法規概要ANS.pdf", "source_qnum": 10}, {"subject": "不動產經紀相關法規概要", "year": "113", "q": "不動產開發業者或不動產經紀業者銷售預售屋時，其所為之下列何種行為，並不構成公平交易法\n第25 條「其他足以影響交易秩序之欺罔或顯失公平之行為」？", "options": ["(A)在向買方收取斡旋金前，未以書面告知買方得選擇支付斡旋金或採用內政部版「要約書」", "(B)向買方收取斡旋金後，因未能締結預售屋買賣契約，而拒絕返還", "(C)要求購屋人須給付定金或一定費用始提供預售屋買賣契約書攜回審閱", "(D)締結預售屋買賣契約後，要求繳回契約書"], "qnum": 11, "ans": "B", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產經紀相關法規概要ANS.pdf", "source_qnum": 11}, {"subject": "不動產經紀相關法規概要", "year": "113", "q": "不動產業者因炒作房地產所涉及之不實廣告、不當銷售行為，下列何者非屬內政部主管法規所及，\n應由公平交易委員會依公平交易法相關規定辦理？", "options": ["(A)散布不實成交價格、市場成交行情、銷售量，影響不動產交易價格", "(B)違規潛銷預售屋（未領得建造執照即廣告銷售）", "(C)利用人頭排隊、假客戶付訂金、簽訂虛假購屋預約單或不動產買賣契約書等與他人通謀或為虛"], "qnum": 12, "ans": "D", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產經紀相關法規概要ANS.pdf", "source_qnum": 12}, {"subject": "不動產經紀相關法規概要", "year": "113", "q": "事業申報結合，經公平交易委員會禁止其結合而仍為結合者，公平交易委員會除得處新臺幣\n二十萬元以上五千萬元以下罰鍰外，並得為一定之處分。下列何者不包括在內？", "options": ["(A)停止營業", "(B)限期令分設事業", "(C)處分全部或部分股份", "(D)轉讓部分營業"], "qnum": 13, "ans": "A", "law_ref": {"law": "公平交易法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=G0300024"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產經紀相關法規概要ANS.pdf", "source_qnum": 13}, {"subject": "不動產經紀相關法規概要", "year": "113", "q": "下列何者不違反公平交易法第21 條廣告不實？", "options": ["(A)不動產代銷業者於售屋網站公告35 米泳池，而該泳池設置處於竣工圖為景觀水池", "(B)不動產代銷業者於售屋廣告，標示近捷運站", "(C)不動產代銷業者於售屋廣告，對於使用分區為乙種工業區之建案使用一般住宅之用語及圖示說明", "(D)不動產代銷業者於銷售屬科技工業區之建案時，使用可供住家使用之傢俱配置參考圖"], "qnum": 16, "ans": "B", "law_ref": {"law": "不動產經紀業管理條例", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070046"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產經紀相關法規概要ANS.pdf", "source_qnum": 16}, {"subject": "不動產經紀相關法規概要", "year": "113", "q": "不動產經紀業違反不動產經紀業管理條例相關規定時，下列何種情形，直轄市、縣（市）主管機\n關應先令其限期改正，屆期未改正，始處一定金額之罰鍰？", "options": ["(A)設立之營業處所未置經紀人", "(B)僱用未具備經紀人員資格者從事仲介或代銷業務", "(C)收取差價或其他報酬", "(D)未將其仲介或代銷相關證照及許可文件連同經紀人證書揭示於營業處所明顯之處"], "qnum": 18, "ans": "D", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產經紀相關法規概要ANS.pdf", "source_qnum": 18}, {"subject": "不動產經紀相關法規概要", "year": "113", "q": "不動產經紀業者告知消費者「今天不簽約就沒機會」、「不簽約就不能看契約」、並在契約中記載\n「已確實攜回本契約書審閱5 日以上無誤或是已詳閱並充分瞭解本契約書及附件內容，無須5 日\n以上審閱期，本約簽訂後，確認即生契約效力無誤」，請問此定型化契約條款效力為何？", "options": ["(A)有效", "(B)無效", "(C)效力未定", "(D)部分有效，部分無效"], "qnum": 19, "ans": "B", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產經紀相關法規概要ANS.pdf", "source_qnum": 19}, {"subject": "不動產經紀相關法規概要", "year": "113", "q": "預售屋買賣定型化契約應記載及不得記載事項規定，接通自來水、電力之管線費及其相關費用（例\n如安裝配置設計費、施工費、道路開挖費、復原費及施工人員薪資等）應由誰負擔？", "options": ["(A)賣方", "(B)買方", "(C)買賣雙方平均分配", "(D)買賣雙方議定"], "qnum": 20, "ans": "A", "law_ref": {"law": "不動產經紀業管理條例", "article": "第19條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產經紀相關法規概要ANS.pdf", "source_qnum": 20}, {"subject": "不動產經紀相關法規概要", "year": "113", "q": "下列何者不是定型化契約條款推定顯失公平之情形？", "options": ["(A)違反平等互惠原則者", "(B)條款與其所排除不予適用之任意規定之立法意旨顯相矛盾者", "(C)契約之主要權利或義務，因受條款之限制，致契約之目的難以達成者", "(D)定型化契約中之定型化契約條款牴觸個別磋商條款之約定者"], "qnum": 21, "ans": "D", "law_ref": {"law": "不動產經紀業管理條例", "article": "第19條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產經紀相關法規概要ANS.pdf", "source_qnum": 21}, {"subject": "不動產經紀相關法規概要", "year": "113", "q": "依現行公寓大廈管理條例規定，公寓大廈住戶可以飼養動物？", "options": ["(A)原則可以，但社區管委會有權禁止住戶飼養動物", "(B)原則可以，但規約另有禁止飼養之規定時，則依規約約定", "(C)原則禁止，但社區管委會有權開放住戶飼養動物", "(D)原則禁止，但規約有權開放住戶飼養動物"], "qnum": 25, "ans": "B", "law_ref": {"law": "公寓大廈管理條例", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/不動產經紀相關法規概要ANS.pdf", "source_qnum": 25}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依平均地權條例規定，預售屋或新建成屋買賣契約之買受人，於簽訂買賣契約後，不得讓與或轉\n售買賣契約與第三人，但經其他中央主管機關公告得讓與或轉售之情形並經直轄市、縣（市）主\n管機關核准者，不在此限。買受人據此得讓與或轉售之戶（棟）數為何？", "options": ["(A)全國每一年以一戶（棟）為限", "(B)全國每一年以二戶（棟）為限", "(C)全國每二年以一戶（棟）為限", "(D)全國每二年以三戶（棟）為限"], "qnum": 1, "ans": "C", "law_ref": {"law": "民法", "article": "第345條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 1}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依平均地權條例規定，權利人及義務人應於買賣案件申請所有權移轉登記時，申報登錄資訊，未\n共同申報登錄資訊者，直轄市、縣（市）主管機關應令其限期申報登錄資訊；屆期未申報登錄資\n訊，買賣案件已辦竣所有權移轉登記者，處多少罰鍰，並令其限期改正？", "options": ["(A)新臺幣三萬元以上十五萬元以下罰鍰", "(B)新臺幣六萬元以上三十萬元以下罰鍰", "(C)新臺幣十五萬元以上五十萬元以下罰鍰", "(D)新臺幣三十萬元以上一百萬元以下罰鍰"], "qnum": 2, "ans": "A", "law_ref": {"law": "民法", "article": "第765條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 2}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依平均地權條例規定，有關私法人買受供住宅使用之房屋，下列何者正確？", "options": ["(A)應檢具切結書，經中央主管機關許可", "(B)中央主管機關審核其使用計畫，以合議制方式辦理", "(C)私法人取得之房屋，於登記完畢後十年內不得辦理預告登記", "(D)許可之文件有效期限為二年"], "qnum": 3, "ans": "B", "law_ref": {"law": "土地登記規則", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070031"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 3}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依都市計畫法規定，有關主要計畫之核定，下列何者正確？", "options": ["(A)鎮及鄉街之主要計畫由內政部核定", "(B)直轄市之主要計畫由行政院核定", "(C)特定區計畫由縣（市）政府擬定者，由內政部核定，轉報行政院備案", "(D)特定區計畫由內政部訂定者，由行政院核定"], "qnum": 4, "ans": "A", "law_ref": {"law": "都市計畫法", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0110001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 4}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依土地徵收條例規定，有關徵收之撤銷或廢止之敘述，下列何者錯誤？", "options": ["(A)撤銷或廢止徵收，由需用土地人向中央主管機關申請之", "(B)在未依徵收計畫完成使用前，需用土地人應每年檢討其興辦事業計畫，並由該管直轄市或縣"], "qnum": 5, "ans": "B", "law_ref": {"law": "土地法", "article": "第208條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 5}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依土地徵收條例規定，有關徵收補償費，下列何者正確？", "options": ["(A)在都市計畫區內之公共設施保留地，應按照徵收當期之市價補償其地價", "(B)徵收補償之地價，由不動產估價師評定之", "(C)建築改良物之補償費，按徵收當時該建築改良物之重置價格估定之", "(D)農作改良物之補償費，於農作改良物被徵收時與其孳息成熟時期相距在一年以內者，按成熟時"], "qnum": 6, "ans": "D", "law_ref": {"law": "土地法", "article": "第208條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 6}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依土地徵收條例規定，有關直轄市或縣（市）主管機關應於國庫設立土地徵收補償費保管專戶部\n分，下列何者錯誤？", "options": ["(A)自通知送達發生效力之日起，逾十年未領取之補償費，歸屬國庫", "(B)應於規定應發給補償費之期限屆滿次日起三個月內存入專戶保管", "(C)保管未受領之徵收補償費，不適用提存法之規定", "(D)未受領之徵收補償費，依規定繳存專戶保管時，視同補償完竣"], "qnum": 7, "ans": "A", "law_ref": {"law": "土地法", "article": "第208條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 7}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依土地徵收條例規定，有關徵收之程序，下列何者正確？", "options": ["(A)特定農業區經行政院核定為重大建設須辦理徵收者，應依行政程序法舉行聽證", "(B)需用土地人於事業計畫報請目的事業主管機關許可後，應舉行公聽會", "(C)協議價購時，依其他法律規定有優先購買權者，無優先購買權之適用", "(D)需用土地人於所有權人拒絕參與協議或經開會未能達成協議時，則改申請徵收"], "qnum": 8, "ans": "C", "law_ref": {"law": "土地法", "article": "第208條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 8}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依都市計畫法規定，主要計畫擬定後經該管政府都市計畫委員會審議修正，或經內政部指示修正\n者，後續如何辦理？", "options": ["(A)免再公開展覽及舉行說明會", "(B)再公開展覽", "(C)再舉行說明會", "(D)再公開展覽及舉行說明會"], "qnum": 9, "ans": "A", "law_ref": {"law": "都市計畫法", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0110001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 9}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依土地法規定，逾期未辦繼承之土地於標售時，有關優先購買權人之順序依序為何？", "options": ["(A)繼承人、合法使用人、其他共有人", "(B)其他共有人、合法使用人、繼承人", "(C)合法使用人、繼承人、其他共有人", "(D)繼承人、其他共有人、合法使用人"], "qnum": 10, "ans": "A", "law_ref": {"law": "土地法", "article": "第104條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 10}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依土地法規定，依法得分割之共有土地，共有人不能自行協議分割者，任何共有人得申請該管直\n轄市、縣（市）地政機關調處，不服調處者，應於接到調處通知後幾日內向司法機關訴請處理，\n屆期不起訴者，依原調處結果辦理之？", "options": ["(A)七日", "(B)十日", "(C)十五日", "(D)三十日"], "qnum": 11, "ans": "C", "law_ref": {"law": "民法", "article": "第817條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 11}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依土地法規定，關於地權及地權限制，下列何者正確？", "options": ["(A)台灣糖業股份有限公司所有土地為公有土地", "(B)私有土地，因天然變遷成為湖澤或可通運之水道時，其所有權絕對消滅", "(C)湖澤及可通運之水道及岸地，如因水流變遷而自然增加時，其接連地之使用權人，有優先依法"], "qnum": 12, "ans": "D", "law_ref": {"law": "民法物權編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000003"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 12}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依都市計畫法規定，下列有關公共設施保留地之使用管制規定，何者錯誤？", "options": ["(A)公共設施保留地在未取得前，得申請為臨時建築使用", "(B)不得為妨礙其指定目的之使用，但得繼續為原來之使用或改為妨礙目的較輕之使用", "(C)私有公共設施保留地得申請與公有非公用土地辦理交換，不受土地法、國有財產法及各級政府"], "qnum": 14, "ans": "D", "law_ref": {"law": "都市計畫法", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0110001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 14}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依土地法規定，下列有關建築基地出賣時行使優先購買權之敘述，何者錯誤？", "options": ["(A)地上權人、典權人或承租人有依同樣條件優先購買之權", "(B)優先購買權人，於接到出賣通知後十日內不表示者，其優先權視為放棄", "(C)出賣人未通知優先購買權人而與第三人訂立買賣契約者，其契約不得對抗優先購買權人", "(D)基地承租人與基地共有人行使優先購買權發生競合時，其順序以登記之先後定之"], "qnum": 15, "ans": "D", "law_ref": {"law": "土地法", "article": "第104條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 15}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "甲乙丙丁戊共有A 地，持分各五分之一。甲乙丙三人擬依土地法第34 條之1 規定，將A 地出售\n予戊，下列敘述何者正確？", "options": ["(A)不適法，出售為有償讓與行為，應依民法規定，經共有人全體同意始得為之", "(B)不適法，共有人不得為受讓人", "(C)適法，甲乙丙三人已符合共有人過半數及其應有部分合計過半數之同意的行使要件", "(D)適法，買賣契約業經甲乙丙戊同意，縱使戊未經計算在同意人數及應有部分內，仍得依土地法"], "qnum": 17, "ans": "B", "law_ref": {"law": "民法", "article": "第817條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 17}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依土地徵收條例規定，有關區段徵收範圍內土地，經規劃整理後之處理方式，下列何者正確？", "options": ["(A)抵費地發交被徵收土地所有權人領回", "(B)零售市場無償登記為當地直轄市有、縣（市）有或鄉（鎮、市）有", "(C)標租時，其期限不得逾九十九年", "(D)安置原住戶土地得以標售"], "qnum": 18, "ans": "C", "law_ref": {"law": "土地法", "article": "第208條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 18}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依房屋稅條例規定，起造人持有使用執照所載用途為住家用之待銷售房屋，於起課房屋稅二年內，\n其房屋稅之稅率為何？", "options": ["(A)最低不得少於其房屋現值百分之一點二，最高不得超過百分之二點四", "(B)最低不得少於其房屋現值百分之二，最高不得超過百分之三點六", "(C)最低不得少於其房屋現值百分之二，最高不得超過百分之四點八", "(D)最低不得少於其房屋現值百分之三，最高不得超過百分之五"], "qnum": 19, "ans": "B", "law_ref": {"law": "房屋稅條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130021"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 19}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依契稅條例規定，有關申報契稅之起算日期，下列何者正確？", "options": ["(A)向政府機關標購公產，以政府機關核准產權移轉之日為申報起算日", "(B)不動產移轉發生糾紛時，以法院判決確定之日為申報起算日", "(C)向法院標購拍賣之不動產，以承買人拍定之日為申報起算日", "(D)建築物於建造完成前，因交換以承受人為建造執照原始起造人者，以主管建築機關核發使用執"], "qnum": 20, "ans": "B", "law_ref": {"law": "建築法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070105"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 20}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依土地稅法規定，非都市土地供公共設施使用者，在滿足規定要件下，其尚未被徵收前之移轉，\n免徵土地增值稅。下列有關免稅要件之敘述，何者錯誤？", "options": ["(A)經需用土地人開闢完成或依計畫核定供公共設施使用", "(B)依法完成使用地編定", "(C)依法完成徵收公告", "(D)經需用土地人證明"], "qnum": 22, "ans": "C", "law_ref": {"law": "土地稅法", "article": "第30條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130013"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 22}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "下列有關契稅納稅義務人之敘述，何者正確？", "options": ["(A)受託人依信託本旨移轉信託財產與委託人以外之歸屬權利人時，由歸屬權利人申報納稅", "(B)買賣契稅，應由出賣人申報納稅", "(C)典權契稅，應由出典人申報納稅", "(D)交換有給付差額價款者，其差額價款，應由出賣人申報納稅"], "qnum": 23, "ans": "A", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 23}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依房屋稅條例規定，下列有關自住使用之住家用房屋適用1.2%計徵房屋稅之要件，何者錯誤？", "options": ["(A)無出租或供營業情形", "(B)房屋所有人本人、配偶或直系親屬於該屋辦竣戶籍登記", "(C)房屋所有人本人、配偶及未成年子女於全國僅持有一戶房屋且房屋現值在一定金額以下", "(D)房屋所有人本人、配偶或直系親屬實際居住使用"], "qnum": 24, "ans": "C", "law_ref": {"law": "房屋稅條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130021"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 24}, {"subject": "土地法與土地相關稅法概要", "year": "113", "q": "依所得稅法規定，個人以自有土地與營利事業合作興建房屋，自土地取得之日起算五年內完成並\n銷售該房屋、土地者，其所得稅稅率為何？", "options": ["(A)百分之十", "(B)百分之十五", "(C)百分之二十", "(D)百分之二十五"], "qnum": 25, "ans": "C", "law_ref": {"law": "所得稅法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0150018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 25}, {"subject": "民法概要", "year": "113", "q": "甲就其所有之A 地，先與乙訂立買賣契約，後與丙訂立買賣契約，均未辦理所有權移轉登記。關\n於二個買賣契約之效力，下列敘述，何者正確？", "options": ["(A)前契約有效，後契約無效", "(B)前契約無效，後契約有效", "(C)前契約有效，後契約有效", "(D)前契約無效，後契約無效"], "qnum": 1, "ans": "C", "law_ref": {"law": "民法", "article": "第345條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 1}, {"subject": "民法概要", "year": "113", "q": "有關行為能力之敘述，下列何者正確？", "options": ["(A)年滿30 歲患有精神疾病致無法處理自己事務之甲，當然沒有行為能力", "(B)年滿19 歲之乙可以獨自訂立買賣汽車之契約", "(C)受輔助宣告之丙可以不經輔助人丁之同意贈與使用過之筆電給戊", "(D)15 歲之庚可以不經法定代理人允許擅自丟棄自有之平板電腦"], "qnum": 2, "ans": "B", "law_ref": {"law": "民法", "article": "第15條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 2}, {"subject": "民法概要", "year": "113", "q": "甲將其所有之名畫出租於乙，並未將代理權授與乙。詎料，乙竟以甲之代理人名義，與善意之丙\n訂立買賣契約，將名畫出賣並交付於丙。甲不承認乙之無權代理行為，下列敘述，何者正確？", "options": ["(A)丙善意取得名畫之所有權", "(B)丙得請求乙損害賠償", "(C)乙與丙之買賣契約有效", "(D)乙與丙之物權契約有效"], "qnum": 3, "ans": "B", "law_ref": {"law": "民法", "article": "第110條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 3}, {"subject": "民法概要", "year": "113", "q": "甲對乙有新臺幣（下同）100 萬元之債權，將該債權讓與丙，甲與丙均未通知乙債權讓與之事情。\n嗣後，乙因不知債權讓與之事情，對甲清償100 萬元，經甲受領，下列敘述，何者正確？", "options": ["(A)甲與丙之債權讓與無效", "(B)乙之債務因清償而消滅", "(C)應經丙承認，乙之債務始消滅", "(D)甲與丙之債權讓與應經乙承認始生效"], "qnum": 4, "ans": "B", "law_ref": {"law": "民法", "article": "第294條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 4}, {"subject": "民法概要", "year": "113", "q": "甲申請之建案因違法無法取得建造許可，遂與乙約定，由甲贈與乙之妻丙100 萬元後，乙須幫助\n甲取得建造許可，後來乙收賄之行為經法院判決有罪確定。問甲可否向丙請求返還100 萬元？", "options": ["(A)可以，依據不當得利", "(B)不可，100 萬元為不法原因之給付", "(C)可以，100 萬為違背公序良俗之給付", "(D)可以，依據無因管理"], "qnum": 5, "ans": "B", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 5}, {"subject": "民法概要", "year": "113", "q": "甲與乙訂立租賃契約，將丙所有之A 屋出租於乙，並交付於乙。嗣後，丙對乙起訴，請求乙返還\nA 屋，致乙不能為約定之使用，下列敘述，何者正確？", "options": ["(A)甲與乙訂立之租賃契約無效", "(B)甲與乙訂立之租賃契約得撤銷", "(C)乙得終止與甲訂立之租賃契約", "(D)乙得以與甲之租賃契約對抗丙"], "qnum": 7, "ans": "C", "law_ref": {"law": "民法", "article": "第421條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 7}, {"subject": "民法概要", "year": "113", "q": "甲將其所有之A 屋出租於乙，乙未經甲之同意，將A 屋全部轉租於丙。下列敘述，何者正確？", "options": ["(A)乙與丙訂立之租賃契約無效", "(B)甲與乙訂立之租賃契約無效", "(C)乙得終止乙與丙之租賃契約", "(D)甲得終止甲與乙之租賃契約"], "qnum": 8, "ans": "D", "law_ref": {"law": "民法", "article": "第443條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 8}, {"subject": "民法概要", "year": "113", "q": "甲在其所有之A 地上興建B 屋後，將B 屋出售並移轉所有權登記於乙。下列敘述，何者正確？", "options": ["(A)推定甲與乙在房屋得使用期限內有租賃關係", "(B)視為甲與乙在房屋得使用期限內有租賃關係", "(C)推定乙在房屋得使用期限內對A 地有普通地上權", "(D)視為乙在房屋得使用期限內對A 地有普通地上權"], "qnum": 9, "ans": "A", "law_ref": {"law": "民法", "article": "第765條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 9}, {"subject": "民法概要", "year": "113", "q": "有關意思表示之敘述，下列何者正確？", "options": ["(A)甲與乙本為夫妻，為逃避債務，通謀虛偽離婚，並辦理離婚登記完畢，甲乙間已無婚姻關係", "(B)甲無欲為其意思表示之拘束，而向乙表示將贈與新款手機一部，乙雖明知甲心中之真意，贈與"], "qnum": 10, "ans": "C", "law_ref": {"law": "民法", "article": "第86條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 10}, {"subject": "民法概要", "year": "113", "q": "甲與其20 歲之兒子乙訂立贈與契約，將甲所有之A 屋贈與乙，並完成所有權移轉登記。嗣後，\n乙竟不履行對甲之法定扶養義務。下列敘述，何者正確？", "options": ["(A)甲得解除贈與契約", "(B)甲得終止贈與契約", "(C)甲得撤銷贈與契約", "(D)甲得撤回贈與契約"], "qnum": 11, "ans": "C", "law_ref": {"law": "民法", "article": "第406條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 11}, {"subject": "民法概要", "year": "113", "q": "甲於自有土地上建造房屋一棟，因積欠乙銀行巨款，土地及房屋遭乙向法院聲請查封拍賣，土地\n為丙所拍得，房屋為丁所拍得。下列敘述，何者正確？", "options": ["(A)丙可以請求丁拆屋還地", "(B)丁必須承租丙之土地", "(C)視為丁於土地上有地上權", "(D)推定丙與丁間有使用借貸契約"], "qnum": 12, "ans": "C", "law_ref": {"law": "民法物權編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000003"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 12}, {"subject": "民法概要", "year": "113", "q": "甲與乙訂立買賣契約，向乙購買A 地。下列關於甲何時取得A 地所有權之敘述，何者正確？", "options": ["(A)買賣契約有效成立時", "(B)甲付清買賣價金之時", "(C)完成所有權移轉登記時", "(D)乙將A 地交付於甲之時"], "qnum": 13, "ans": "C", "law_ref": {"law": "民法", "article": "第345條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 13}, {"subject": "民法概要", "year": "113", "q": "甲以行使普通地上權之意思，二十年間和平、公然、繼續在乙已登記之A 地上有B 屋，下列敘\n述，何者正確？", "options": ["(A)甲已經取得普通地上權", "(B)甲得請求登記為普通地上權人", "(C)因乙之A 地已辦理登記，故甲無法時效取得", "(D)甲得直接以乙為被告，起訴請求乙同意甲登記為普通地上權人"], "qnum": 15, "ans": "B", "law_ref": {"law": "民法", "article": "第840條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 15}, {"subject": "民法概要", "year": "113", "q": "甲以自有土地設定抵押權予乙，以擔保其債權，該債權之請求權於113 年3 月1 日因時效而消滅。\n下列敘述，何者正確？", "options": ["(A)因從屬於擔保債權，故抵押權隨之消滅", "(B)抵押權人須於消滅時效完成後，5 年間實行其抵押權", "(C)抵押權無消滅時效，可一直存續", "(D)從此之後，抵押權之實行須經債務人同意"], "qnum": 16, "ans": "B", "law_ref": {"law": "民法", "article": "第860條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 16}, {"subject": "民法概要", "year": "113", "q": "甲向乙銀行貸款新臺幣500 萬元，並以甲所有之A 地為乙設定普通抵押權，雙方約定債權已屆清\n償期而未為清償時，A 地之所有權移屬於乙。就該流押契約之效力，下列敘述，何者正確？", "options": ["(A)絕對無效", "(B)相對無效", "(C)非經登記，不生效力", "(D)非經登記，不得對抗第三人"], "qnum": 17, "ans": "D", "law_ref": {"law": "民法", "article": "第765條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 17}, {"subject": "民法概要", "year": "113", "q": "甲向乙銀行借貸新臺幣1000 萬元，並以甲所有之A 屋為乙設定普通抵押權。嗣後，因第三人丙\n之過失，致A 屋滅失，下列敘述，何者正確？", "options": ["(A)乙之抵押權因A 屋滅失而消滅", "(B)乙就甲對丙所得行使之賠償請求權有權利質權", "(C)乙就甲對丙所得行使之賠償請求權有動產質權", "(D)乙就甲對丙所得行使之賠償請求權有普通抵押權"], "qnum": 18, "ans": "B", "law_ref": {"law": "民法", "article": "第860條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 18}, {"subject": "民法概要", "year": "113", "q": "著有數本暢銷理財專書之甲，某日遭汽車駕駛人丙撞傷，卻於與丙損害賠償協議達成前，突發心\n肌梗塞猝死，留有土地一筆及尚未繳清貸款之房屋一棟，某上市電子公司股份100 萬股，銀行存\n款30 萬元，尚欠有乙銀行之信用貸款20 萬元。下列何者非屬繼承之標的？", "options": ["(A)尚未繳清貸款之房屋", "(B)甲所著理財專書之著作權", "(C)甲對丙依據民法第195 條規定可主張之非財產上損害賠償請求權", "(D)甲積欠乙銀行之20 萬信用貸款"], "qnum": 19, "ans": "D", "law_ref": {"law": "民法", "article": "第213條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 19}, {"subject": "民法概要", "year": "113", "q": "民法就夫妻財產制採類型法定原則，下列何者並非我國現行民法規定之夫妻財產制類型？", "options": ["(A)法定財產制", "(B)共同財產制", "(C)分別財產制", "(D)統一財產制"], "qnum": 20, "ans": "D", "law_ref": {"law": "民法", "article": "第1047條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 20}, {"subject": "民法概要", "year": "113", "q": "夫妻得於結婚前或結婚後，以契約就民法所定之約定財產制中，選擇其一，為其夫妻財產制。關\n於夫妻財產制契約，下列敘述，何者錯誤？", "options": ["(A)應以書面為之", "(B)非經登記，不生效力", "(C)非經登記，不得以之對抗第三人", "(D)夫妻未以契約訂立夫妻財產制者，原則上以法定財產制，為其夫妻財產制"], "qnum": 21, "ans": "B", "law_ref": {"law": "民法", "article": "第1047條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 21}, {"subject": "民法概要", "year": "113", "q": "甲男與乙女結婚後，乙女與丙男發生婚外情，並生下丁。下列敘述，何者錯誤？", "options": ["(A)丁係在甲與乙婚姻關係存續中受胎，推定為甲乙之婚生子女", "(B)甲自知悉丁非其婚生子女時起二年內，得對丁提起否認之訴", "(C)丙得以甲與丁為被告，提起否認甲與丁間具有親子關係之訴", "(D)丁與乙之關係，視為婚生子女，乙無須出面從事認領之動作"], "qnum": 22, "ans": "C", "law_ref": {"law": "民法", "article": "第1063條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 22}, {"subject": "民法概要", "year": "113", "q": "甲男與乙女結婚後，並無任何子女。嗣後，甲男死亡，繼承人為乙與甲之父母丙丁。關於乙女之\n應繼分，下列敘述，何者正確？", "options": ["(A)乙與丙丁平均繼承，各三分之一", "(B)乙女之應繼分為遺產之二分之一", "(C)乙女之應繼分為遺產之三分之二", "(D)乙女之應繼分為遺產之四分之三"], "qnum": 23, "ans": "B", "law_ref": {"law": "民法", "article": "第1138條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 23}, {"subject": "民法概要", "year": "113", "q": "民法關於特留分比例之規定，下列敘述，何者錯誤？", "options": ["(A)直系血親卑親屬之特留分為其應繼分二分之一", "(B)父母之特留分為其應繼分二分之一", "(C)兄弟姊妹之特留分為其應繼分二分之一", "(D)配偶之特留分為其應繼分二分之一"], "qnum": 24, "ans": "C", "law_ref": {"law": "民法", "article": "第1224條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 24}, {"subject": "民法概要", "year": "113", "q": "甲死亡後留有土地一筆，由其妻乙、兒子丙及女兒丁及戊繼承，因丙不想繼承該筆土地，故向法\n院以書面聲明拋棄繼承，並通知其他應繼承之人，戊知悉後，則向乙、丙、丁表明，其也要拋棄\n繼承，並拒絕繳納遺產稅及辦理繼承登記。下列敘述，何者正確？", "options": ["(A)丙收到法院寄發之「台端拋棄繼承，准予備查」的函件時，拋棄繼承才生效", "(B)丙拋棄繼承時，其子女可代位繼承", "(C)戊亦已經拋棄繼承，不得繼承土地所有權", "(D)甲之繼承人有乙、丁、戊等三人，應繼分均等"], "qnum": 25, "ans": "D", "law_ref": {"law": "民法", "article": "第1154條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/113/民法概要ANS.pdf", "source_qnum": 25}, {"subject": "國文（作文）", "year": "104", "q": "頁次：4－2\n6 李魁賢〈飛蚊症〉：「堅持一甲子的清白／視網膜上突然／出現了飛蚊／不會妨礙\n視線／只是干擾／我的視覺意識／意識卻困擾了生命的意志／我對女兒說：『實在／\n不甘願羣蚊亂舞的餘生』／女兒卻淡淡地說：『那沒有什麼呀／我從小就這樣長大\n的呀』／我質問她從來都沒提起過／女兒竟說：『我以為人的眼睛都是這樣的呀』／\n啊 原來結構性的病變／早就從下一代著手了／無論體質、語言、生活習慣……」\n下列對詩人寫作意旨的說明何者錯誤？", "options": ["(A)以視覺微恙寄寓社會症候", "(B)強調自主發聲，以對抗衰老", "(C)清白指的是堅持不隨波逐流", "(D)感嘆下一代已將病態視為常態"], "qnum": 60210, "ans": "B", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/104/國文（作文）ANS.pdf", "source_qnum": 6}, {"subject": "國文（作文）", "year": "104", "q": "頁次：4－3\n12 「決定海岸管理方式時，讓在地社區扮演舉足輕重的角色是很重要的。」莫里斯強\n調。該組織贏得廣大英國人民支持與信任的原因之一，就在於積極邀請民眾參與。\n海神計畫不做黑箱作業，而是主動「和在地社區一起深入探討各種方案、檢視證據、\n確立問題的解決之道，幫助他們了解和適應海岸面臨的變化。」\n而且，不管立意如何良善、設計如何精良，英國國民信託堅持不能強迫居民接受任\n何方案，而是兼具感性與想像力，長時間與居民溝通對話，達成共識，互相學習。\n「重點是，我們不能高高在上地自以為是，而是要讓民眾感受到他們的意見是被聆\n聽與重視的，就算我們不盡然同意他們的看法。」莫里斯提醒。\n一開始，國民信託會與當地社區討論，一起確立當地獨特的重要性，並徵詢遊客的\n意見，達成共識。而這份共識不僅將成為未來經營管理的有用依據，也是將居民納\n入國民信託計畫的陣營，共同為環境努力。（賴慧玲〈英國國民信託啟示：給自己\n一個改變現況的機會〉）\n依上文，有關英國國民信託的敘述，下列選項何者正確？", "options": ["(A)莫里斯分享海神計畫中有關海岸管理方式的經驗", "(B)國民信託會邀請當地居民對談，從未有過不同意見", "(C)國民信託會以專家建議為主，輔以在地社區居民的意見", "(D)英國國民信託能獲得民眾的支持，主因在於立意良善、設計精良"], "qnum": 60210, "ans": "A", "law_ref": {"law": "信託法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000013"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/104/國文（作文）ANS.pdf", "source_qnum": 12}, {"subject": "國文（作文）", "year": "105", "q": "司馬光〈訓儉示康〉：「會數而禮勤，物薄而情厚。」其中「薄」字詞性的用法與下列何者相同？", "options": ["(A)省刑罰，「薄」稅斂", "(B)門衰祚「薄」，晚有兒息", "(C)日「薄」西山，氣息奄奄", "(D)不宜妄自菲「薄」，引喻失義"], "qnum": 1, "ans": "B", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 1}, {"subject": "國文（作文）", "year": "105", "q": "下列選項中的「歇後語」，何者對應不適當？", "options": ["(A)瞎子吃水餃─有苦難言", "(B)糞缸裏的石頭—又臭又硬", "(C)抓著苦膽解渴─自討苦吃", "(D)老壽星吃砒霜—活得不耐煩"], "qnum": 3, "ans": "A", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 3}, {"subject": "國文（作文）", "year": "105", "q": "「碧玉妝成一樹高，萬條垂下綠絲縧。不知細葉誰裁出？二月春風似剪刀。」詩中所詠之物是：", "options": ["(A)榕鬚", "(B)松樹", "(C)蔦蘿", "(D)柳樹"], "qnum": 5, "ans": "D", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 5}, {"subject": "國文（作文）", "year": "105", "q": "洛夫寫於1985 年的〈剔牙〉詩句如下：「中午／全世界的人都在剔牙／以潔白的牙籤／安詳地在／剔他\n們／潔白的牙齒 衣索匹亞的一群兀鷹／從一堆屍體中／飛起／排排蹲在／疏朗的枯樹上／也在剔牙／\n以一根根瘦小的／肋骨。」下列何者與詩的第二段「衣索匹亞的一群兀鷹」意涵無關？", "options": ["(A)死亡", "(B)恐怖", "(C)饑餓", "(D)慌亂"], "qnum": 6, "ans": "D", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 6}, {"subject": "國文（作文）", "year": "105", "q": "鄭板橋詩：「紙花如雪滿天飛，嬌女鞦韆打四圍。五色羅裙風擺動，好將蝴蝶鬭春歸。」郭麟吟詩：\n「一百四日小寒食，冶遊爭上白浪河。紙鳶兒子鞦韆女，亂比新來春燕多。」二詩中所描寫的童玩是：", "options": ["(A)毽子", "(B)風箏", "(C)風車", "(D)燈籠"], "qnum": 7, "ans": "B", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 7}, {"subject": "國文（作文）", "year": "105", "q": "吳健雄是二十世紀傑出的女物理學家，曾經參與研發原子彈的曼哈頓計畫。她少年時代親受胡適指導，\n在她即將赴美留學時，胡適給她的教誨是：「凡治學問，功力之外，還需要天才。龜兔之喻，是勉勵中\n人以下之語，也是警惕天才之語，有兔子的天才，加上烏龜的功力，定可無敵於一世。僅有功力，可無\n大過，而未必有大成功。你是很聰明的人，千萬珍重自愛，將來成就未可限量。這還不是我要對你說的\n話。我要對你說的是希望你能利用你的海外住留期間，多留意此邦文物，多讀文史的書，多讀其他科學，\n使胸襟闊大，使見解高明……做一個博學的人……凡第一流的科學家，都是極淵博的人，取精而用弘，\n由博而反約，故能有大成功。」（摘自江才健《吳健雄—物理科學的第一夫人》）\n依上文，胡適最重視的是：", "options": ["(A)應善用自己的天賦，再加上勤勞，必定可以成就一番事業", "(B)作為一流的科學家，除了聰明與努力之外，還要懂得潔身自愛", "(C)能夠到海外求學，吸取外邦的經驗與新知，是成就大事業之所必須", "(D)專精的能力固然重要，但是廣泛閱讀、關注文化及開拓視野也很重要"], "qnum": 8, "ans": "D", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 8}, {"subject": "國文（作文）", "year": "105", "q": "林語堂〈說避暑之益〉：「除非現代文明能夠給人人一塊宅地，讓小孩去翻筋斗捉蟋蟀弄得一身骯髒痛\n快，那種文明不會被我重視。我說明所以搬去那所樓層的緣故，是因那房後面有一片荒園，有橫倒的樹\n幹，有碧綠的池塘」，其所謂之「文明」，最重要的特質為何？", "options": ["(A)不與自然隔絕", "(B)居者皆有其屋", "(C)肯定遊戲需求", "(D)重視兒童權益"], "qnum": 9, "ans": "A", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 9}, {"subject": "國文（作文）", "year": "105", "q": "「在同一條街上有荷蘭西班牙日本中國建築是正常的，清一色的單調建築違反歷史法則─我們的城鎮歌\n聲喑啞，沒有旋律沒有變化；在舊社區中有新社區，四合院農田鄰接麥當勞也是正常的，只見新人笑不\n見舊人哭，這也是違反人情法則─我們的城鎮荒腔走板，沒有歷史沒有記憶。讓城鎮唱出它們的歌，古\n調今調皆宜，牧歌搖滾兼容並蓄。那將是多麼盛大悅耳！」（周芬伶〈城鎮在唱歌〉）\n上述內容，作者欲表達的是：", "options": ["(A)我們的城鎮「盛大悅耳」，是因為常在同一條街上有荷蘭西班牙日本中國建築", "(B)我們的城鎮「無古建築」，是因為不知歷史記憶的重要性，以為清一色新才是新", "(C)我們的城鎮「歌聲喑啞，沒有旋律沒有變化」，是在倡議讓樂音飄揚於街頭巷尾", "(D)我們的城鎮「荒腔走板，沒有歷史沒有記憶」，是在抨擊貴古賤今的陳腐思想"], "qnum": 10, "ans": "B", "law_ref": {"law": "建築法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070105"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 10}, {"subject": "國文（作文）", "year": "105", "q": "「想想，六嬸自工地返家天已昏暝，她一臉塵灰一身土泥，幾雙嗷嗷待哺眼睛張望著她，她所思慮的是如\n何在最短時間內張羅出一頓可以填飽肚子的食物，而非精心烹調，所以桌上總有幾樣罐頭食品：罐頭菜心\n罐頭脆瓜罐頭燒鰻或是罐頭三文魚，滷蛋炒蛋荷包蛋變換著，炒空心菜炒花椰菜炒高麗菜，滷肉，黃昏市\n場買來的切豆乾滷海帶，幾個孩子把一碗菜夾得山尖，坐到電視機前盯著《無敵鐵金剛》、《海王子》看\n得忘了扒飯。\n而一早同六嬸一起上工的男人返家後，可能先沖熱水澡，有熱騰騰菜肴等在餐桌，飯後踅到附近柑仔店啜飲\n米酒嚼花生米閒嗑牙……冬天到了，樹木落光了葉子減少養分損失，僅留著枝幹看似蕭條，其實它的打算不\n在目前，而在來春。六嬸總說，你們好好讀冊，看後擺日子能不能好過一點。」（王盛弘〈清糜〉）\n下列敘述，何者不符合上文意旨？", "options": ["(A)女性在家庭經濟的需求下也需外出工作", "(B)側面寫出男性與女性在家庭中的勞務分工之不均", "(C)現代罐頭食品出現在餐桌，侵蝕了婦女對食物的支配權", "(D)婦女除了出外勞動外，回到家常常超時進行家務工作"], "qnum": 11, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 11}, {"subject": "國文（作文）", "year": "105", "q": "國民信託在國外已行之有年，成果豐碩。這項運動源自英國，1895 年由律師、牧師加上女性社會改革人\n士的三人小組共同發起。他們認為，具歷史價值或自然美景的地區應歸全民共有，一人一元的萬人力量，\n大於一人萬元的一萬倍！至今，英國國民信託機構名下的土地面積占全國2.7%，已是民間最大「地主」。\n緣此，以《彼得兔》（The Tale of Peter Rabbit）聞名全球的英國作家波特（Beatrix Potter）的湖區房舍至\n今原封不動保存完善；搖滾團體披頭四（Beatles）故居，經典老歌依然傳唱。日本動畫導演宮崎駿，擔\n任龍貓兒童信託基金董事長，集資近四億日圓買下11 片森林；更在2010 年1 月買下琦玉縣峽山地區，\n也就是他親自執導、轟動全球的早年名作動畫主角龍貓的故鄉。\n依據報導內容，下列敘述何者錯誤？", "options": ["(A)披頭四故居因國民信託得以保存", "(B)龍貓動畫因國民信託資金，終得完製上映", "(C)公民加入信託行列，是管理公共財的一種方式", "(D)保存歷史、自然等珍貴文物，是每個人都能盡力的"], "qnum": 12, "ans": "B", "law_ref": {"law": "民法", "article": "第817條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 12}, {"subject": "國文（作文）", "year": "105", "q": "余以採硫來居臺郡兩月，為購布，購油，購糖，鑄大鑊，冶刀斧、鋤、杓，規大小木桶，製秤、尺、斗、\n斛，種種畢備。布以給番人易硫土；油與大鑊，所以煉硫；糖給工匠頻飲并浴體，以辟硫毒；鋤平土築\n基；刀斧伐薪薙草；杓出硫於鑊；小桶凝硫，大桶貯水；秤、尺、斗、斛，以衡量諸物。又購脫粟、鹽\n豉、筐、釜、碗、箸等，率為百人具，計費九百八十金，買一巨舶載之。入資什七，覺舟重不任載，心\n竊疑焉。遂止弗入，更買一舶，為載所餘，費半前舶。或曰：「舟有大小，受載有量，今頗未盡量，何\n徒費為？」余曰：「吾忽心動，方欲使兩舶中分之，匪直載所餘也。」言者匿笑去。（節選自：郁永河\n《裨海紀遊‧卷中》）\n依照郁永河自述，其既已「買一巨舶載之」。而後，「更買一舶」的原因為何？", "options": ["(A)言者匿笑，不堪其擾", "(B)舟量所限，僅入資什七", "(C)忽然心動，覺舟重不任載", "(D)為辟硫毒，與番人分乘二舟"], "qnum": 13, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 13}, {"subject": "國文（作文）", "year": "105", "q": "衛人嫁其子而教之曰：「必私積聚。為人婦而出，常也；其成居，幸也。」其子因私積聚，其姑以為多私而\n出之。其子所以反者，倍其所以嫁。其父不自罪於教子非也，而自知其益富。今人臣之處官者，皆是類也。\n根據本文，作者認為當時為官者所抱持的態度大多是：", "options": ["(A)自私自利", "(B)公器私用", "(C)未雨綢繆", "(D)騎驢找馬"], "qnum": 14, "ans": "A", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 14}, {"subject": "國文（作文）", "year": "105", "q": "王公淵娶諸葛誕女，入室，言語始交，王謂婦曰：「新婦神色卑下，殊不似公休！」婦曰：「大丈夫不\n能仿佛彥雲，而令婦人比蹤英傑！」（《世說新語‧賢媛》）諸葛誕女面對王公淵的嫌棄，態度如何？", "options": ["(A)反唇相稽", "(B)謙卑自持", "(C)侃侃而談", "(D)無言以對"], "qnum": 15, "ans": "A", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 15}, {"subject": "國文（作文）", "year": "105", "q": "《荀子‧勸學》：「騏驥一躍，不能十步；駑馬十駕，功在不舍」，強調修身與為學須勤勉不懈，則將\n日起有功。下列那一選項與此意旨不同？", "options": ["(A)道雖邇，不行不至；事雖小，不為不成", "(B)故蹞步而不休，跛鼈千里；累土而不輟，丘山崇成", "(C)故不積蹞步，無以至千里；不積小流，無以成江海", "(D)登高而招，臂非加長也，而見者遠；順風而呼，聲非加疾也，而聞者彰"], "qnum": 16, "ans": "D", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 16}, {"subject": "國文（作文）", "year": "105", "q": "王鍔累任大鎮，財貨山積，有舊客誡鍔以積而能散之義。後數日，客復見鍔，鍔曰：「前所見教，誠如公\n言，已大散矣。」客曰：「請問其目。」鍔曰：「諸男各與萬貫，女婿各與千貫矣。」（李肇《國史補》）\n根據上文，可知王鍔此人具有怎樣的特質：", "options": ["(A)奢侈浮華", "(B)從善如流", "(C)樂善好施", "(D)貪財好貨"], "qnum": 17, "ans": "D", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 17}, {"subject": "國文（作文）", "year": "105", "q": "余書齋中有玉燕兩對，異產也，比雀小些，色白如雪。破曉時吟聲清喨，與雞鳴相和，娓娓動人。弟侄\n輩酷嗜，有如拱璧。雕漆其籠，夜罩以羅帳，朝飼以豆漿，夕飼以蛋麵，三日為之沐浴毛羽，糞除其雕\n籠焉。予以為一鳥之故，而旦暮勞人，況鳥久羈於此，必大拂其性，曷若放之，使各遂其生乎。爰令人\n放之。初止於屋角，繼之於庭樹，唶唶啾啾，回顧睨視，徘徊而不遽去。（吳德功〈放鳥〉）\n作者將玉燕釋放的原因：", "options": ["(A)生活忙碌，沒有心情養鳥", "(B)飼養很麻煩，而且違背鳥的本性", "(C)玉燕的叫聲動聽，擔心弟侄輩玩物喪志", "(D)無法忍受玉燕早晚的叫聲，怕長期如此，會讓自己的性情大變"], "qnum": 18, "ans": "B", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 18}, {"subject": "國文（作文）", "year": "105", "q": "「請不要踩在別人家的田埂上還頤指氣使！」意在反對：", "options": ["(A)喧賓奪主", "(B)沆瀣一氣", "(C)財大氣粗", "(D)盛氣凌人"], "qnum": 19, "ans": "A", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 19}, {"subject": "國文（作文）", "year": "105", "q": "作者在這段文字中，最主要是在強調：", "options": ["(A)人人各司其職方有祥和的社會", "(B)眾志成城始有一張美麗的照片", "(C)滿足自己的同時必須尊重別人", "(D)刻意求工無法成就真正的藝術"], "qnum": 20, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/105/國文（作文）ANS.pdf", "source_qnum": 20}, {"subject": "國文（作文）", "year": "106", "q": "蘇軾〈留侯論〉：「子房以蓋世之材，不為伊尹、太公之謀，而特出於荊軻、聶政之計，以僥倖\n於不死，此圯上老人之所為深惜者也。是故倨傲鮮腆，而深折之，彼其能有所忍也，然後可以就\n大事，故曰：孺子可教也。」圯上老人之所以深惜子房者，是因為：", "options": ["(A)", "鋒芒太露，傲慢不恭 (B)", "有勇無謀，成事不足 (C)", "武術不精，功虧一簣 (D)"], "qnum": 17, "ans": "B", "law_ref": null, "source": null}, {"subject": "國文（作文）", "year": "107", "q": "頁次：4－2\n5 「孔子說︰一個人年紀大了，體力和精神都已經衰退了，應該特別注意對財富、權\n力、名譽、地位都不可貪求，『貪』就是不滿足目前已經得到的，而繼續要求、追\n求更多的財富和權力，更高的名譽和地位。其實，貪和進取之心兩者之間的分界，\n往往是模糊的，每個人都可以也應該有向上提升、向前求進步的心懷，但是把期待\n和目標放得太高太遠，變成過分和不現實，那就是『貪』了。其實，一個人不論在\n什麼年紀，都要記住不要有貪婪之心，不過孔子說，到了老年更應該是如此。」\n上文是在闡述孔子那句話？", "options": ["(A)戒之在得", "(B)貧而無怨", "(C)約之以禮", "(D)過猶不及"], "qnum": 60210, "ans": "A", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/107/國文（作文）ANS.pdf", "source_qnum": 5}, {"subject": "國文（作文）", "year": "107", "q": "頁次：4－3\n10 「從文學史上看，大部分詩人都能很輕易地把握兩種以上的瓊瓦，這也許不表示詩\n人優於別的作家，但至少表示詩人的延伸性大於別的作家。詩是壓縮的語言，但人\n不能永遠說壓縮的語言，尤其當你想到要直接而迅速地服役社會的時候，壓縮的語\n言是不容易奏效的。我常常想，這大概是我也寫散文的原因。我在金門的時候和瘂\n弦談這個問題，他說：『好比臺糖公司，除了出產蔗糖以外，也出產鈣片和甘蔗板。』\n散文是詩人的副產品，大概是無可否認的。」\n依據上文，下列敘述何者不符合作者的看法？", "options": ["(A)所謂「兩片瓊瓦」，指的是新詩與散文", "(B)詩人善於運用壓縮的語言，並能較輕鬆地掌握其他文類", "(C)散文寫作耗時，難以服役社會，故詩人視散文為副產品", "(D)認同瘂弦以臺糖公司為譬，將新詩視為蔗糖，散文視為鈣片或甘蔗板"], "qnum": 60210, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/107/國文（作文）ANS.pdf", "source_qnum": 10}, {"subject": "國文（作文）", "year": "107", "q": "頁次：4－4\n14 下列選項，何者不符合「防微杜漸」的觀念？", "options": ["(A)為之於未有，治之於未亂", "(B)聖人不病，以其病病，是以不病", "(C)大道廢，有仁義；六親不和，有孝慈", "(D)不貴難得之貨，使民不為盜；不見可欲，使民心不亂"], "qnum": 60210, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/107/國文（作文）ANS.pdf", "source_qnum": 14}];
let currentQuiz = [];
let currentIndex = 0;
let wrongQuestions = [];
let answered = [];

function shuffle(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function startQuiz() {
    const subject = document.getElementById('subjectSelect').value;
    const count = document.getElementById('countSelect').value;
    
    let filtered = questions;
    if (subject !== 'all') {
        filtered = questions.filter(q => q.subject === subject);
    }
    
    currentQuiz = shuffle(filtered);
    if (count !== 'all') {
        currentQuiz = currentQuiz.slice(0, parseInt(count));
    }
    
    currentIndex = 0;
    wrongQuestions = [];
    answered = new Array(currentQuiz.length).fill(false);
    
    document.getElementById('quizArea').classList.remove('hidden');
    document.getElementById('wrongReviewArea').classList.add('hidden');
    
    renderQuestions();
}

function renderQuestions() {
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';
    
    currentQuiz.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        card.id = `q-${idx}`;
        
        const ans = q.ans || '';
        const law_ref = q.law_ref || {};
        const source = q.source || '';
        
        let law_html = '';
        if (law_ref && law_ref.url) {
            law_html = `<br><a href="${html.escape(law_ref.url)}" target="_blank" class="law-link">📖 ${html.escape(law_ref.law || '')} ${html.escape(law_ref.article || '')}</a>`;
        }
        
        let src_html = '';
        if (source) {
            src_html = `<div class="source">📄 來源：${html.escape(source)}</div>`;
        }
        
        let options_html = '';
        if (q.options) {
            q.options.forEach((opt, oi) => {
                options_html += `<div class="option" onclick="selectAnswer(${idx}, ${oi})" id="opt-${idx}-${oi}">${html.escape(opt)}</div>`;
            });
        }
        
        card.innerHTML = `
<div class="q-meta">題號：${q.qnum || '?'} | 科目：${html.escape(q.subject)} | 年度：${q.year}年</div>
<div class="q-text">${html.escape(q.q)}</div>
<div class="options">${options_html}</div>
<div class="answer-reveal" id="reveal-${idx}">
<div class="correct-answer">答案：(${html.escape(ans)}) ${ans ? (q.options ? q.options[ans.charCodeAt(0) - 65] || '' : '') : '（無答案）'}</div>
<div class="explanation">${law_html}${src_html}</div>
</div>
`;
        
        container.appendChild(card);
    });
    
    showQuestion(0);
}

function showQuestion(idx) {
    currentIndex = idx;
    
    // Update progress
    const progress = ((idx + 1) / currentQuiz.length) * 100;
    document.getElementById('progressFill').style.width = progress + '%';
    
    // Update buttons
    document.getElementById('prevBtn').disabled = idx === 0;
    document.getElementById('nextBtn').textContent = idx === currentQuiz.length - 1 ? '完成' : '下一題 →';
    
    // Scroll to question
    const card = document.getElementById(`q-${idx}`);
    if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
}

function selectAnswer(qIdx, optIdx) {
    if (answered[qIdx]) return;
    
    answered[qIdx] = true;
    const q = currentQuiz[qIdx];
    const ans = q.ans || '';
    
    const selectedLetter = String.fromCharCode(65 + optIdx);
    const isCorrect = ans && selectedLetter === ans;
    
    // Disable all options
    for (let i = 0; i < (q.options ? q.options.length : 0); i++) {
        const opt = document.getElementById(`opt-${qIdx}-${i}`);
        opt.classList.add('disabled');
        opt.onclick = null;
        
        const letter = String.fromCharCode(65 + i);
        if (letter === ans) {
            opt.classList.add('correct');
        }
    }
    
    // Mark wrong selection
    if (!isCorrect) {
        document.getElementById(`opt-${qIdx}-${optIdx}`).classList.add('wrong');
        wrongQuestions.push(q);
    }
    
    // Show answer reveal
    const reveal = document.getElementById(`reveal-${qIdx}`);
    reveal.classList.add('show');
    
    // Update wrong count badge
    document.getElementById('wrongCountBadge').textContent = wrongQuestions.length;
}

function nextQuestion() {
    if (currentIndex < currentQuiz.length - 1) {
        showQuestion(currentIndex + 1);
    } else {
        showResult();
    }
}

function prevQuestion() {
    if (currentIndex > 0) {
        showQuestion(currentIndex - 1);
    }
}

function showResult() {
    const total = currentQuiz.length;
    const correct = total - wrongQuestions.length;
    const score = total > 0 ? Math.round((correct / total) * 100) : 0;
    
    const container = document.getElementById('questionsContainer');
    container.innerHTML = `
<div style="text-align: center; padding: 40px;">
<h2>🎉 測驗完成！</h2>
<div style="font-size: 64px; font-weight: bold; color: #2196F3; margin: 20px 0;">${score}%</div>
<div style="font-size: 18px; color: #333; margin-bottom: 10px;">
✅ 正確：${correct} 題 | ❌ 錯誤：${wrongQuestions.length} 題
</div>
<div style="font-size: 14px; color: #666; margin-bottom: 30px;">
${score >= 90 ? '🌟 優秀！你已經準備好了！' : score >= 80 ? '👍 不錯！繼續加強弱項。' : score >= 70 ? '💪 還不錯，但還有進步空間。' : score >= 60 ? '📚 需要再加強，建議複習高頻主題。' : '🔥 建議從頭複習，先 focus 高頻主題。'}
</div>
<button onclick="backToStart()" style="padding: 15px 40px; font-size: 18px; background: #4CAF50; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 5px;">重新開始</button>
<button onclick="showWrongReview()" style="padding: 15px 40px; font-size: 18px; background: #ff9800; color: #fff; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin: 5px;">複習錯題 (${wrongQuestions.length})</button>
</div>
`;
    
    document.getElementById('nav-buttons')?.classList.add('hidden');
}

function showWrongReview() {
    const container = document.getElementById('wrongReviewContent');
    if (wrongQuestions.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #666; padding: 40px;">🎉 目前沒有錯題！繼續保持！</p>';
    } else {
        let html = '';
        wrongQuestions.forEach((q, idx) => {
            const ans = q.ans || '';
            const law_ref = q.law_ref || {};
            const source = q.source || '';
            
            let law_html = '';
            if (law_ref && law_ref.url) {
                law_html = `<br><a href="${html.escape(law_ref.url)}" target="_blank" class="law-link">📖 ${html.escape(law_ref.law || '')} ${html.escape(law_ref.article || '')}</a>`;
            }
            
            let src_html = '';
            if (source) {
                src_html = `<div class="source">📄 來源：${html.escape(source)}</div>`;
            }
            
            html += `
<div class="wrong-item">
<div class="q-text">${idx + 1}. ${html.escape(q.q)}</div>
<div class="correct-answer">正確答案：(${html.escape(ans)}) ${ans ? (q.options ? q.options[ans.charCodeAt(0) - 65] || '' : '') : '（無答案）'}</div>
${law_html}
${src_html}
</div>
`;
        });
        container.innerHTML = html;
    }
    
    document.getElementById('quizArea').classList.add('hidden');
    document.getElementById('wrongReviewArea').classList.remove('hidden');
}

function backToQuiz() {
    document.getElementById('wrongReviewArea').classList.add('hidden');
    document.getElementById('quizArea').classList.remove('hidden');
}

function backToStart() {
    document.getElementById('quizArea').classList.add('hidden');
    document.getElementById('wrongReviewArea').classList.add('hidden');
    document.getElementById('questionsContainer').innerHTML = '';
    document.getElementById('nav-buttons')?.classList.remove('hidden');
}
</script>
</body>
</html>
