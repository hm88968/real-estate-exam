 "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 3}, {"subject": "不動產估價概要", "year": "108", "q": "設三宗土地合併後整體開發利用，其合併後價格為2,500 萬元，合併前價格分別為800 萬元、500\n萬元及700 萬元。則對於原來700 萬元之土地，其合併後之價格應為何？", "options": ["(A)825 萬元", "(B)850 萬元", "(C)875 萬元", "(D)895 萬元"], "qnum": 4, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 4}, {"subject": "不動產估價概要", "year": "108", "q": "不動產估價師應兼採二種以上估價方法推算勘估標的價格。以契約約定租金作為不動產證券化受\n益證券信託利益分配基礎者，何種方法之價格應賦予相對較大之權重？", "options": ["(A)成本法", "(B)土地開發分析法", "(C)折現現金流量分析法", "(D)比較法"], "qnum": 6, "ans": "C", "law_ref": {"law": "信託法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000013"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 6}, {"subject": "不動產估價概要", "year": "108", "q": "經比較調整後求得之勘估標的試算價格，應就價格偏高或偏低者重新檢討，經檢討後試算價格差\n距如下，何者應排除該試算價格之適用？", "options": ["(A)百分之二十五", "(B)百分之十五", "(C)百分之十", "(D)百分之五"], "qnum": 7, "ans": "A", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 7}, {"subject": "不動產估價概要", "year": "108", "q": "對於估價目的為不動產買賣交易之參考所為之不動產估價，應評估的價格為：", "options": ["(A)買方希望之價格", "(B)賣方希望之價格", "(C)市場中最可能之成交價格", "(D)買賣雙方希望價格之平均數"], "qnum": 8, "ans": "C", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 8}, {"subject": "不動產估價概要", "year": "108", "q": "勘估標的因位於垃圾掩埋場附近，造成其價格下降，此屬於何種原則？", "options": ["(A)替代原則", "(B)最有效原則", "(C)外部性原則", "(D)供需原則"], "qnum": 9, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 9}, {"subject": "不動產估價概要", "year": "108", "q": "使用與勘估標的相同或極類似之建材標準、設計、配置及施工品質，於價格日期重新複製建築所\n需之成本，稱為：", "options": ["(A)重建成本", "(B)重置成本", "(C)直接成本", "(D)間接成本"], "qnum": 10, "ans": "A", "law_ref": {"law": "建築法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070105"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 10}, {"subject": "不動產估價概要", "year": "108", "q": "政府宣布實施空屋稅政策，此屬於何種影響價格之因素？", "options": ["(A)個別因素", "(B)情況因素", "(C)一般因素", "(D)區域因素"], "qnum": 12, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 12}, {"subject": "不動產估價概要", "year": "108", "q": "就勘估標的之構成部分或全體，調查其使用材料之種別、品級、數量及所需勞力種別、時間等，\n並以勘估標的所在地區於價格日期之各種單價為基礎，計算其營造或施工費的方法為：", "options": ["(A)直接法", "(B)間接法", "(C)工程造價比較法", "(D)單位面積比較法"], "qnum": 13, "ans": "A", "law_ref": {"law": "不動產估價技術規則", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 13}, {"subject": "不動產估價概要", "year": "108", "q": "推算總收入及有效總收入時，應與相關資料校核比較，下列何者非屬該相關資料？", "options": ["(A)目前或未來可能之計畫收入", "(B)相同產業或具替代性比較標的總收入及有效總收入", "(C)期末價值", "(D)勘估標的往年之總收入及有效總收入"], "qnum": 14, "ans": "C", "law_ref": {"law": "不動產估價技術規則", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 14}, {"subject": "不動產估價概要", "year": "108", "q": "有關比較法試算價格之調整運算過程中，遇有下列之情形，須判定該比較標的與勘估標的差異過\n大，應排除該比較標的之適用。何者為正確？", "options": ["(A)區域因素調整率、個別因素調整率，各大於百分之三十", "(B)區域因素及個別因素內之任一單獨項目之價格調整率大於百分之十五", "(C)區域因素調整率與個別因素調整率之和，大於百分之三十", "(D)比較標的性質特殊或區位特殊缺乏市場交易資料，並於估價報告書中敘明者，不在此限"], "qnum": 15, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 15}, {"subject": "不動產估價概要", "year": "108", "q": "不動產估價技術規則第99 條之計算公式，勘估標的之基地價格＝勘估標的之房地價格－勘估標\n的之建物成本價格。請問此為何種學說之主張？", "options": ["(A)土地貢獻說", "(B)建物貢獻說", "(C)聯合貢獻說", "(D)合併貢獻說"], "qnum": 16, "ans": "A", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 16}, {"subject": "不動產估價概要", "year": "108", "q": "不動產估價師蒐集比較實例時，應依循之原則，下列敘述何者錯誤？", "options": ["(A)實例價格形成日期與勘估標的之價格日期接近者", "(B)須蒐集與勘估標的使用性質或使用管制相同者之實例", "(C)須蒐集與勘估標的位於同一供需圈之近鄰地區或類似地區者之實例", "(D)實例價格屬正常價格、可調整為正常價格或與勘估標的價格種類相同者"], "qnum": 18, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 18}, {"subject": "不動產估價概要", "year": "108", "q": "依不動產估價技術規則之規定，運用計量模型分析法進行估價，下列敘述何者錯誤？", "options": ["(A)須蒐集應用計量模型分析關係式自變數個數五倍以上之比較標的", "(B)本法須先求出各主要影響價格因素與比較標的價格二者之關係式，以推算各主要影響價格因素"], "qnum": 21, "ans": "C", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 21}, {"subject": "不動產估價概要", "year": "108", "q": "下列何者非屬不動產估價師受理委託估價之勘估標的？", "options": ["(A)土地及其權利估價", "(B)建築改良物及其權利估價", "(C)不動產租金估計", "(D)不動產稅負之估算"], "qnum": 22, "ans": "D", "law_ref": {"law": "建築法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070105"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 22}, {"subject": "不動產估價概要", "year": "108", "q": "不動產估價師在收集比較標的相關交易等案例及資料時，得向當事人、四鄰、其他不動產估價師、\n不動產經紀人員、地政士、地政機關、金融機構、公地管理機關、司法機關、媒體或有關單位收\n集之。請問：到實價登錄系統查詢交易案例相關資訊，屬向何者收集資料？", "options": ["(A)不動產經紀人", "(B)地政士", "(C)地政機關", "(D)媒體"], "qnum": 23, "ans": "C", "law_ref": {"law": "不動產經紀業管理條例", "article": "第4條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 23}, {"subject": "不動產估價概要", "year": "108", "q": "對具有市場性之不動產，以違反經濟合理性之不動產分割為前提，查估其所形成之價值，並以貨\n幣金額表示者，屬下列那一種價格？", "options": ["(A)特殊價格", "(B)特定價格", "(C)正常價格", "(D)限定價格"], "qnum": 24, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產估價概要ANS.pdf", "source_qnum": 24}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "不動產之買賣、互易、租賃或代理銷售，如委由經紀業仲介或代銷者，下列何者不屬不動產經紀\n業管理條例規定經紀業應指派經紀人簽章之文件？", "options": ["(A)不動產承租、承購委託契約書", "(B)不動產承租、承購要約書", "(C)定金收據", "(D)不動產廣告稿"], "qnum": 3, "ans": "A", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 3}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "有下列何種情形者，不得申請經營經紀業，其經許可者，撤銷或廢止其許可？", "options": ["(A)犯詐欺、背信、侵占罪經受有期徒刑一年以上刑之宣告確定，執行完畢或赦免後已滿三年者", "(B)曾經營經紀業，經主管機關撤銷或廢止許可，自撤銷或廢止之日起已滿五年者", "(C)受停止營業處分，已執行完畢者", "(D)受廢止經紀人員證書或證明處分未滿五年者"], "qnum": 5, "ans": "D", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 5}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "甲通過不動產經紀人考試並領有不動產經紀人證書，從事不動產仲介業務多年，同時擔任乙\n仲介公司董事長。執業期間因車禍腦部受創而受法院監護宣告，成為無行為能力人。下列敘\n述何者正確？", "options": ["(A)甲得繼續充任不動產經紀人，其資格不受影響", "(B)主管機關應予甲申誡處分", "(C)主管機關應廢止乙公司之營業許可", "(D)由主管機關命乙公司限期改善；逾期未改善者，廢止其許可，並通知公司或商業登記主管機關"], "qnum": 6, "ans": "D", "law_ref": {"law": "民法", "article": "第15條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 6}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "甲公司接受乙建築公司之委託，簽訂委託契約書後，負責企劃並代理銷售乙公司新推出之公寓大\n廈預售屋。下列敘述何者正確？", "options": ["(A)雙方應簽訂委託銷售契約書，並由乙公司指派經紀人於契約書簽章", "(B)甲公司於簽訂委託銷售契約書前，即得刊登廣告並開始銷售", "(C)甲公司應將報酬標準及收取方式揭示於營業處所明顯之處", "(D)乙公司之不動產廣告及銷售內容，應與事實相符，並註明甲公司名稱"], "qnum": 7, "ans": "D", "law_ref": {"law": "民法", "article": "第103條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 7}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "公平交易法規定，法院因被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上\n之賠償。但不得超過已證明損害額之幾倍？", "options": ["(A)二倍", "(B)三倍", "(C)四倍", "(D)五倍"], "qnum": 8, "ans": "B", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 8}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "不動產經紀業者以下何種行為不涉及違法聯合行為？", "options": ["(A)共同決定服務報酬收費標準，或協議限制服務報酬之調整", "(B)協議拒絕其他不動產經紀業者參與聯賣", "(C)共同約束開發物件必須與委託人簽訂一般委託契約", "(D)共同約束專任委託契約之期間"], "qnum": 9, "ans": "C", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 9}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "下列何者非屬內政部所頒不動產說明書不得記載事項之內容？", "options": ["(A)附屬建物除陽台外，其餘項目不得計入買賣價格", "(B)不得記載本說明書內容僅供參考", "(C)不得使用實際所有權面積以外之「受益面積」、「銷售面積」、「使用面積」等類似名詞", "(D)預售屋出售標的，不得記載未經依法領有建造執照之夾層設計或夾層空間面積"], "qnum": 10, "ans": "A", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 10}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "安心社區擬於近日召開區分所有權人定期會議，討論社區管理事宜，同時選任新的管理委員。社\n區規約對於定期會議之召集程序及管理委員之選任事項，未定有特別規定。請問：管理委員會主\n任委員召集會議時，下列何項程序有違公寓大廈管理條例之規定？", "options": ["(A)於開會前十日通知各區分所有權人", "(B)以書面通知載明開會內容", "(C)逕以公告代替書面通知，公告期間多於二日", "(D)有關管理委員之選任事項，在開會通知中載明並公告之"], "qnum": 11, "ans": "C", "law_ref": {"law": "公寓大廈管理條例", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 11}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "甲房屋仲介公司擬與乙房屋仲介公司合併，下列何種情形不須先向公平交易委員會提出申報？", "options": ["(A)甲公司已持有乙公司達百分之五十以上之有表決權股份", "(B)兩家公司合併後之市場占有率達三分之一", "(C)乙公司之市場占有率已達四分之一", "(D)甲公司上一會計年度銷售金額，超過公平交易委員會所公告之金額"], "qnum": 12, "ans": "A", "law_ref": {"law": "不動產經紀業管理條例", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070046"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 12}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "某直轄市內有競爭關係之甲、乙、丙、丁不動產仲介業者相互協議，就仲介成交之房屋買賣或租\n賃案件一律收取固定之服務報酬。試問：甲、乙、丙、丁之協議行為，可能構成公平交易法所規\n定之何種行為？", "options": ["(A)獨占", "(B)結合", "(C)聯合", "(D)杯葛"], "qnum": 13, "ans": "C", "law_ref": {"law": "不動產經紀業管理條例", "article": "第19條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 13}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "定型化契約中之條款可以分為定型化契約條款及個別磋商條款兩種，兩者如果發生不一致情形\n時，以下何者正確？", "options": ["(A)個別磋商條款具有高於所有定型化契約條款之效力", "(B)由於個別磋商條款，係經過契約當事人個別磋商而合意約定的契約條款，相較於僅由企業經營"], "qnum": 14, "ans": "B", "law_ref": {"law": "不動產經紀業管理條例", "article": "第19條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 14}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "關於消費者保護法所稱分期付款買賣，以下何者正確？", "options": ["(A)指買賣契約約定消費者支付頭期款，餘款分期支付之交易型態", "(B)預售屋分期付款買賣，價金分期給付，是消費者保護法有關分期付款買賣", "(C)分期付款買賣契約書未記載利率者，其利率按現金交易價格週年利率百分之六計算之", "(D)分期付款買賣契約書應記載各期價款與其他附加費用合計之總價款與現金交易價格之差額"], "qnum": 15, "ans": "D", "law_ref": {"law": "消費者保護法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=J0070001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 15}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "消費者與企業經營者因商品或服務發生消費爭議，消費者向企業經營者申訴時，企業經營者對於\n消費者的申訴，以下何者正確？", "options": ["(A)從企業經營者接獲消費者申訴的當日開始起算十日內予以妥適處理", "(B)從企業經營者接獲消費者申訴的當日開始起算十五日內予以妥適處理", "(C)從消費者為申訴的那一天開始起算十五日內予以妥適處理", "(D)從消費者為申訴的那一天開始起算十日內予以妥適處理"], "qnum": 16, "ans": "B", "law_ref": {"law": "消費者保護法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=J0070001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 16}, {"subject": "不動產經紀相關法規概要", "year": "103", "q": "甲、乙、丙三公司分別為從事A 商品之設計、製造及銷售之企業經營者。假設消費者丁購買丙\n公司銷售之A 商品，造成丁的兒子受到傷害，依消費者保護法規定，甲公司應負何種責任？", "options": ["(A)不須負任何責任", "(B)與乙、丙公司比例分擔損害賠償責任", "(C)與乙、丙公司負連帶賠償責任。但能證明其無過失者，法院得減輕其賠償責任", "(D)與乙、丙公司負連帶賠償責任。但其對於損害之防免已盡相當之注意，或縱加以相當之注意而"], "qnum": 17, "ans": "D", "law_ref": {"law": "消費者保護法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=J0070001"}, "source": null}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "依消費者保護法規定，消費者與企業經營者間因商品或服務所生之爭議，得選擇申訴、調解及訴\n訟途徑，尋求救濟。下列有關申請調解之敘述，何者正確？", "options": ["(A)調解屬於司法解決途徑", "(B)申訴與調解並無先後之分，未提起申訴仍得申請調解", "(C)調解須向直轄市、縣（市）政府消費者保護官申請", "(D)調解成立者，調解書經法院核定後，與民事確定判決有同一之效力"], "qnum": 18, "ans": "D", "law_ref": {"law": "消費者保護法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=J0070001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 18}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "消費者因使用商品或接受服務，造成權利受損，依消費者保護法規定得提起團體訴訟，向企業經\n營者求償。有關團體訴訟之敘述，下列何者正確？", "options": ["(A)至少有五十人將損害賠償請求權讓與經主管機關核定之優良消費者保護團體", "(B)消費者保護團體係以自己名義提起訴訟", "(C)損害賠償僅限於財產上之損害，不包括非財產上之損害", "(D)消費者團體就此項訴訟，得向消費者請求報酬"], "qnum": 19, "ans": "B", "law_ref": {"law": "消費者保護法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=J0070001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 19}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "關於不動產經紀人設置之敘述，以下何者正確？", "options": ["(A)營業處所經紀營業員數每逾10 名時，應增設經紀人1 人", "(B)經紀業設立之營業處所至少應置經紀人1 人，但非常態營業處所，其所銷售總金額達新臺幣6"], "qnum": 20, "ans": "B", "law_ref": {"law": "不動產經紀業管理條例", "article": "第4條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 20}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "公寓大廈專有部分之共同壁及樓地板或其內之管線，其維修費用，以下敘述何者正確？", "options": ["(A)修繕費係因非可歸責於區分所有權人之事由所致者，由該區分所有權人負擔", "(B)由該共同壁雙方或樓地板上下方之區分所有權人共同負擔", "(C)由公共基金負擔", "(D)由管理委員會負擔"], "qnum": 21, "ans": "B", "law_ref": {"law": "公寓大廈管理條例", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 21}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "下列何者，得為公寓大廈約定專用部分？", "options": ["(A)連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳", "(B)社區內各巷道、防火巷弄", "(C)公寓大廈基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造", "(D)樓頂平臺"], "qnum": 22, "ans": "D", "law_ref": {"law": "公寓大廈管理條例", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 22}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "以下有關公寓大廈區分所有權人會議及管理委員會兩者間關係之說明，何者錯誤？", "options": ["(A)管理委員會有執行區分所有權人會議決議事項之義務", "(B)管理委員會會議決議之內容不得違反區分所有權人會議決議", "(C)管理委員會不得為訴訟之原告或被告，如起訴或被訴時，應通知區分所有權人擔當訴訟", "(D)管理委員會應向區分所有權人會議負責，並向其報告會務"], "qnum": 23, "ans": "C", "law_ref": {"law": "公寓大廈管理條例", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 23}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "向上大樓已成立管理委員會，並將公共基金存放銀行專戶。住戶希望閒置的公共基金能獲取較銀\n行存款更高的投資報酬，擬交付信託。試問：依公寓大廈管理條例規定，應如何處理？", "options": ["(A)經管理委員會決議後，由負責財務管理之管理委員交付信託", "(B)經區分所有權人會議決議後，由管理委員會交付信託", "(C)由管理委員會主任委員直接交付信託", "(D)由負責財務管理之管理委員直接交付信託"], "qnum": 24, "ans": "B", "law_ref": {"law": "公寓大廈管理條例", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 24}, {"subject": "不動產經紀相關法規概要", "year": "108", "q": "下列有關公寓大廈規約之敘述，何者正確？", "options": ["(A)由管理委員會訂定", "(B)內政部訂頒之「公寓大廈規約範本」具強制效力，公寓大廈訂定規約不得違反該範本之內容", "(C)就住戶違反義務之處理方式，非經載明於規約，不生效力", "(D)規約訂定後，應向主管機關報備，始生效力"], "qnum": 25, "ans": "C", "law_ref": {"law": "公寓大廈管理條例", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/不動產經紀相關法規概要ANS.pdf", "source_qnum": 25}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "因登記錯誤遺漏或虛偽致受有損害者，由該地政機關負損害賠償責任，此項損害賠償之請求，如\n經該地政機關拒絕，受損害人得採取下列何種處理方式？", "options": ["(A)向行政院申訴", "(B)向立法院告發", "(C)向司法機關起訴", "(D)向監察院告發"], "qnum": 2, "ans": "C", "law_ref": {"law": "民法", "article": "第213條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 2}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "平均地權條例規定照價收買後之土地，其權屬應為？", "options": ["(A)國有", "(B)直轄市、縣（市）有", "(C)鄉鎮有", "(D)公營事業有"], "qnum": 3, "ans": "B", "law_ref": {"law": "平均地權條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130015"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 3}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "下列有關土地徵收條例的優先購買權敘述，何者正確？", "options": ["(A)行使主體係被徵收之原土地所有權人或其繼承人", "(B)行使原因須被徵收土地經依徵收計畫使用後，依法變更原使用目的而讓售", "(C)行使條件須與讓售條件相同，且應公告三個月", "(D)行使期間須於讓售決定後十日內表示優先購買"], "qnum": 4, "ans": "A", "law_ref": {"law": "土地法", "article": "第104條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 4}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "下列有關基地房屋之優先購買權敘述，何者正確？", "options": ["(A)基地出賣時，抵押權人有依同樣條件優先購買之權", "(B)房屋出賣時，抵押權人有依同樣條件優先購買之權", "(C)優先購買權人，於接到出賣通知後一個月內不表示者，其優先權視為放棄", "(D)出賣人未通知優先購買權人而與第三人訂立買賣契約者，其契約不得對抗優先購買權人"], "qnum": 5, "ans": "D", "law_ref": {"law": "土地法", "article": "第104條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 5}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "下列有關平均地權條例及土地稅法中有關累進課地價稅之敘述，何者正確？", "options": ["(A)超過累進起點地價未達五倍者，就其超過部分課徵千分之三十", "(B)超過累進起點地價五倍至十倍者，就其超過部分課徵千分之三十五", "(C)超過累進起點地價十倍至十五倍者，就其超過部分課徵千分之四十", "(D)超過累進起點地價十五倍至二十倍者，就其超過部分課徵千分之四十五"], "qnum": 7, "ans": "D", "law_ref": {"law": "土地稅法", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130013"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 7}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "預告登記，對於因下列何種法律行為或事實而為之新登記，無排除之效力？", "options": ["(A)重劃", "(B)繼承", "(C)徵收", "(D)都市更新"], "qnum": 8, "ans": "C", "law_ref": {"law": "土地法", "article": "第79條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 8}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "山坡地範圍內森林區、山坡地保育區及風景區之土地，在未編定使用地之類別前，適用何種管制？", "options": ["(A)林業用地", "(B)農牧用地", "(C)國土保安用地", "(D)原住民保留地"], "qnum": 9, "ans": "A", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 9}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "依土地稅法規定，關於地價稅之納稅義務人，下列何項敘述錯誤？", "options": ["(A)信託土地，於信託關係存續中，為受託人", "(B)設有典權土地，為出典人", "(C)承領土地，為承領人", "(D)承墾土地，為耕作權人"], "qnum": 11, "ans": "B", "law_ref": {"law": "土地稅法", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130013"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 11}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "依都市計畫法規定，都市計畫區內之公園、體育場所、綠地、廣場及兒童遊樂場，應依計畫人口\n密度及自然環境，作有系統之布置，除具有特殊情形外，其占用土地總面積不得少於全部計畫面\n積百分之幾？", "options": ["(A)百分之十", "(B)百分之十二", "(C)百分之十五", "(D)百分之十七"], "qnum": 12, "ans": "A", "law_ref": {"law": "都市計畫法", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0110001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 12}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "依平均地權條例之規定，直轄市或縣（市）政府對於尚未建築之私有建築用地之處理方式，下列\n何項敘述錯誤？", "options": ["(A)除有特殊情形外，應限制尚未建築用地面積最高額以十公畝為限", "(B)對於超額私有建築用地，應通知土地所有權人於二年內出售或建築使用", "(C)逾期未出售或未建築使用者，得予照價收買", "(D)照價收買價格，按收買當時查估之正常市價"], "qnum": 13, "ans": "D", "law_ref": {"law": "民法物權編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000003"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 13}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "出租之公、私有耕地因實施市地重劃致不能達到原租賃之目的者，可由直轄市或縣（市）政府逕\n為註銷其租約並通知當事人，如重劃後分配土地者，承租人得請求之補償，下列何項為正確？", "options": ["(A)按重劃計畫書公告當期該土地公告土地現值減除預計土地增值稅後餘額之三分之一", "(B)按重劃計畫書公告當期該土地查估之市價減除預計土地增值稅後餘額之三分之一", "(C)按重劃計畫書公告當期該土地之公告土地現值之三分之一", "(D)按重劃計畫書公告當期該土地查估之市價之三分之一"], "qnum": 14, "ans": "C", "law_ref": {"law": "土地法", "article": "第56條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 14}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "都市計畫應依據現在及既往情況，並預計未來幾年內之發展情形訂定之？", "options": ["(A)十五年", "(B)二十年", "(C)二十五年", "(D)三十年"], "qnum": 15, "ans": "C", "law_ref": {"law": "都市計畫法", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0110001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 15}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "甲將其所有X 地號土地出售予乙後，由甲會同乙申辦土地買賣移轉登記時，請問本案應按何標\n準計收千分之一的登記費？", "options": ["(A)該筆土地的公告現值", "(B)該筆土地的公告地價", "(C)該筆土地的買賣實價", "(D)該筆土地的申報地價"], "qnum": 16, "ans": "D", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 16}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "已公告徵收之土地，需用土地人應切實按核准計畫及所定期限使用。在未依徵收計畫完成使用\n前，需用土地人應每年檢討其興辦事業計畫，並由其上級事業主管機關列管。有下列那種情形，\n應辦理撤銷徵收？", "options": ["(A)因工程變更設計，致原徵收之土地不在工程用地範圍內", "(B)土地徵收計畫開始使用前，興辦之事業改變、興辦事業計畫經註銷、開發方式改變或取得方式"], "qnum": 17, "ans": "C", "law_ref": {"law": "土地法", "article": "第208條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 17}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "下列土地何者屬於土地法第四條所稱的公有土地？", "options": ["(A)所有權人登記為台灣糖業股份有限公司", "(B)所有權人登記為臺灣石門農田水利會", "(C)所有權人登記為國家中山科學研究院", "(D)所有權人登記為埔里鎮"], "qnum": 18, "ans": "D", "law_ref": {"law": "民法物權編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000003"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 18}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "依法得分割之共有土地或建築改良物，共有人不能自行協議分割者，任何共有人得申請該管直轄\n市、縣（市）地政機關調處，不服調處者，應於接到調處通知後幾日內向司法機關訴請處理？", "options": ["(A)十五日", "(B)二十日", "(C)二十五日", "(D)三十日"], "qnum": 19, "ans": "A", "law_ref": {"law": "民法", "article": "第817條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 19}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "非都市土地申請開發達一定規模者，應辦理土地使用分區變更，下列何項敘述錯誤？", "options": ["(A)申請開發社區之計畫達五十戶或土地面積在一公頃以上，應變更為鄉村區", "(B)申請開發為工業使用之土地面積達十公頃以上，應變更為工業區", "(C)申請開發遊憩設施之土地面積達五公頃以上，應變更為特定專用區", "(D)申請開發高爾夫球場之土地面積達五公頃以上，應變更為特定專用區"], "qnum": 20, "ans": "D", "law_ref": {"law": "公寓大廈管理條例", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070075"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 20}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "土地所有權辦理買賣移轉登記時，申報土地移轉現值之審核標準，下列何項敘述錯誤？", "options": ["(A)申報人於訂定契約之日起三十日內申報者，以訂約日當期之公告土地現值為準", "(B)申報人逾訂定契約之日起三十日始申報者，以受理申報機關收件日當期之公告土地現值為準", "(C)遺贈之土地，以遺贈人死亡日當期之公告土地現值為準", "(D)依法院判決移轉登記者，以判決確定日當期之公告土地現值為準"], "qnum": 22, "ans": "D", "law_ref": {"law": "民法", "article": "第765條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 22}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "區段徵收土地時，地價補償得經土地所有權人申請，以徵收後可供建築之抵價地折算抵付，而抵\n價地總面積，以徵收總面積百分之五十為原則，如因情況特殊，經上級主管機關核准者，不在此\n限，但不得少於百分之四十；惟曾經農地重劃者，該重劃地區部分之抵價地不得少於多少？", "options": ["(A)百分之四十三", "(B)百分之四十五", "(C)百分之四十七", "(D)百分之四十九"], "qnum": 23, "ans": "B", "law_ref": {"law": "土地法", "article": "第218條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 23}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "依規定民國109 年需辦理重新規定地價，下列對規定地價或重新規定地價之敘述，何項錯誤？", "options": ["(A)規定地價或重新規定地價後，每二年重新規定地價一次，但必要時得延長之", "(B)須分區調查最近一年之土地買賣價格或收益價格", "(C)公告及申報地價，其期限為三十日", "(D)申報地價未滿公告地價百分之八十時，得照價收買或以公告地價為其申報地價"], "qnum": 24, "ans": "D", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 24}, {"subject": "土地法與土地相關稅法概要", "year": "108", "q": "非都市土地依區域計畫法施行細則之規定，得劃定幾種使用區？編定幾種使用地？", "options": ["(A)十種使用區；十八種使用地", "(B)十種使用區；十九種使用地", "(C)十一種使用區；十八種使用地", "(D)十一種使用區；十九種使用地"], "qnum": 25, "ans": "D", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 25}, {"subject": "民法概要", "year": "108", "q": "下列何者非屬我國民法上所稱之「土地的定著物」？", "options": ["(A)燈塔", "(B)房屋", "(C)柏油馬路", "(D)蓄水池"], "qnum": 1, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 1}, {"subject": "民法概要", "year": "108", "q": "依我國民法之規定，以下關於行為能力之敘述，何者錯誤？", "options": ["(A)無行為能力人之意思表示，無效", "(B)限制行為能力人未得法定代理人之允許，所為之單獨行為，效力未定", "(C)限制行為能力人所訂立之契約，未經承認前，相對人得撤回之", "(D)限制行為能力人用詐術使人信其為有行為能力人或已得法定代理人之允許者，其法律行為為有效"], "qnum": 2, "ans": "B", "law_ref": {"law": "民法", "article": "第15條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 2}, {"subject": "民法概要", "year": "108", "q": "甲受丙之詐欺，而授權乙向不知情的丁購買A 屋，請問依我國民法的規定，下列敘述何者正確？", "options": ["(A)甲因受丙之詐欺而為意思表示，故可撤銷其授權乙之行為", "(B)甲因受丙之詐欺而為意思表示，故可撤銷A 屋之買賣契約", "(C)甲若欲行使民法第92 條之撤銷權，應於發現詐欺後，一年內為之。但自意思表示後，經過十"], "qnum": 3, "ans": "C", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 3}, {"subject": "民法概要", "year": "108", "q": "依我國民法之規定，下列關於夫妻財產制之敘述，何者錯誤？", "options": ["(A)夫妻未以契約訂立夫妻財產制者，除民法另有規定外，以共同財產制，為其夫妻財產制", "(B)夫妻財產制契約之訂立、變更或廢止，應以書面為之", "(C)夫妻財產制契約之訂立、變更或廢止，非經登記，不得以之對抗第三人", "(D)夫妻於婚姻關係存續中，得以契約廢止其財產契約，或改用他種約定財產制"], "qnum": 5, "ans": "A", "law_ref": {"law": "民法", "article": "第1047條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 5}, {"subject": "民法概要", "year": "108", "q": "依我國民法，下列關於地上權之敘述，何者錯誤？", "options": ["(A)地上權設定後，因土地價值之昇降，依原定地租給付顯失公平者，當事人得請求法院增減之", "(B)地上權人，縱因不可抗力，妨礙其土地之使用，不得請求免除或減少租金", "(C)地上權人得將其權利讓與他人或設定抵押權。但契約另有約定或另有習慣者，不在此限", "(D)地上權人積欠地租達一年之總額，除另有習慣外，土地所有人得定相當期限催告地上權人支付"], "qnum": 8, "ans": "D", "law_ref": {"law": "民法", "article": "第840條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 8}, {"subject": "民法概要", "year": "108", "q": "甲未婚生有乙、丙、丁三子，某日甲因細故與乙口角，乙遂憤而毆打甲成傷，當時丙雖在場，然\n畏懼乙身強體壯，並未勸阻。甲心灰意冷，當場表示自己百年後，乙不得繼承其財產；事後更逢\n人便訴說丙也不孝，未挺身護甲。丙得知此事甚為憤怒，認為自己僅求自保並沒有錯，遂在某日\n憤而持刀殺甲，經丁阻止而未得逞，但日後仍經法院判決殺人未遂而受刑之宣告確定。不久甲因\n年老體衰而去世，請問下列敘述，何者正確？", "options": ["(A)甲僅表示乙不得繼承其財產，未表示丙不得繼承，故丙仍可繼承其財產", "(B)甲雖表示乙不得繼承其財產，但並未追訴乙之傷害罪，乙既未受刑之宣告，故乙仍得繼承甲的"], "qnum": 10, "ans": "D", "law_ref": {"law": "民法", "article": "第1147條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 10}, {"subject": "民法概要", "year": "108", "q": "依我國民法之規定，下列關於居間契約之敘述何者錯誤？", "options": ["(A)稱居間者，謂當事人約定，一方為他方報告訂約之機會或為訂約之媒介，他方給付報酬之契約", "(B)約定之報酬，較居間人所任勞務之價值，為數過鉅失其公平者，法院得因報酬給付義務人之請"], "qnum": 11, "ans": "B", "law_ref": {"law": "民法", "article": "第565條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 11}, {"subject": "民法概要", "year": "108", "q": "10 歲的男童A 去同學B 家中一起打電動遊戲時，因一言不合吵起來，一氣之下摔壞B 父甲新購\n買的筆電。請問下列敘述何者錯誤？", "options": ["(A)若摔壞筆電時A 有識別能力，則由A 單獨負責，甲不可向A 之法定代理人乙求償", "(B)若摔壞筆電時A 有識別能力，則A 和其法定代理人乙必須連帶負賠償責任", "(C)若摔壞筆電時A 無識別能力，則A 無須負責", "(D)若摔壞筆電時A 無識別能力，則由其法定代理人乙單獨負責，但乙可舉證免責"], "qnum": 12, "ans": "D", "law_ref": {"law": "民法", "article": "第103條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 10}, {"subject": "民法概要", "year": "108", "q": "甲並無將其所有價值十萬元之A 手錶出售的意思，卻向乙表示欲以五千元出售之，乙明知甲無\n出售A 手錶之意思，仍當場表示願意以五千元購買時，甲出售A 手錶之意思表示的效力如何？", "options": ["(A)有效", "(B)無效", "(C)甲得撤銷", "(D)效力未定"], "qnum": 13, "ans": "B", "law_ref": {"law": "民法", "article": "第86條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 13}, {"subject": "民法概要", "year": "108", "q": "甲授與甫滿十八歲之乙代理權，由乙處理出售甲所有之A 機車的事宜。乙乃以甲之代理人的名\n義，以一萬元價金與丙訂立買賣A 機車的契約。乙與丙所締結之買賣契約的效力如何？", "options": ["(A)對甲發生效力", "(B)甲未承認前，效力未定", "(C)乙之法定代理人未承認前，效力未定", "(D)乙之法定代理人得撤銷之"], "qnum": 14, "ans": "A", "law_ref": {"law": "民法", "article": "第345條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 14}, {"subject": "民法概要", "year": "108", "q": "甲、乙締結買賣甲所有之A 屋的契約，乙並先為部分價金之給付。其後，乙未依約定期限給付\n剩餘價金。就甲以乙履行遲延而解除A 屋買賣契約之情形，下列敘述，何者正確？", "options": ["(A)經甲定期間催告乙履行，甲得於經相當期限後，不須再為催告，即得解除契約", "(B)甲僅限於法律規定之事由始得解除，不得與乙約定合意解除之事由", "(C)契約經解除後，甲、乙互負回復原狀的義務，甲不得向乙請求損害賠償", "(D)契約經解除後，因乙有可歸責事由，甲返還乙已給付之價金時，不須附加利息"], "qnum": 15, "ans": "A", "law_ref": {"law": "民法", "article": "第345條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 15}, {"subject": "民法概要", "year": "108", "q": "就下列甲、乙間之法律關係，何者為非經登記不生效力的情形？", "options": ["(A)甲、乙間締結買賣甲之不動產的契約時", "(B)乙繼承被繼承人甲之不動產時", "(C)甲以其土地供乙設定不動產役權時", "(D)甲將其有抵押權擔保之債權讓與予乙時"], "qnum": 16, "ans": "C", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 16}, {"subject": "民法概要", "year": "108", "q": "就甲、乙、丙三人對丁負有平均分擔之300 萬元連帶債務的情形，下列敘述，何者正確？", "options": ["(A)甲對丁為債務之承認而中斷時效時，其效力亦及於乙、丙之債務", "(B)丁請求甲支付全額獲勝訴判決後，仍未能自甲受償時，得再請求乙支付全額", "(C)甲清償全額後，如乙不能償還其分擔額，甲亦僅能向丙求償100 萬元", "(D)甲對丁清償100 萬元後，丁即不得再次向甲請求支付剩餘之200 萬元"], "qnum": 17, "ans": "B", "law_ref": {"law": "民法總則編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 17}, {"subject": "民法概要", "year": "108", "q": "甲育有子女乙，丙育有子女丁、戊，乙男與丁女結婚後育有子女己。就此情形，下列敘述何者錯誤？", "options": ["(A)甲、丁為直系姻親", "(B)乙、戊為旁系姻親", "(C)甲、丙為旁系姻親", "(D)己、戊為旁系血親"], "qnum": 20, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 20}, {"subject": "民法概要", "year": "108", "q": "甲將其所有之A 土地上之B 建物讓與乙時，在房屋得使用期限內，乙與甲間有何法律關係？", "options": ["(A)推定有租賃關係", "(B)視為有租賃關係", "(C)推定有普通地上權關係", "(D)視為有普通地上權關係"], "qnum": 21, "ans": "A", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 21}, {"subject": "民法概要", "year": "108", "q": "甲、乙婚後生育有子女丙、丁、戊。戊與己結婚生育有子女庚、辛後，不幸早於其父母去世。就\n甲高齡過世後遺下之財產，下列法定繼承人之應繼分比例，何者正確？", "options": ["(A)乙二分之一、丙四分之一、丁四分之一", "(B)乙三分之一、丙三分之一、丁三分之一", "(C)乙四分之一、丙四分之一、丁四分之一、己四分之一", "(D)乙四分之一、丙四分之一、丁四分之一、庚八分之一、辛八分之一"], "qnum": 22, "ans": "D", "law_ref": {"law": "民法", "article": "第1138條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 22}, {"subject": "民法概要", "year": "108", "q": "甲乙為夫妻，育有一子丙，並共同收養丁為養子。某日甲因交通意外去世，未留有遺囑，請問依\n我國民法的規定，下列敘述，何者錯誤？", "options": ["(A)乙、丙、丁三人得以繼承", "(B)乙、丙、丁三人之應繼分各為三分之一", "(C)在分割遺產前，乙、丙、丁三人對於遺產全部按其應繼分為分別共有", "(D)繼承人對於甲之債務，以因繼承所得遺產為限，負清償責任"], "qnum": 25, "ans": "C", "law_ref": {"law": "民法親屬編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000004"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/108/民法概要ANS.pdf", "source_qnum": 25}, {"subject": "不動產估價概要", "year": "109", "q": "下列有關成本法之建物殘餘價格之敘述，何者正確？", "options": ["(A)建物之殘餘價格率以不超過百分之二十為原則", "(B)建物耐用年數終止後無殘餘價格者，於計算折舊時以最低殘餘價格率提列", "(C)殘餘價格率，指建物於經濟耐用年數屆滿後，於市場上出售之價格占房地總價格之比率", "(D)計算建物殘餘價格時，應考量建物耐用年數終止後所需清理或清除成本"], "qnum": 1, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第25條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 1}, {"subject": "不動產估價概要", "year": "109", "q": "某一建築物重建成本為800 萬元，經濟耐用年數為40 年，物理耐用年數為50 年，該建築物殘餘\n價格為80 萬元，現已完工使用經過10 年，請問該建築物以等速折舊計算時，每年折舊額為多少？", "options": ["(A)14.4 萬元", "(B)16 萬元", "(C)18 萬元", "(D)20 萬元"], "qnum": 2, "ans": "C", "law_ref": {"law": "不動產估價技術規則", "article": "第27條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 2}, {"subject": "不動產估價概要", "year": "109", "q": "進行宗地估價時，下列敘述何者錯誤？", "options": ["(A)以分割為前提之宗地估價，應考慮分割前與分割後之價格變動情形，而予酌量增減", "(B)數筆土地合併為一宗進行土地利用之估價，應以合併後土地估價，並以合併前各筆土地價值比"], "qnum": 3, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 3}, {"subject": "不動產估價概要", "year": "109", "q": "經分析考量市場上類似不動產之正常租金為每年每坪12,000 元，合理空置率為5%，淨收益率為\n75%，貸款資金占不動產價格比率80%，有效總收入乘數為15，請以有效總收入乘數法計算出收\n益資本化率為多少？", "options": ["(A)4.27%", "(B)4.67%", "(C)5.0%", "(D)5.33%"], "qnum": 4, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 4}, {"subject": "不動產估價概要", "year": "109", "q": "對於區分所有建物估價運用樓層別效用比時，下列敘述何者正確？", "options": ["(A)樓層別效用比是各層樓區分所有建物之立體地價差異所形成的樓層別效用比率", "(B)樓層別效用比可從各層樓出售價格案例，扣除開發利潤與土地成本費用後，推算區分所有建物"], "qnum": 5, "ans": "C", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 5}, {"subject": "不動產估價概要", "year": "109", "q": "某大樓座落於原為住宅區變更為商業區之土地，依據目前土地使用管制相關法令規定，該大樓應\n以商業與一般事務所為其法定用途，今勘估標的某層建物未變更為商業區前之原核定用途為住宅\n使用，請問勘估標的之估價處理方式，下列何者較為適當？", "options": ["(A)以現行商業區允許之商業與一般事務所估價，並於估價報告書中敘明", "(B)以現行商業區允許之商業與一般事務所估價，並就住宅用途與建物法定用途估價之差額於估價"], "qnum": 7, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 7}, {"subject": "不動產估價概要", "year": "109", "q": "勘估標的為辦公大樓之第10 層，建物登記面積50 坪，每月每坪正常租金收入為2,000 元，該建\n物大樓經合理市場分析推算空置率為5%，勘估標的每年地價稅、房屋稅及保險費等相關總費用\n推算為200,000 元。請問該建物以直接資本化法估價時，推算其有效總收入為多少？", "options": ["(A)940,000 元", "(B)1,000,000 元", "(C)1,140,000 元", "(D)1,200,000 元"], "qnum": 9, "ans": "C", "law_ref": {"law": "土地稅法", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130013"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 9}, {"subject": "不動產估價概要", "year": "109", "q": "某一筆建築用地將以土地開發分析法推估價格，其資本利息綜合利率為4.8%，該土地開發之土地\n價值比率占60%，建物價值比率占40%，預計開發年數為2 年，請問資本利息年利率應為多少？", "options": ["(A)2.4%", "(B)3.0%", "(C)7.68%", "(D)9.6%"], "qnum": 10, "ans": "B", "law_ref": {"law": "建築法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070105"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 10}, {"subject": "不動產估價概要", "year": "109", "q": "正常價格的定義中，不包含下列那一要件？", "options": ["(A)形成正常價格的不動產具備市場性", "(B)係為有意願的買賣雙方，依專業知識分析與謹慎行動的交易", "(C)有意願之買賣雙方不受債權債務關係或親友關係人等等壓力或脅迫", "(D)經適當市場行銷及交易雙方條件形成之價值"], "qnum": 12, "ans": "D", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 12}, {"subject": "不動產估價概要", "year": "109", "q": "不動產市場是一動態的市場，對於估價的變動原則，下列敘述何者錯誤？", "options": ["(A)不動產估價應掌握影響價格的一般因素、區域因素與個別因素變動，以切合勘察日期當時之價值", "(B)影響不動產價格因素不斷變動，因此估價報告書應載明價格日期與勘察日期", "(C)運用成本法估價時，應分析使用建築材料隨時間變動的成本差異對不動產造成的價格影響", "(D)分析不動產價格景氣週期性變動，以利不動產價格變動趨勢之掌握"], "qnum": 13, "ans": "A", "law_ref": {"law": "建築法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070105"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 13}, {"subject": "不動產估價概要", "year": "109", "q": "某商用不動產之自有資金要求報酬率8%、向銀行融資之利率4%，當自有資金的比重為50%，以\n加權平均資金成本法估算之收益法折現率為何？", "options": ["(A)4%", "(B)6%", "(C)8%", "(D)10%"], "qnum": 14, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第20條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 14}, {"subject": "不動產估價概要", "year": "109", "q": "估價人員應用收益法估價時，若某建物經濟耐用年數45 年、經歷年數10 年、殘價率10%，當採\n取等速折舊型時，建物價格日期當時價值未來每年折舊提存率為何？", "options": ["(A)2%", "(B)2.25%", "(C)2.5%", "(D)3%"], "qnum": 15, "ans": "C", "law_ref": {"law": "不動產估價技術規則", "article": "第20條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 15}, {"subject": "不動產估價概要", "year": "109", "q": "某建築開發公司擬開發建地，開發或建築後預期總銷售金額估計8.8 億元，開發直接成本3 億元、\n間接成本8 千萬元，開發商要求利潤率20%、資本利息綜合利率4%，試問土地開發分析價格多少？", "options": ["(A)32513 萬元", "(B)31083 萬元", "(C)30886 萬元", "(D)30562 萬元"], "qnum": 16, "ans": "A", "law_ref": {"law": "建築法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070105"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 16}, {"subject": "不動產估價概要", "year": "109", "q": "依據不動產估價技術規則，有關成本法資本利息的敘述，下列敘述何者錯誤？", "options": ["(A)資金中自有資金之計息利率應不高於1 年期定存利率", "(B)資金中自有資金之計息利率應不低於活存利率", "(C)借款則以銀行短期放款利率計息", "(D)預售收入之資金以定存利率計息"], "qnum": 17, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 17}, {"subject": "不動產估價概要", "year": "109", "q": "成本法營造施工費求取方式，有分為直接法及間接法兩大類，其中以建築細部工程之各項目單價\n乘以該工程施工數量合計之方法係指下列何者？", "options": ["(A)淨計法", "(B)單位工程法", "(C)工程造價比較法", "(D)單位面積（或體積）比較法"], "qnum": 18, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第25條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 18}, {"subject": "不動產估價概要", "year": "109", "q": "內政部近年積極試辦電腦輔助大量估價(CAMA)，於應用計量模型分析法應符合之條件，下列敘\n述何者錯誤？", "options": ["(A)計量模型分析採迴歸分析者，相關係數不得低於零點八", "(B)須蒐集應用計量模型分析關係式自變數個數五倍以上之比較標的", "(C)計量模型分析採迴歸分析者，其調整後判定係數不得低於零點七", "(D)截距項以外其他各主要影響價格因素之係數估計值同時為零之顯著機率不得大於百分之五"], "qnum": 20, "ans": "A", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 20}, {"subject": "不動產估價概要", "year": "109", "q": "估價人員就某建物使用與勘估標的相同之建材標準、設計、配置及施工品質，於價格日期重新複\n製建築所需之成本，是指下列何者？", "options": ["(A)重置成本", "(B)重製成本", "(C)重建成本", "(D)複舊成本"], "qnum": 21, "ans": "C", "law_ref": {"law": "建築法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070105"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 21}, {"subject": "不動產估價概要", "year": "109", "q": "國內已有不動產證券化的個案，依據不動產估價技術規則規定，以契約約定租金作為不動產證券\n化受益證券信託利益分配基礎者，何種價格應視不同價格所蒐集資料可信度及估價種類目的條件\n差異，考量價格形成因素之相近程度情形賦予相對較大之權重？", "options": ["(A)比較法之實例價格", "(B)土地開發分析價格", "(C)直接資本化法之收益價格", "(D)折現現金流量分析法之收益價格"], "qnum": 22, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 22}, {"subject": "不動產估價概要", "year": "109", "q": "依據不動產估價技術規則，有關成本法建築工期係指自申請建造執照開始至那個時間點為止無間\n斷所需之時間？", "options": ["(A)變更建照執照", "(B)擬定權利變換計畫", "(C)銷售完竣", "(D)建築完成達到可交屋使用"], "qnum": 23, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 23}, {"subject": "不動產估價概要", "year": "109", "q": "某三層樓獨棟透天新成屋，建物登記面積為40 坪，坐落基地登記面積為20 坪，房地之正常價格\n為1200 萬元，經參酌當地市場調查資料，運用估價方法計算出建物價值比率為占房地價格的30%，\n請問該基地單價應為多少？", "options": ["(A)18 萬元/坪", "(B)30 萬元/坪", "(C)42 萬元/坪", "(D)60 萬元/坪"], "qnum": 25, "ans": "C", "law_ref": {"law": "土地登記規則", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070031"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產估價概要ANS.pdf", "source_qnum": 25}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "關於不動產經紀業管理條例立法目的之敘述，下列何者正確？", "options": ["(A)加強公寓大廈之管理維護", "(B)發展租賃住宅服務業", "(C)保障國民消費生活安全", "(D)促進不動產交易市場健全發展"], "qnum": 1, "ans": "D", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 1}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "不動產經紀業管理條例所稱主管機關︰在中央為內政部；在直轄市為直轄市政府何等局處？", "options": ["(A)都市發展、城鄉發展", "(B)產業發展", "(C)地政", "(D)財政"], "qnum": 2, "ans": "C", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 2}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "除依法辦理停業登記者外，經紀業開始營業後自行停止營業達多久以上者，直轄市或縣（市）主\n管機關得廢止其許可？", "options": ["(A)連續三個月以上者", "(B)合計三個月以上者", "(C)連續六個月以上者", "(D)合計六個月以上者"], "qnum": 3, "ans": "C", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 3}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "根據公平交易法，二以上事業，實際上不為價格之競爭，而其全體之對外關係，具有此等規定之\n情形者，視為下列何者？", "options": ["(A)寡占", "(B)獨占", "(C)結合", "(D)聯合"], "qnum": 4, "ans": "B", "law_ref": {"law": "公平交易法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=G0300024"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 4}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "公平交易法第二十條規定，有下列各款行為之一，而有限制競爭之虞者，事業不得為之。其事項\n「不」包括下列何者？", "options": ["(A)無正當理由，對他事業給予差別待遇之行為", "(B)為加強貿易效能，而就國外商品或服務之輸入採取共同行為", "(C)以低價利誘或其他不正當方法，阻礙競爭者參與或從事競爭之行為", "(D)以損害特定事業為目的，促使他事業對該特定事業斷絕供給、購買或其他交易之行為"], "qnum": 5, "ans": "B", "law_ref": {"law": "公平交易法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=G0300024"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 5}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "事業違反公平交易法，致侵害他人權益者，如為事業之故意行為，法院得酌定損害額以上之賠償。\n但不得超過已證明損害額之幾倍？", "options": ["(A)一倍", "(B)三倍", "(C)五倍", "(D)十倍"], "qnum": 7, "ans": "B", "law_ref": {"law": "公平交易法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=G0300024"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 7}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "依消費者保護法所提之訴訟，因企業經營者之故意所致之損害，消費者得請求損害額幾倍以下之\n懲罰性賠償金？", "options": ["(A)一倍", "(B)三倍", "(C)五倍", "(D)十倍"], "qnum": 8, "ans": "C", "law_ref": {"law": "消費者保護法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=J0070001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 8}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "根據消費者保護法，通訊交易或訪問交易之消費者，得於收受商品或接受服務後幾日內，以退回\n商品或書面通知方式解除契約？", "options": ["(A)五日", "(B)七日", "(C)十日", "(D)十五日"], "qnum": 9, "ans": "B", "law_ref": {"law": "消費者保護法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=J0070001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 9}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "關於企業經營者與消費者分期付款買賣契約之敘述，下列何者正確？", "options": ["(A)企業經營者應於契約書載明各期價款與其他附加費用合計之總價款與現金交易價格之差額", "(B)企業經營者未於契約書記載總價款者，消費者不負現金交易價格加計週年利率百分之五以外價"], "qnum": 10, "ans": "A", "law_ref": {"law": "消費者保護法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=J0070001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 10}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "企業經營者違反消費者保護法之定型化契約應記載或不得記載事項者，經主管機關令其限期改正\n而屆期不改正者，第一次處多少罰鍰？", "options": ["(A)新臺幣一萬元以上十萬元以下", "(B)新臺幣二萬元以上二十萬元以下", "(C)新臺幣三萬元以上三十萬元以下", "(D)新臺幣十萬元以上一百萬元以下"], "qnum": 11, "ans": "C", "law_ref": {"law": "消費者保護法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=J0070001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 11}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "關於公寓大廈之公共基金，下列敘述何者正確？", "options": ["(A)起造人就公寓大廈領得使用執照三年內之管理維護事項，應按工程造價一定比例或金額提列", "(B)區分所有權人依管理委員會議決議繳納", "(C)區分所有權人對於公共基金之權利應隨區分所有權之移轉而移轉", "(D)區分所有權人積欠應繳納之公共基金已逾一期或達相當金額，經催告仍不給付者，管理負責人"], "qnum": 12, "ans": "C", "law_ref": {"law": "公寓大廈管理條例", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 12}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "公寓大廈應成立管理委員會或推選管理負責人。下列何種管理委員，不受連選得連任一次之限制？", "options": ["(A)主任委員", "(B)監察委員", "(C)財務委員", "(D)消防委員"], "qnum": 13, "ans": "D", "law_ref": {"law": "公寓大廈管理條例", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 13}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "不動產經紀業應依不動產經紀業管理條例之規定，於營業處所明顯之處，揭示一定之文件。請問\n下列選項何者並非應於營業處所明顯之處揭示的文件？", "options": ["(A)經紀業許可文件", "(B)不動產說明書", "(C)不動產經紀人證書", "(D)報酬標準及收取方式"], "qnum": 14, "ans": "B", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 14}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "關於不動產經紀業管理條例之用辭定義，下列敘述何者正確？", "options": ["(A)預售屋指領有使用執照尚未建造完成而以將來完成之建築物為交易標的之物", "(B)差價係指買方支付斡旋金之交易價格與賣方委託銷售價格之差額", "(C)經紀人員包含經紀人或經紀營業員。經紀人指依本條例規定經營仲介或代銷業務之公司或商"], "qnum": 16, "ans": "D", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 16}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "不動產經紀業者從事不動產買賣之仲介業務時，在向買方收取斡旋金前，未以書面告知買方斡旋\n金契約與內政部版「要約書」之區別及其替代關係等資訊，將違反下列那一項規定？", "options": ["(A)構成欺罔行為，且足以影響交易秩序者，將違反公平交易法第二十五條規定", "(B)不當爭取交易之機會，將違反公平交易法第二十三條規定", "(C)為虛偽不實或引人錯誤之表示或表徵，將違反公平交易法第二十一條規定", "(D)致與他人營業或服務之設施或活動混淆者，將違反公平交易法第二十二條規定"], "qnum": 17, "ans": "A", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 17}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "依公平交易法之規定，事業不得為限制競爭之行為，下列敘述何者錯誤？", "options": ["(A)事業不得限制消費者，就供給之商品轉售與第三人或第三人再轉售時之價格", "(B)以不正當限制交易相對人之事業活動為條件，而與其交易之行為", "(C)以低價利誘或其他不正當方法，阻礙競爭者參與或從事競爭之行為", "(D)無正當理由，對他事業給予差別待遇之行為"], "qnum": 18, "ans": "A", "law_ref": {"law": "消費者保護法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070029"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 18}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "甲為A 屋的所有權人，委託乙仲介公司幫忙賣房子。關於甲乙適用消費者保護法的情形，下列敘\n述何者錯誤？", "options": ["(A)甲和乙所發生之法律關係，屬於消費關係", "(B)乙提出乙定型化契約條款作為契約內容而訂立之委託銷售契約屬於定型化契約", "(C)甲和乙訂定買賣契約約定消費者支付頭期款，餘款分期支付，而企業經營者於收受頭期款時，"], "qnum": 21, "ans": "C", "law_ref": {"law": "消費者保護法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=J0070001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 21}, {"subject": "不動產經紀相關法規概要", "year": "109", "q": "約定專用部分係指公寓大廈共用部分經約定供特定區分所有權人使用者。請問，就公寓大廈管理\n條例之規定，下列敘述何者錯誤？", "options": ["(A)於維護、修繕約定專用部分，必須使用共用部分時，應經區分所有權人會議之同意後為之", "(B)公寓大廈本身所占之地面不得為約定專用部分", "(C)規約除應載明專有部分及共用部分範圍外，約定專用部分之範圍及使用主體，非經載明於規約"], "qnum": 23, "ans": "A", "law_ref": {"law": "公寓大廈管理條例", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/不動產經紀相關法規概要ANS.pdf", "source_qnum": 23}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "依房屋稅條例規定，下列敘述何者錯誤？", "options": ["(A)合法登記之工廠供直接生產使用之自有房屋，免徵房屋稅", "(B)受重大災害，毀損面積佔整棟面積五成以上，必須修復始能使用之私有房屋，免徵房屋稅", "(C)房屋標準價格，每三年重行評定一次，並應依其耐用年數予以折舊，按年遞減其價格", "(D)各級政府機關及地方自治機關之公有辦公房屋及其員工宿舍，免徵房屋稅"], "qnum": 1, "ans": "A", "law_ref": {"law": "房屋稅條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130021"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 1}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "關於契稅稅率依契稅條例之規定，下列敘述何者錯誤？", "options": ["(A)買賣契稅為其契價百分之六", "(B)贈與契稅為其契價百分之六", "(C)占有契稅為其契價百分之六", "(D)典權契稅為其契價百分之六"], "qnum": 2, "ans": "D", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 2}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "土地所有權人於出售土地後，依土地稅法規定，下列何種情形得申請就其已納土地增值稅額內，\n退還其不足支付新購土地地價之數額？", "options": ["(A)土地所有權人於先購買土地後，自完成移轉登記之日起二年後，始行出售土地者", "(B)其新購土地地價超過原出售土地地價，扣除繳納房地交易所得稅後之餘額者", "(C)自耕之農業用地出售後，於二年內另行購買仍供自耕之農業用地者", "(D)土地出售前一年內，曾供營業使用或出租者"], "qnum": 3, "ans": "C", "law_ref": {"law": "土地稅法", "article": "第30條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130013"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 3}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "依平均地權條例規定，為促進土地利用，擴大辦理市地重劃，得獎勵土地所有權人自行組織重劃\n會辦理市地重劃，下列對獎勵土地所有權人辦理市地重劃之敘述，何者錯誤？", "options": ["(A)減半收取土地權利變更登記及換發權利書狀費用", "(B)土地所有權人參加自辦市地重劃所需費用，得向政府指定之銀行或實施平均地權基金申請低利貸款", "(C)自辦市地重劃區抵費地出售時，不計徵土地增值稅", "(D)免徵或減徵地價稅與田賦"], "qnum": 5, "ans": "A", "law_ref": {"law": "土地法", "article": "第56條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 5}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "依都市計畫法之規定，關於都市計畫之變更，下列敘述何者正確？", "options": ["(A)都市計畫之變更，如直接限制一定區域人民之權利者，則其性質即屬公法上之觀念通知", "(B)都市計畫之變更屬法規性質，並非行政處分，都市計畫個別變更範圍外之人民，如因都市計畫"], "qnum": 6, "ans": "D", "law_ref": {"law": "都市計畫法", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0110001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 6}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "關於規定地價，依平均地權條例之規定，下列敘述何者正確？", "options": ["(A)規定地價後，每三年重新規定地價一次。但必要時得延長之", "(B)直轄市或縣（市）主管機關辦理規定地價或重新規定地價時，須分區調查最近一年之土地買賣"], "qnum": 8, "ans": "B", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 8}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "都市計畫法有關公共設施保留地之規定，下列敘述何者正確？", "options": ["(A)公共設施保留地劃設逾二十五年未經政府取得者，得優先辦理徵收", "(B)公共設施保留地，其地價補償以徵收當期毗鄰公共設施保留地之平均公告土地現值為準，必要"], "qnum": 9, "ans": "D", "law_ref": {"law": "都市計畫法", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0110001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 9}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "依平均地權條例之規定，土地所有權移轉或設定典權時，權利人及義務人應於訂定契約之日起幾日\n內，檢同契約及有關文件，共同申請土地所有權移轉或設定典權登記，並共同申報其土地移轉現值？", "options": ["(A)10 日", "(B)20 日", "(C)30 日", "(D)40 日"], "qnum": 10, "ans": "C", "law_ref": {"law": "民法", "article": "第765條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 10}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "關於原土地所有權人申請已徵收土地之收回權，依土地徵收條例規定，下列敘述何者錯誤？", "options": ["(A)被徵收之土地，依原徵收計畫開始使用後未滿五年，不繼續依原徵收計畫使用者", "(B)原土地所有權人應於該管直轄市或縣（市）主管機關通知後三個月內繳還原受領之補償地價及"], "qnum": 11, "ans": "B", "law_ref": {"law": "土地法", "article": "第208條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 11}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "甲有A 屋一棟，出租給乙居住使用。依土地法第100 條之規定，出租人因下列何項情形，得收回房屋？", "options": ["(A)承租人乙因疾病、意外產生有長期住院療養之需要時", "(B)承租人乙積欠租金額，以擔保金抵償之後，尚有1 個月租金未繳時", "(C)承租人乙違反民法第443 條第1 項規定，將該屋轉租給他高中同學時", "(D)承租人乙因為工作調動，無法繼續居住時"], "qnum": 14, "ans": "C", "law_ref": {"law": "民法", "article": "第443條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 14}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "甲有A 屋，與乙簽訂買賣契約但尚未為移轉登記，乙對甲的A 屋移轉請求權申請預告登記。下列\n敘述何者最正確？", "options": ["(A)該預告登記為保全登記、暫時登記，其登記免納登記費", "(B)該預告登記，對於因繼承、強制執行、徵收、法院判決而為之新登記，無排除之效力", "(C)預告登記完畢後，如甲將A 屋移轉於丙，該處分絕對無效", "(D)嗣後甲欲就A 屋申辦抵押權次序變更登記時，應檢附乙的同意書，始得為之"], "qnum": 16, "ans": "A", "law_ref": {"law": "民法", "article": "第345條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 16}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "依土地法規定，下列何種土地不得移轉、設定負擔或租賃於外國人？", "options": ["(A)農地", "(B)墳場用地", "(C)礦地", "(D)學校用地"], "qnum": 17, "ans": "C", "law_ref": {"law": "民法", "article": "第421條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 17}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "依契稅條例規定，買賣契稅，應由下列何者申報納稅？", "options": ["(A)銀行", "(B)出賣人", "(C)買受人", "(D)不動產仲介公司"], "qnum": 18, "ans": "C", "law_ref": {"law": "不動產經紀業管理條例", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070046"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 18}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "依房屋稅條例規定，房屋為信託財產者，於信託關係存續中，下列何者為房屋稅之納稅義務人？", "options": ["(A)委託人", "(B)受託人", "(C)受益人", "(D)監察人"], "qnum": 19, "ans": "B", "law_ref": {"law": "房屋稅條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130021"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 19}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "依都市計畫法規定，下列何種公共設施應按閭鄰單位或居民分布情形適當配置之？", "options": ["(A)社會福利設施", "(B)垃圾處理場", "(C)污水處理廠", "(D)屠宰場"], "qnum": 21, "ans": "A", "law_ref": {"law": "都市計畫法", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0110001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 21}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "依土地法規定，土地登記損害賠償之請求，如經該地政機關拒絕，受損害人得向下列何者起訴？", "options": ["(A)監察院", "(B)行政院", "(C)立法院", "(D)司法機關"], "qnum": 22, "ans": "D", "law_ref": {"law": "民法", "article": "第213條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 22}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "依土地法第53 條規定，因地籍整理而發現之公有土地，下列敘述何者正確？", "options": ["(A)視為無主土地", "(B)應辦理囑託登記", "(C)地政機關逕為登記", "(D)登記時所有權人欄註明為縣（市）有"], "qnum": 23, "ans": "C", "law_ref": {"law": "民法物權編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000003"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 23}, {"subject": "土地法與土地相關稅法概要", "year": "109", "q": "依國土計畫法規定，縣（市）主管機關應於縣（市）國土計畫公告實施後幾年內，依中央主管機\n關指定之日期，公告國土功能分區圖？", "options": ["(A)一", "(B)二", "(C)三", "(D)四"], "qnum": 25, "ans": "D", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 25}, {"subject": "民法概要", "year": "109", "q": "下列關於法律上之物的敘述，何者正確？", "options": ["(A)從物在客觀上需常助主物之效用，且與主物為各自獨立之兩個物，動產或不動產均可為從物", "(B)物之成分或其天然孳息，分離後原則上屬於該成分或天然孳息之占有人", "(C)無權占有他人土地建築房屋，建築完成時，該房屋原則上屬於土地所有人所有", "(D)已足避風雨，可達經濟上使用目的，但屋頂尚未完全完工之房屋，屬土地之成分"], "qnum": 1, "ans": "A", "law_ref": {"law": "建築法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070105"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/民法概要ANS.pdf", "source_qnum": 1}, {"subject": "民法概要", "year": "109", "q": "甲與乙訂立買賣契約，將其二手汽車出賣予乙，若當事人間無特別約定者，關於該汽車之利益及\n危險，下列何者正確？", "options": ["(A)於甲與乙簽訂汽車買賣契約時起，由乙承受", "(B)自該車辦理過戶登記於乙時，由乙承受", "(C)自該車交付於乙時起，由乙承受", "(D)於乙支付價金完畢時，由乙承受"], "qnum": 3, "ans": "C", "law_ref": {"law": "民法", "article": "第345條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/民法概要ANS.pdf", "source_qnum": 3}, {"subject": "民法概要", "year": "109", "q": "下列有關契約成立之敘述，何者錯誤？", "options": ["(A)契約得以要約與承諾之意思表示合致而成立", "(B)契約得以要約交錯之方式而成立", "(C)契約得以承諾交錯之方式而成立", "(D)契約得以要約與意思實現方式而成立"], "qnum": 4, "ans": "C", "law_ref": {"law": "民法", "article": "第86條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/民法概要ANS.pdf", "source_qnum": 4}, {"subject": "民法概要", "year": "109", "q": "甲借給乙100 萬元，借期屆至，甲請求乙返還100 萬元借款，乙因此開立100 萬元之本票交由甲\n受領。下列敘述，何者正確？", "options": ["(A)甲所受領乙開立的100 萬元本票，是債之內容更改", "(B)甲所受領乙開立的100 萬元本票，是抵銷", "(C)甲所受領乙開立的100 萬元本票，是代物清償", "(D)甲所受領乙開立的100 萬元本票，是新債清償"], "qnum": 7, "ans": "D", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/民法概要ANS.pdf", "source_qnum": 7}, {"subject": "民法概要", "year": "109", "q": "下列關於房屋租賃之敘述，何者正確？", "options": ["(A)出租人將租賃之房屋交付承租人後，非經承租人同意，不得將其所有權讓與第三人", "(B)出租人出賣租賃之房屋時，承租人有依同樣條件優先承買之權利", "(C)除有反對之約定外，承租人依法得將其一部分轉租於他人", "(D)房屋租賃之租金，當事人得因其價值之昇降，聲請法院增減之，但以定期租賃為限"], "qnum": 8, "ans": "C", "law_ref": {"law": "民法", "article": "第421條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/民法概要ANS.pdf", "source_qnum": 8}, {"subject": "民法概要", "year": "109", "q": "甲將其名下之房屋出售並交付乙占有，惟尚未辦理所有權登記之前，甲又出售該屋於善意之丙且\n辦理所有權登記完畢。則乙對丙之主張，下列何者正確？", "options": ["(A)乙得依據其與甲所訂立之買賣契約而請求丙塗銷房屋所有權登記", "(B)乙得向丙主張不當得利而請求丙塗銷房屋所有權登記", "(C)乙得向丙主張撤銷權而請求丙塗銷房屋所有權登記", "(D)乙無法請求丙塗銷房屋所有權登記，只得向甲請求債務不履行之損害賠償"], "qnum": 9, "ans": "D", "law_ref": {"law": "民法", "article": "第765條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/民法概要ANS.pdf", "source_qnum": 9}, {"subject": "民法概要", "year": "109", "q": "甲將其土地出售乙，但因價金給付方式仍有爭議，故甲拒絕交付予乙，亦不辦理登記，乙起訴請\n求甲履行買賣契約之給付義務，經判決勝訴確定。下列敘述，何者正確？", "options": ["(A)因甲已將其土地出售乙，故所有權屬於乙", "(B)因乙已取得土地買賣契約給付請求權勝訴確定，故所有權屬於乙", "(C)因甲尚未辦理土地所有權移轉登記於乙，故所有權仍屬於甲", "(D)因該地尚未交付予乙占有，故所有權仍屬於甲"], "qnum": 10, "ans": "C", "law_ref": {"law": "民法", "article": "第345條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/民法概要ANS.pdf", "source_qnum": 10}, {"subject": "民法概要", "year": "109", "q": "甲乙丙共同出資購買一筆A 土地，應有部分各三分之一。下列何種行為應經甲乙丙三個共有人全\n體同意，始為有效？", "options": ["(A)共有人之一將其應有部分移轉予第三人", "(B)共有人之一將其應有部分設定抵押權予第三人", "(C)共有人之一將A 土地設定抵押權予第三人", "(D)共有人之一將A 土地設定有償之地上權予第三人"], "qnum": 13, "ans": "C", "law_ref": {"law": "民法", "article": "第817條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/民法概要ANS.pdf", "source_qnum": 13}, {"subject": "民法概要", "year": "109", "q": "甲現年十七歲，在山中拾獲名貴木材一塊，嗣後該木材遭乙竊取，乙請人雕刻成名貴的佛像，以\n高價出售於惡意的丙，並交付之。下列敘述，何者正確？", "options": ["(A)甲因未滿二十歲，不得占有該木材", "(B)乙不能取得名貴的佛像所有權", "(C)乙將名貴的佛像讓與並交付予丙，係屬無權處分", "(D)甲得向乙請求償還該木材的價額"], "qnum": 15, "ans": "D", "law_ref": {"law": "民法物權編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000003"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/民法概要ANS.pdf", "source_qnum": 15}, {"subject": "民法概要", "year": "103", "q": "甲、乙共有一筆A 土地，面積400 坪，應有部分各為二分之一。下列敘述，何者正確？", "options": ["(A)甲、乙對於共有之A 土地，各有一個所有權，但其權利之行使應受應有部分之限制", "(B)甲、乙對於共有之A 土地，各有200 坪所有權", "(C)應有部分各為二分之一是甲、乙對於共有土地所有權之比例", "(D)對於共有之A 土地，甲、乙分別享有處分權及管理權"], "qnum": 16, "ans": "A", "law_ref": {"law": "民法", "article": "第817條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": null}, {"subject": "民法概要", "year": "109", "q": "甲、乙、丙、丁四人共有一筆A 土地，應有部分各登記為四分之一，甲未經乙、丙、丁之同意，\n擅自占有A 土地四分之三面積的土地，在其上興建一B 屋。下列敘述，何者正確？", "options": ["(A)乙、丙、丁僅得分別請求甲返還占用A 土地四分之一之土地", "(B)乙、丙、丁得分別請求甲返還所占用A 土地四分之三之土地", "(C)乙、丙、丁應共同請求甲返還所占用A 土地四分之一之土地", "(D)乙、丙、丁應共同請求甲返還所占用A 土地四分之三之土地"], "qnum": 17, "ans": "B", "law_ref": {"law": "民法", "article": "第817條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/民法概要ANS.pdf", "source_qnum": 17}, {"subject": "民法概要", "year": "109", "q": "下列關於地上權之敘述，何者正確？", "options": ["(A)地上權人若因不可抗力，妨礙其土地之使用，依法即得請求免除或減少租金", "(B)土地所有權讓與時，地上權人已預付之地租，非經登記，不得對抗第三人", "(C)地上權人須連續積欠地租達二年，土地所有人始得終止地上權", "(D)地上權無支付地租之約定者，地上權人應於一年前通知土地所有人，始得拋棄其權利"], "qnum": 18, "ans": "B", "law_ref": {"law": "民法", "article": "第840條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/民法概要ANS.pdf", "source_qnum": 18}, {"subject": "民法概要", "year": "109", "q": "以建築物設定抵押權者，下列何者非抵押權效力所及之標的物範圍？", "options": ["(A)抵押物扣押後，抵押人就抵押物所得收取之租金", "(B)抵押之建築物存在所必要且性質上得讓與之權利", "(C)設定抵押權後所增建附加於該建築物，而不具獨立性之部分", "(D)抵押之建築物滅失後殘餘之鋼筋"], "qnum": 19, "ans": "B", "law_ref": {"law": "民法", "article": "第860條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/民法概要ANS.pdf", "source_qnum": 19}, {"subject": "民法概要", "year": "109", "q": "下列關於夫妻財產制契約之訂立，何者正確？", "options": ["(A)夫妻於結婚前或結婚後，均得以書面約定夫妻財產制契約", "(B)夫妻財產制契約之訂立應經登記，否則不生效力", "(C)夫妻財產制契約之訂立，當事人如為未成年人時，應得其法定代理人之同意始為有效", "(D)夫妻於婚姻關係存續中，得以契約廢止其財產制契約，或改用他種約定財產制，但以一次為限"], "qnum": 20, "ans": "A", "law_ref": {"law": "民法", "article": "第1047條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/民法概要ANS.pdf", "source_qnum": 20}, {"subject": "民法概要", "year": "109", "q": "甲、乙結婚並約定共同財產制為夫妻財產制，共同財產制關係存續中二人之共同財產為2000 萬元，\n若甲、乙離婚而無特別約定時，則乙可分得若干共同財產？", "options": ["(A)2000 萬元", "(B)1000 萬元", "(C)1500 萬元", "(D)500 萬元"], "qnum": 21, "ans": "B", "law_ref": {"law": "民法", "article": "第1047條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/民法概要ANS.pdf", "source_qnum": 21}, {"subject": "民法概要", "year": "109", "q": "甲乙夫妻育有丙、丁二子及戊女。丙與己女結婚，婚後育有一子庚，戊女未婚生下一子辛。多年\n後甲死亡，而戊早於甲死亡，丙則拋棄繼承。設甲留有遺產900 萬元，則甲之遺產應如何繼承？", "options": ["(A)乙、丁、庚各繼承300 萬元", "(B)乙、丁、辛各繼承300 萬元", "(C)乙、丁各繼承450 萬元", "(D)乙、丁、庚、辛各繼承225 萬元"], "qnum": 23, "ans": "B", "law_ref": {"law": "民法", "article": "第1154條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/民法概要ANS.pdf", "source_qnum": 23}, {"subject": "民法概要", "year": "109", "q": "甲、乙為夫妻，並無子女。丙、丁為甲之父母。甲死亡時留有350 萬元之現金及對丙有50 萬元之\n債權。試問，於遺產分割時，丙可以分得多少遺產？", "options": ["(A)50 萬元", "(B)100 萬元", "(C)200 萬元", "(D)350 萬元"], "qnum": 24, "ans": "A", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/109/民法概要ANS.pdf", "source_qnum": 24}, {"subject": "不動產估價概要", "year": "110", "q": "政府宣布實價登錄2.0 新制自110 年7 月1 日施行，此為影響不動產價格之何種因素？", "options": ["(A)情況因素", "(B)一般因素", "(C)區域因素", "(D)個別因素"], "qnum": 1, "ans": "B", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 1}, {"subject": "不動產估價概要", "year": "110", "q": "不動產所在地區對外連絡道路為中山路，路寬30 公尺，並有兩線捷運經過。請問此為影響不動產\n價格之何種因素？", "options": ["(A)情況因素", "(B)一般因素", "(C)區域因素", "(D)個別因素"], "qnum": 2, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 2}, {"subject": "不動產估價概要", "year": "110", "q": "不動產因鄰近殯儀館，造成價格之減損，此屬於何種原則？", "options": ["(A)競爭原則", "(B)供需原則", "(C)替代原則", "(D)外部性原則"], "qnum": 3, "ans": "D", "law_ref": {"law": "公平交易法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=G0300024"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 3}, {"subject": "不動產估價概要", "year": "110", "q": "公寓因加裝電梯而價格提昇，此屬於何種不動產估價原則？", "options": ["(A)外部性原則", "(B)貢獻原則", "(C)替代原則", "(D)遞增原則"], "qnum": 4, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 4}, {"subject": "不動產估價概要", "year": "110", "q": "建物總成本1,000 萬元，經濟耐用年數50 年，建物殘餘價格率10%。若每年折舊額皆相同，請問\n每年折舊率為何？", "options": ["(A)1.5%", "(B)1.8%", "(C)2%", "(D)2.2%"], "qnum": 5, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第27條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 5}, {"subject": "不動產估價概要", "year": "110", "q": "有一500 坪建地可興建大樓出售，預期新大樓之總銷售金額為10 億元，若營建施工費為3 億元、\n管理銷售費用等間接成本為9 千萬元、要求的利潤率為18%、資本綜合利率為5%。請問該建地\n每坪價格約為多少？", "options": ["(A)100.5 萬元", "(B)83.4 萬元", "(C)65.8 萬元", "(D)41.7 萬元"], "qnum": 6, "ans": "B", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 6}, {"subject": "不動產估價概要", "year": "110", "q": "對不具市場性之不動產所估計之價值，並以貨幣金額表示者，為何種價格？", "options": ["(A)正常價格", "(B)限定價格", "(C)特定價格", "(D)特殊價格"], "qnum": 7, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 7}, {"subject": "不動產估價概要", "year": "110", "q": "勘估標的之營造或施工費，依不動產估價技術規則之規定，不包含下列那一項目？", "options": ["(A)間接材料費", "(B)稅捐", "(C)資本利息", "(D)廣告費"], "qnum": 8, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 8}, {"subject": "不動產估價概要", "year": "110", "q": "就同一供需圈內近鄰地區或類似地區中，選擇與勘估標的類似之比較標的或標準建物，經比較與\n勘估標的營造或施工費之條件差異並作價格調整，以求取勘估標的營造或施工費的方法為何？", "options": ["(A)直接法", "(B)間接法", "(C)淨計法", "(D)單位工程法"], "qnum": 9, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 9}, {"subject": "不動產估價概要", "year": "110", "q": "100 坪之辦公室出租，每月每坪正常租金為1,000 元，推估該辦公室合理空置率為8%，每年之地\n價稅、房屋稅、保險費、管理費及維修費為120,000 元，貸款支出為200,000 元。該辦公室每年之\n淨收益為多少？", "options": ["(A)1,080,000 元", "(B)984,000 元", "(C)880,000 元", "(D)784,000 元"], "qnum": 10, "ans": "B", "law_ref": {"law": "房屋稅條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130021"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 10}, {"subject": "不動產估價概要", "year": "110", "q": "依不動產估價技術規則規定，以不動產證券化為估價目的者，其折現現金流量分析法之總費用應\n依何種資料加以推算？", "options": ["(A)市場相關資料", "(B)信託計畫資料", "(C)類似產品資料", "(D)歷史費用資料"], "qnum": 11, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 11}, {"subject": "不動產估價概要", "year": "110", "q": "比較標的於110 年1 月以2,000 萬元成交，當時之價格指數為95；勘估標的之價格日期為110 年\n9 月，價格指數為101。假設其他條件皆相同，請問勘估標的經價格日期調整後之價格約為多少？", "options": ["(A)2,020 萬元", "(B)2,105 萬元", "(C)2,126 萬元", "(D)2,188 萬元"], "qnum": 12, "ans": "C", "law_ref": {"law": "不動產估價技術規則", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 12}, {"subject": "不動產估價概要", "year": "110", "q": "依不動產估價技術規則規定，下列有關特殊宗地之估價，何者敘述錯誤？", "options": ["(A)公共設施保留地之估價，以比較法估價為原則", "(B)林地之估價，以比較法估價為原則", "(C)農場之估價，以比較法估價為原則", "(D)墓地之估價，以比較法估價為原則"], "qnum": 15, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 15}, {"subject": "不動產估價概要", "year": "110", "q": "土地承租人欲購買所承租土地供未來繼續使用，委託不動產估價師進行估價，其價格種類為何？", "options": ["(A)正常價格", "(B)限定價格", "(C)特定價格", "(D)特殊價格"], "qnum": 16, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 16}, {"subject": "不動產估價概要", "year": "110", "q": "近年受疫情影響，各地商圈人潮減少、店面空置率提高，此屬於何種價格影響因素？", "options": ["(A)一般因素", "(B)區域因素", "(C)個別因素", "(D)總體因素"], "qnum": 17, "ans": "A", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 17}, {"subject": "不動產估價概要", "year": "110", "q": "勘估標的乙之價格日期、勘察日期分別為110 年8 月15 日、110 年9 月15 日，若比較標的交易\n日期為110 年7 月10 日（經查110 年7 至9 月不動產指數分別為：106%、108%、107%），其價\n格日期調整百分率為何？", "options": ["(A)98%", "(B)99%", "(C)101%", "(D)102%"], "qnum": 18, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 18}, {"subject": "不動產估價概要", "year": "110", "q": "勘估標的若為未完工之建物，應依何種方式估價？", "options": ["(A)未完工之建物應依比準建物進行估價", "(B)未完工之建物應依實際完成部分估價", "(C)未完工之建物應待完工後再進行估價", "(D)未完工之建物無法產生正常報酬，不予估計"], "qnum": 19, "ans": "B", "law_ref": {"law": "不動產經紀業管理條例", "article": "第19條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 19}, {"subject": "不動產估價概要", "year": "110", "q": "某房地之淨收益100 萬元/年，其中建物淨收益60 萬元/年。假設土地、建物之收益資本化率分別\n為2%、4%，請問土地收益價格為？", "options": ["(A)1,000 萬元", "(B)2,000 萬元", "(C)2,500 萬元", "(D)5,000 萬元"], "qnum": 20, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第20條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 20}, {"subject": "不動產估價概要", "year": "110", "q": "依據不動產估價技術規則第43 條規定，收益資本化率應考慮之因素不包括下列何者？", "options": ["(A)貨幣變動之狀況", "(B)銀行定期存款利率", "(C)不動產投資之損益", "(D)不動產價格變動趨勢"], "qnum": 21, "ans": "C", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 21}, {"subject": "不動產估價概要", "year": "110", "q": "勘估標的丙之市場價格1,000 萬元，經分析當地同類型不動產之租金收益率5%，必要費用20 萬\n元/年，租賃所得稅約2 萬元。若丙為新訂租約，根據上開資料估計之年租金為？", "options": ["(A)50 萬元", "(B)52 萬元", "(C)70 萬元", "(D)72 萬元"], "qnum": 22, "ans": "C", "law_ref": {"law": "民法", "article": "第421條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 22}, {"subject": "不動產估價概要", "year": "110", "q": "續訂租約之租金估計方法中，差額分配法係指下列何種差額？", "options": ["(A)市場經濟租金與原契約租金之差額", "(B)原實質租金與市場經濟租金之差額", "(C)市場正常租金與原實質租金之差額", "(D)原契約租金與市場正常租金之差額"], "qnum": 23, "ans": "A", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產估價概要ANS.pdf", "source_qnum": 23}, {"subject": "不動產估價概要", "year": "110", "q": "實際建築使用之容積率超過法定容積率之房地，應以何種方式估價？", "options": ["(A)以原規定之法定容積進行估價", "(B)以原規定法定容
