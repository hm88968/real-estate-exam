定，下列敘述何者錯誤？", "options": ["(A)所使用之名稱或表徵必須達到著名之程度", "(B)相同或近似之名稱或表徵必須使用於同一或類似的服務", "(C)公司名稱或營業服務表徵限於依法取得註冊商標權者", "(D)必須產生與他人提供之服務設施或活動混淆的結果"], "qnum": 24, "ans": "C", "law_ref": {"law": "公平交易法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=G0300024"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/不動產經紀相關法規概要ANS.pdf", "source_qnum": 24}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "依土地法規定，外國人投資有助於國內重大建設、整體經濟或農牧經營而需要取得土地時，應先\n經下列何者程序？", "options": ["(A)中央地政機關備查", "(B)中央目的事業主管機關同意", "(C)該直轄市或縣（市）民意機關同意", "(D)該直轄市或縣（市）政府層請行政院同意"], "qnum": 1, "ans": "B", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 1}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "有關重新實施地籍測量時，依土地法規定，下列敘述何者正確？", "options": ["(A)土地所有權人發生界址爭議時，應由該管直轄市或縣（市）地政機關予以調處", "(B)土地所有權人不服界址爭議調處者，應於接到調處通知後三十日內，向司法機關訴請處理", "(C)土地所有權人認為測量結果有錯誤時，得於重測結果公告期滿三十日內聲請複丈", "(D)重測結果未經聲請複丈者，地政機關應即據以辦理土地更正登記"], "qnum": 2, "ans": "A", "law_ref": {"law": "民法物權編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000003"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 2}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "依土地法之規定，無保管或使用機關之公有土地及因地籍整理而發現之公有土地，應如何處理？", "options": ["(A)由該管直轄市或縣（市）地政機關囑託登記，其所有權人欄註明為國有", "(B)由該管直轄市或縣（市）地政機關逕為登記，其所有權人欄註明為國有", "(C)由該管直轄市或縣（市）地政機關囑託登記，其所有權人欄註明為直轄市或縣（市）有", "(D)由該管直轄市或縣（市）地政機關逕為登記，其所有權人欄註明為直轄市或縣（市）有"], "qnum": 3, "ans": "B", "law_ref": {"law": "民法物權編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000003"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 3}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "依土地法規定，聲請為土地權利變更登記，應繳納登記費，下列敘述何者正確？", "options": ["(A)由權利人與義務人雙方共同按公告地價或權利價值千分之一繳納登記費", "(B)由權利人按公告現值或權利價值千分之二繳納登記費", "(C)由權利人按申報地價或權利價值千分之一繳納登記費", "(D)由義務人按公告現值或權利價值千分之二繳納登記費"], "qnum": 4, "ans": "C", "law_ref": {"law": "土地登記規則", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070031"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 4}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "依土地法規定，房屋租用相關規定，下列何者錯誤？", "options": ["(A)城市地方房屋之租金，以不超過土地及其建築物申報總價年息百分之十為限", "(B)約定房屋租金，超過土地法規定者，該管直轄市或縣（市）政府得依土地法所定標準強制減定之", "(C)房屋租金擔保之金額，不得超過二個月房屋租金之總額", "(D)以現金為租賃之擔保者，其現金視為租金之一部"], "qnum": 5, "ans": "D", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 5}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "依土地法之規定，遇有荒歉，直轄市或縣（市）政府得按照當地當年收穫實況為減租或免租之決\n定。但應經何機關同意？", "options": ["(A)行政院", "(B)財政部", "(C)民意機關", "(D)農業發展委員會"], "qnum": 6, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 6}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "依平均地權條例規定，應納地價稅額因公告地價調整致納稅義務人繳納困難者，得於規定繳納期\n間內，向稅捐稽徵機關申請延期繳納，延期繳納期間最長不得逾多久？", "options": ["(A)3 個月", "(B)6 個月", "(C)1 年", "(D)3 年"], "qnum": 7, "ans": "B", "law_ref": {"law": "土地稅法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130013"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 7}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "平均地權條例第35 條之1 規定，私人捐贈予財團法人供興辦社會福利事業使用之土地，免徵土\n地增值稅；但有三種情形之一者，除追補應納之土地增值稅外，並處應納土地增值稅額二倍之罰\n鍰。下列何者不是規範中的情形？", "options": ["(A)未辦理用地變更者", "(B)未按捐贈目的使用土地者", "(C)違反各該事業設立宗旨者", "(D)土地收益未全部用於各該事業者"], "qnum": 8, "ans": "A", "law_ref": {"law": "土地稅法", "article": "第30條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130013"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 8}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "有關平均地權條例對違反申報登錄之規定中，直轄市、縣（市）主管機關應先令其限期改正，屆\n期未改正者，處新臺幣六千元以上三萬元以下罰鍰，並令其限期改正；屆期未改正者，按次處罰\n的情形係指下列何種狀況？", "options": ["(A)申報登錄價格資訊不實", "(B)申報登錄價格以外資訊不實", "(C)未依限申報登錄資訊、申報登錄價格或交易面積資訊不實", "(D)金融機構、權利人、義務人、地政士或不動產經紀業規避、妨礙或拒絕查核"], "qnum": 9, "ans": "B", "law_ref": {"law": "不動產經紀業管理條例", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070046"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 9}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "依平均地權條例規定，預售屋買受人將已付定金，確立買賣標的物及價金等事項之書面契據，轉\n售予第三人時，由直轄市、縣（市）主管機關按戶（棟）處罰新臺幣多少元？", "options": ["(A)三萬元以上十五萬元以下罰鍰", "(B)六萬元以上三十萬元以下罰鍰", "(C)十五萬元以上一百萬元以下罰鍰", "(D)三十萬元以上一百萬元以下罰鍰"], "qnum": 10, "ans": "C", "law_ref": {"law": "民法", "article": "第248條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 10}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "下列有關平均地權條例對以經營土地買賣，違背土地法律，從事土地壟斷、投機者處罰規定之敘\n述，何者正確？", "options": ["(A)處一年以下有期徒刑，並得併科五千元以下罰金", "(B)處三年以下有期徒刑，並得併科七千元以下罰金", "(C)處一年以下有期徒刑，並得併科八千元以下罰金", "(D)處三年以下有期徒刑，並得併科一萬元以下罰金"], "qnum": 11, "ans": "B", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 11}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "拒絕受領之徵收補償費，依土地徵收條例規定存入專戶保管，並通知應受補償人。自通知送達發\n生效力之日起，最長逾幾年未領取之補償費，歸屬國庫？", "options": ["(A)5 年", "(B)10 年", "(C)15 年", "(D)20 年"], "qnum": 12, "ans": "C", "law_ref": {"law": "土地法", "article": "第208條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 12}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "依土地徵收條例規定，建築改良物之補償費，按徵收當時該建築改良物之下列何種價格估定之？", "options": ["(A)市價", "(B)重置價格", "(C)重建價格", "(D)房屋評定現值"], "qnum": 13, "ans": "C", "law_ref": {"law": "土地法", "article": "第208條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0140007"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 13}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "土地權利關係人依都市計畫法第24 條規定自行擬定或變更細部計畫時，主管機關得要求土地權\n利關係人提供或捐贈都市計畫變更範圍內之那些回饋項目予當地直轄市、縣（市）政府或鄉、鎮、\n縣轄市公所？①公共設施用地 ②可建築土地 ③樓地板面積 ④一定金額", "options": ["(A)僅①④", "(B)僅①②③", "(C)僅②③④", "(D)①②③④"], "qnum": 15, "ans": "D", "law_ref": {"law": "都市計畫法", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0110001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 15}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "私有公共設施保留地得申請與公有非公用土地辦理交換，依都市計畫法之規定，不受下列那些法\n規相關規定之限制？①土地法 ②所得稅法 ③國有財產法 ④各級政府財產管理法令", "options": ["(A)②④", "(B)②③④", "(C)①③④", "(D)①②③④"], "qnum": 16, "ans": "C", "law_ref": {"law": "都市計畫法", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0110001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 16}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "非都市土地經劃定使用分區並編定使用地類別，應依其容許使用之項目及許可使用細目使用。但\n中央目的事業主管機關認定為重大建設計畫所需之臨時性設施，經徵得使用地之中央主管機關及\n有關機關同意後，得核准為臨時使用。中央目的事業主管機關於核准時，應函請直轄市或縣（市）\n政府將臨時使用用途及期限等資料，依相關規定程序登錄於何處？", "options": ["(A)土地登記謄本", "(B)土地參考資訊檔", "(C)土地使用分區證明", "(D)非都市土地許可使用書"], "qnum": 17, "ans": "B", "law_ref": {"law": "土地登記規則", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070031"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 17}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "依非都市土地使用管制規則規定，土地使用編定後，其原有使用或原有建築物不合土地使用分區\n規定者，其使用限制，下列敘述何者錯誤？", "options": ["(A)在政府令其變更使用或拆除建築物前，得為從來之使用", "(B)原有建築物除准修繕和增建外，不得改建", "(C)若該土地或建築物，對公眾安全、衛生及福利有重大妨礙者，該管直轄市或縣（市）政府應限"], "qnum": 18, "ans": "B", "law_ref": {"law": "建築法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070105"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 18}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "依土地稅法規定，土地所有權人第一次出售其自用住宅用地，其適用自用住宅用地特別稅率之要\n件，下列敘述何者正確？\n①都市土地面積未超過三公畝部分和非都市土地面積未超過七公畝部分\n②其土地增值稅統就該部分之土地漲價總數額按百分之十徵收之\n③需土地於出售前5 年內，不曾供營業使用或出租者\n④土地所有權人與其配偶及未成年直系親屬需於該地辦竣戶籍登記", "options": ["(A)②", "(B)①②", "(C)①②④", "(D)③④"], "qnum": 19, "ans": "A", "law_ref": {"law": "土地稅法", "article": "第30條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130013"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 19}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "依土地稅法免徵土地增值稅之土地，主管稽徵機關依相關規定核定其移轉現值並發給免稅證明，\n以憑辦理土地所有權移轉登記，下列有關移轉現值核定之敘述何者正確？", "options": ["(A)各級政府出售之公有土地，以實際出售價額為準", "(B)各級政府贈與或受贈之土地，以土地點交日之公告土地現值為準", "(C)區段徵收抵價地，以區段徵收時實際測量及登記完竣之地價為準", "(D)私人捐贈供興辦社會福利事業之土地，以社會福利事業核准日之公告土地現值為準"], "qnum": 20, "ans": "A", "law_ref": {"law": "土地稅法", "article": "第30條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130013"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 20}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "平均地權條例第74 條規定，依第26 條規定限期建築之土地，有下列三種情形之一者，土地所有\n權人應於接到限期使用通知後，與承租人、借用人或地上權人協議建築、增建或改建；協議不成\n時，得終止租約、借貸或撤銷地上權。下列何者是規範中的情形？", "options": ["(A)土地所有權人將其土地出租、貸與或設有地上權者", "(B)土地所有權人將其土地設定典權或設定不動產役權者", "(C)土地所有權人將其所有之農作改良物出租或貸與他人使用者", "(D)土地承典人或地役權人將其所有建築改良物出租或貸與他人使用者"], "qnum": 21, "ans": "A", "law_ref": {"law": "民法", "article": "第840條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 21}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "依契稅條例規定，以不動產為信託財產，受託人乙依信託本旨移轉信託財產與委託人甲以外之歸\n屬權利人丙時，應由何人估價立契，在規定之期限申報契稅？又其契稅稅率為何？", "options": ["(A)由乙申報契稅，稅率為6%", "(B)由乙申報契稅，稅率為2%", "(C)由丙申報契稅，稅率為6%", "(D)由甲申報契稅，稅率為2%"], "qnum": 22, "ans": "C", "law_ref": {"law": "信託法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000013"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 22}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "有關中華民國境內居住之個人，依所得稅法規定計算之房屋、土地交易所得，減除當次交易依土\n地稅法第30 條第1 項規定公告土地現值計算之土地漲價總數額後之餘額，不併計綜合所得總額，\n其稅率計算下列何者正確？", "options": ["(A)持有房屋、土地之期間在三年以內者，稅率為百分之四十五", "(B)持有房屋、土地之期間超過三年，未逾五年者，稅率為百分之三十五", "(C)持有房屋、土地之期間超過五年，未逾十年者，稅率為百分之三十", "(D)持有房屋、土地之期間超過十年者，稅率為百分之十五"], "qnum": 23, "ans": "D", "law_ref": {"law": "所得稅法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0150018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 23}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "依所得稅法規定，個人出售自住房屋、土地，依規定繳納之稅額，申請房地合一所得稅重購退稅\n之敘述，下列何者錯誤？", "options": ["(A)需自完成移轉登記之日起算二年內，重購自住房屋、土地者", "(B)得於重購自住房屋、土地完成移轉登記次日起算二年內，申請退稅", "(C)申請按重購價額占出售價額之比率，自所繳納稅額計算退還", "(D)重購之自住房屋、土地，於重購後五年內改作其他用途或再行移轉時，應追繳原退還稅額"], "qnum": 24, "ans": "B", "law_ref": {"law": "土地登記規則", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070031"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 24}, {"subject": "土地法與土地相關稅法概要", "year": "110", "q": "依所得稅法規定，陳先生在110 年10 月以900 萬元出售其於107 年以700 萬元購入之房地\n產，110 年當期土地之公告現值為800 萬元，陳先生個人未提示因取得、改良及移轉而支付之費\n用時，稽徵機關得以多少元計算其費用？", "options": ["(A)24 萬元", "(B)27 萬元", "(C)30 萬元", "(D)45 萬元"], "qnum": 25, "ans": "B", "law_ref": {"law": "土地稅法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130013"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 25}, {"subject": "民法概要", "year": "110", "q": "甲與乙訂立買賣契約，契約條款記載「…價金新臺幣陸拾捌萬元整（NT$860,000）。前揭捌拾陸萬\n元價金應於訂約後10 日內支付。」若嗣後雙方就價金金額爭訟時，法院應如何決定價金？", "options": ["(A)應認為價金為最後書寫之文字：捌拾陸萬元", "(B)應先探求當事人原意", "(C)應認為價金為兩項金額之平均值：柒拾柒萬元", "(D)如法院不能決定當事人原意，應以數字為準：NT$860,000"], "qnum": 1, "ans": "B", "law_ref": {"law": "民法", "article": "第345條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 1}, {"subject": "民法概要", "year": "110", "q": "關於失蹤人的敘述，下列何者正確？", "options": ["(A)失蹤人失蹤滿七年後，法院得因利害關係人或檢察官之聲請，為死亡之宣告", "(B)失蹤人為八十歲以上者，得於失蹤滿五年後，為死亡之宣告", "(C)失蹤人為遭遇特別災難者，得於特別災難終了滿三個月後，為死亡之宣告", "(D)失蹤人失蹤後，未受死亡宣告前，其財產之管理，除其他法律另有規定者外，依破產法之規定"], "qnum": 3, "ans": "A", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 3}, {"subject": "民法概要", "year": "110", "q": "關於行為能力之敘述，下列何者錯誤？", "options": ["(A)受監護宣告之人之意思表示，無效，應由其法定代理人代為意思表示，並代受意思表示", "(B)限制行為能力人未得法定代理人之允許，所為之單獨行為，無效", "(C)未滿法定結婚年齡之男女，其結婚之法律效果並非無效，而是得撤銷", "(D)為保障胎兒之行為能力，胎兒以將來非死產者為限，關於其個人利益之保護，視為既已出生"], "qnum": 4, "ans": "D", "law_ref": {"law": "民法", "article": "第15條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 4}, {"subject": "民法概要", "year": "110", "q": "下列何種法律行為屬法定書面要式行為？", "options": ["(A)動產所有權之拋棄", "(B)子女之收養", "(C)贈與契約", "(D)演藝經紀契約"], "qnum": 6, "ans": "B", "law_ref": {"law": "民法物權編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000003"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 6}, {"subject": "民法概要", "year": "110", "q": "關於意思表示不一致的敘述，下列何者正確？", "options": ["(A)表意人無欲為其意思表示所拘束之意，而為意思表示者，其意思表示無效", "(B)表意人無欲為其意思表示所拘束之意，而為意思表示，其情形為相對人所明知者，其意思表示"], "qnum": 7, "ans": "D", "law_ref": {"law": "民法", "article": "第86條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 7}, {"subject": "民法概要", "year": "110", "q": "關於抵押權所擔保而得優先受償之利息，以於抵押權人實行抵押權聲請強制執行前幾年內發生及\n於強制執行程序中發生者為限？", "options": ["(A)二年", "(B)五年", "(C)十年", "(D)十五年"], "qnum": 8, "ans": "B", "law_ref": {"law": "民法", "article": "第860條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 8}, {"subject": "民法概要", "year": "110", "q": "依現行民法規定，下列何者須經登記始生法律效力？", "options": ["(A)遺產之繼承", "(B)土地買賣契約", "(C)設定抵押權之物權行為", "(D)夫妻就共同財產制之約定"], "qnum": 9, "ans": "C", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 9}, {"subject": "民法概要", "year": "110", "q": "民法於保證契約一節中規定，保證人於債權人未就主債務人之財產強制執行而無效果前，對於債\n權人得拒絕清償，概念上一般稱為？", "options": ["(A)同時履行抗辯", "(B)撤銷訴權", "(C)追索權抗辯", "(D)先訴抗辯"], "qnum": 11, "ans": "D", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 11}, {"subject": "民法概要", "year": "110", "q": "下列何種情形，當事人一方須以向法院聲請撤銷方式為之？", "options": ["(A)因受詐欺所為之意思表示", "(B)債務人所為之無償行為，有害及債權者", "(C)締結違反公共秩序之契約", "(D)違反民法第983 條特定親屬間禁止結婚規定之結婚行為"], "qnum": 13, "ans": "B", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 13}, {"subject": "民法概要", "year": "110", "q": "關於買賣瑕疵擔保的敘述，下列何者正確？", "options": ["(A)買受人對於由他地送到之物，主張有瑕疵，不願受領者，買受人無暫為保管之責", "(B)從物有瑕疵者，買受人得就主物併同從物，解除全部契約", "(C)為買賣標的之數物中，一物有瑕疵者，買受人僅得就有瑕疵之物為解除，但當事人之任何一方，"], "qnum": 15, "ans": "C", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 15}, {"subject": "民法概要", "year": "110", "q": "關於果實自落於鄰地，而鄰地非為公用地者，下列何者正確？", "options": ["(A)視為遺失物", "(B)視為無主物", "(C)視為屬於鄰地所有人", "(D)視為屬於原土地所有人"], "qnum": 16, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 16}, {"subject": "民法概要", "year": "110", "q": "地上權未定有期限者，存續期間逾多少年或地上權成立之目的已不存在時，法院得因當事人之請\n求，斟酌地上權成立之目的、建築物或工作物之種類、性質及利用狀況等情形，定其存續期間或\n終止其地上權。下列何者正確？", "options": ["(A)二十年", "(B)十五年", "(C)十年", "(D)五年"], "qnum": 17, "ans": "A", "law_ref": {"law": "民法", "article": "第840條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 17}, {"subject": "民法概要", "year": "110", "q": "依民法第880 條規定，實行抵押權期間以抵押權擔保之債權，其請求權已因時效而消滅，如抵押\n權人，於消滅時效完成後，幾年間不實行其抵押權者，其抵押權消滅？", "options": ["(A)一", "(B)二", "(C)三", "(D)五"], "qnum": 18, "ans": "D", "law_ref": {"law": "民法", "article": "第125條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 18}, {"subject": "民法概要", "year": "110", "q": "關於夫妻財產制契約的敘述，下列何者正確？", "options": ["(A)夫妻得於結婚前以契約就民法所定之約定財產制中，選擇其一，為其夫妻財產制。結婚後則不行", "(B)夫妻未以契約訂立夫妻財產制者，除民法另有規定外，以聯合財產制，為其夫妻財產制", "(C)夫妻財產制契約之訂立、變更或廢止，非經登記，不生效力", "(D)夫妻財產制契約之登記，不影響依其他法律所為財產權登記之效力"], "qnum": 19, "ans": "D", "law_ref": {"law": "民法", "article": "第1047條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 19}, {"subject": "民法概要", "year": "110", "q": "關於共同財產所負之債務，而以共同財產清償者，下列何者正確？", "options": ["(A)不生補償請求權", "(B)不生補償請求權，但於共同財產制關係消滅時，應分別納入現存之婚後財產或婚姻關係存續中"], "qnum": 21, "ans": "A", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 21}, {"subject": "民法概要", "year": "110", "q": "民法關於非婚生子女之規定，下列何者錯誤？", "options": ["(A)如有受推定為婚生子女情形，夫妻之一方或子女能證明子女非為婚生子女者，得提起認領之訴", "(B)非婚生子女，其生父與生母結婚者，視為婚生子女", "(C)非婚生子女經生父認領者，視為婚生子女", "(D)非婚生子女或其生母，對於生父之認領，得否認之"], "qnum": 22, "ans": "A", "law_ref": {"law": "民法", "article": "第1063條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 22}, {"subject": "民法概要", "year": "110", "q": "甲早年父母雙亡，僅有一兄長乙，甲與配偶離異後獨自養育一子丙。某日甲死亡，於丙拋棄繼承\n前，乙亦不幸意外死亡，留下乙之配偶丁。下列何者錯誤？", "options": ["(A)甲之遺產繼承人順序，丙優先於乙", "(B)配偶丁與乙有相互繼承遺產之權", "(C)就甲之遺產，既然丙已拋棄繼承，應由次順序之乙繼承，雖然乙早於丙拋棄繼承前死亡，仍應"], "qnum": 23, "ans": "C", "law_ref": {"law": "民法", "article": "第1154條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 23}, {"subject": "民法概要", "year": "110", "q": "關於喪失繼承權情事的敘述，下列何者正確？", "options": ["(A)故意致被繼承人或應繼承人於死，或雖未致死因而受刑之宣告者", "(B)以詐欺或脅迫使被繼承人為關於繼承之遺囑，或使其撤回或變更之，因而受刑之宣告者", "(C)以詐欺或脅迫妨害被繼承人為關於繼承之遺囑，或妨害其撤回或變更之，因而受刑之宣告者", "(D)偽造、變造、隱匿或湮滅被繼承人關於繼承之遺囑，因而受刑之宣告，但經被繼承人宥恕者"], "qnum": 24, "ans": "A", "law_ref": {"law": "民法", "article": "第1147條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 24}, {"subject": "民法概要", "year": "110", "q": "關於遺產分割的敘述，下列何者正確？", "options": ["(A)繼承人於服喪三年後得隨時請求分割遺產", "(B)遺囑禁止遺產之分割者，其禁止之效力以二十年為限", "(C)遺產分割後，各繼承人按其所得部分，對於他繼承人因分割而得之債權，就應清償時債務人之"], "qnum": 25, "ans": "D", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/110/民法概要ANS.pdf", "source_qnum": 25}, {"subject": "不動產估價概要", "year": "111", "q": "平均地權條例近日研議抑制炒房之修法動向，其對不動產市場之影響，是屬於不動產估價影響因\n素中之下列何種因素？", "options": ["(A)市場因素", "(B)一般因素", "(C)區域因素", "(D)個別因素"], "qnum": 1, "ans": "B", "law_ref": {"law": "平均地權條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130015"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 1}, {"subject": "不動產估價概要", "year": "111", "q": "收益資本化率或折現率應綜合評估最適宜之方法決定，如採用債務保障比率方式決定，其計算式\n債務保障比率除了乘以貸款資金占不動產價格比率外，應再乘以下列何者？", "options": ["(A)債務保障常數", "(B)市場常數", "(C)存款常數", "(D)貸款常數"], "qnum": 3, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第20條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 3}, {"subject": "不動產估價概要", "year": "111", "q": "依據不動產估價技術規則之規定，在一宗土地內有不同法定用途時，應如何估價？", "options": ["(A)應考量不同用途之合併或分割前後之價格變動情形，予酌量增減", "(B)應以合併用途後估價，並以合併用途前各筆土地價值比例分算其土地價格", "(C)應考慮不同用途之建築物對宗地價格造成之影響，予以酌量增減", "(D)應考量其最有效使用及各種用途之相關性及分割之難易度後，決定分別估價或依主要用途估價"], "qnum": 4, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 4}, {"subject": "不動產估價概要", "year": "111", "q": "不動產估價原則是估價之根基，不動產估價技術規則對「最有效使用」原則有所定義，請問下列\n敘述何者錯誤？", "options": ["(A)得以獲致最高利益之使用", "(B)基於合法、實質可能前提", "(C)正當合理、財務可行前提下者", "(D)具有超凡意識及使用能力者"], "qnum": 5, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 5}, {"subject": "不動產估價概要", "year": "111", "q": "利用計量模型分析法進行估價，應蒐集相當數量具代表性之比較標的，在計量模型的影響不動產\n價格之因素中，現有6 項區域因素，5 項個別因素，因此至少要蒐集多少數量以上之比較標的才\n符合不動產估價技術規則之規定？", "options": ["(A)55 筆以上", "(B)40 筆以上", "(C)30 筆以上", "(D)25 筆以上"], "qnum": 6, "ans": "A", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 6}, {"subject": "不動產估價概要", "year": "111", "q": "不動產估價成本法對勘估標的之營造或施工費，其中「指以類似勘估標的之比較標的或標準建物\n之單位面積（或體積）營造或施工費單價為基礎，經比較並調整價格後，乘以勘估標的之面積（或\n體積）總數，以求取勘估標的營造或施工費。」方法，係指何方法？", "options": ["(A)單位工程法", "(B)淨計法", "(C)單位面積（或體積）比較法", "(D)工程造價比較法"], "qnum": 7, "ans": "C", "law_ref": {"law": "不動產估價技術規則", "article": "第25條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 7}, {"subject": "不動產估價概要", "year": "111", "q": "不動產估價作業程序依不動產估價技術規則規定，總共有八項作業程序，其中第七個步驟為何？", "options": ["(A)製作估價報告書", "(B)整理、比較、分析資料", "(C)運用估價方法推算勘估標的價格", "(D)決定勘估標的價格"], "qnum": 8, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 8}, {"subject": "不動產估價概要", "year": "111", "q": "目前內政部積極推動試辦電腦估價，所應用計量模型分析法係指「蒐集相當數量具代表性之比較\n標的，透過計量模型分析，求出各主要影響價格因素與比較標的價格二者之關係式，以推算各主\n要影響價格因素之調整率及調整額之方法。」請問應用時應符合條件中，截距項以外其他各主要\n影響價格因素之係數估計值同時為零之顯著機率不得大於多少？", "options": ["(A)百分之五", "(B)百分之六", "(C)百分之七", "(D)百分之八"], "qnum": 9, "ans": "A", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 9}, {"subject": "不動產估價概要", "year": "111", "q": "不動產估價應就不同估價方法估價所獲得之價格進行綜合比較，視不同價格所蒐集資料可信度及\n估價種類目的條件差異，考量價格形成因素之相近程度，決定勘估標的價格。若以契約約定租金\n作為不動產證券化受益證券信託利益分配基礎者，何種方法應視前項情形賦予相對較大之權重？", "options": ["(A)比較法", "(B)直接資本化法之收益價格", "(C)折現現金流量分析法之收益價格", "(D)成本法"], "qnum": 10, "ans": "C", "law_ref": {"law": "信託法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000013"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 10}, {"subject": "不動產估價概要", "year": "111", "q": "不動產估價比較法經比較調整後求得之勘估標的試算價格，應就價格偏高或偏低者重新檢討，經\n檢討確認適當合理者，始得作為決定比較價格之基礎。檢討後試算價格之間差距仍達多少以上者，\n應排除該試算價格之適用？", "options": ["(A)百分之五", "(B)百分之十", "(C)百分之十五", "(D)百分之二十"], "qnum": 11, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 11}, {"subject": "不動產估價概要", "year": "111", "q": "不動產估價之限定價格指具有市場性之不動產，在下列限定條件之一所形成之價值，並以貨幣金\n額表示者。請問下列何者非屬限定條件？", "options": ["(A)以不動產所有權以外其他權利與所有權合併為目的", "(B)以不動產合併為目的", "(C)以違反經濟合理性之不動產分割為前提", "(D)經適當市場行銷及正常交易條件形成"], "qnum": 12, "ans": "D", "law_ref": {"law": "民法物權編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000003"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 12}, {"subject": "不動產估價概要", "year": "111", "q": "不動產估價，應註明其價格種類；以何種價格估價時應敘明其估價條件，並同時估計其正常價格？", "options": ["(A)限定價格", "(B)特殊價格", "(C)特定價格", "(D)特別價格"], "qnum": 13, "ans": "C", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 13}, {"subject": "不動產估價概要", "year": "111", "q": "不動產估價比較法於市場成交資訊充足時廣為運用，有關比較法之敘述，下列何者錯誤？", "options": ["(A)通常採用三件以上比較標的", "(B)試算價格之調整運算過程中，任一單獨項目之價格調整率大於百分之十五，應排除該比較標的"], "qnum": 14, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 14}, {"subject": "不動產估價概要", "year": "111", "q": "某建物於五年前取得使用執照，目前重建成本1,000 萬元，殘餘價格率5%，經濟耐用年數50 年，\n請問以定額法估算之建物成本價格為何？", "options": ["(A)850 萬元", "(B)865 萬元", "(C)895 萬元", "(D)905 萬元"], "qnum": 15, "ans": "D", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 15}, {"subject": "不動產估價概要", "year": "111", "q": "某開發商擬於新開發區開發建築，預計興建樓板面積2,000 坪。若推定銷售單價平均60 萬元/坪，\n利潤率20%、資本利息綜合利率5%、直接成本2 億元、間接成本4 千萬元，請問土地開發分析\n價格多少萬元？", "options": ["(A)71,238", "(B)69,526", "(C)64,878", "(D)62,106"], "qnum": 16, "ans": "A", "law_ref": {"law": "建築法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070105"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 16}, {"subject": "不動產估價概要", "year": "111", "q": "某公寓為談危老改建，經委託不動產估價師就1 至4 樓之單價分別查估為80、60、55、50 萬元/坪，\n若全棟建物成本價格占全棟房地總價格比率為30%，請問1 至4 樓之樓層別效用比分別為？", "options": ["(A)170%、130%、120%、100%", "(B)160%、120%、110%、100%", "(C)150%、110%、105%、100%", "(D)140%、120%、110%、100%"], "qnum": 17, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 17}, {"subject": "不動產估價概要", "year": "111", "q": "不動產估價人員應針對不動產勘估標的之價格日期當時的價值進行估價，而所謂價格日期是指：", "options": ["(A)估價人員撰寫估價報告書之日期", "(B)勘估標的價格之基準日期", "(C)至勘估標的現場從事調查的日期", "(D)勘估標的交易之日期"], "qnum": 18, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 18}, {"subject": "不動產估價概要", "year": "111", "q": "以收益法估價時，對於客觀淨收益的計算應以何種情形為計算基準？", "options": ["(A)以比較標的作最有效使用為計算基準", "(B)以勘估標的作最大效益使用為計算基準", "(C)以比較標的作最大效益使用為計算基準", "(D)以勘估標的作最有效使用為計算基準"], "qnum": 19, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第20條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 19}, {"subject": "不動產估價概要", "year": "111", "q": "某高鐵站周圍地區的新建住宅大樓平均成交價格，由三年前每坪35 萬元上漲到現今每坪接近50\n萬元，此現象可以不動產估價中那一原則加以解釋？", "options": ["(A)變動原則", "(B)預期原則", "(C)貢獻原則", "(D)日期原則"], "qnum": 20, "ans": "A", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 20}, {"subject": "不動產估價概要", "year": "111", "q": "科學園區附近的農業用地，未來可能變更為建地，土地所有權人要求估價人員針對其農地未來可\n能變更為建地情況進行估價，請問該筆土地的價格屬於何種類？", "options": ["(A)正常價格", "(B)特定價格", "(C)限定價格", "(D)特殊價格"], "qnum": 22, "ans": "B", "law_ref": {"law": "民法", "article": "第765條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 22}, {"subject": "不動產估價概要", "year": "111", "q": "某甲有一棟5 層透天住宅，其中第一層到第四層為合法建築物，頂樓層為違章建築物，某甲委託\n估價人員進行房地估價，並要求估價人員對所有樓層進行估價，估價人員應如何估價較為恰當？", "options": ["(A)僅針對合法建築物進行估價", "(B)拒絕對建築物估價", "(C)就合法建築物與違章建築物分別標示各該部分之價格", "(D)合法建築物以成本法估價，違章建築物則以加速折舊方式估價"], "qnum": 23, "ans": "C", "law_ref": {"law": "建築法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070105"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 23}, {"subject": "不動產估價概要", "year": "111", "q": "有一比較標的於110 年10 月以800 萬元成交，當時的價格指數為103.6%，不動產勘估標的之價\n格日期為111 年3 月，當時的價格指數為100.3%。假設其他條件相同，請問該勘估標的經價格日\n期調整後的價格為多少？", "options": ["(A)834.7 萬元", "(B)826.3 萬元", "(C)789.6 萬元", "(D)774.5 萬元"], "qnum": 24, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 24}, {"subject": "不動產估價概要", "year": "111", "q": "在土地開發分析法之估價程序中，應進行現況勘查與環境發展程度調查與分析，下列何者不屬於\n要勘查與調查分析的事項：", "options": ["(A)影響總銷售金額、成本及費用等因素", "(B)勘估標的之工程進度、施工及環境狀況", "(C)比較標的之工程進度、施工及環境狀況", "(D)週遭環境土地建物及公共設施開發程度"], "qnum": 25, "ans": "C", "law_ref": {"law": "不動產估價技術規則", "article": "第6條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產估價概要ANS.pdf", "source_qnum": 25}, {"subject": "不動產經紀相關法規概要", "year": "111", "q": "依不動產經紀業管理條例之規定，雙方當事人簽訂租賃或買賣契約書時，經紀人應將不動產說明\n書交付與委託人交易之相對人，並由何人在不動產說明書上簽章？", "options": ["(A)不動產經紀人", "(B)相對人", "(C)地政士", "(D)公司代表人"], "qnum": 4, "ans": "B", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產經紀相關法規概要ANS.pdf", "source_qnum": 4}, {"subject": "不動產經紀相關法規概要", "year": "111", "q": "公平交易法關於結合之規定，下列敘述何者錯誤？", "options": ["(A)直接或間接控制他事業之業務經營或人事任免屬於結合之一種", "(B)事業因結合而使其市場占有率達四分之一應先向主管機關提出申報", "(C)對於事業結合之申報，如其結合，對整體經濟利益大於限制競爭之不利益者，主管機關不得禁"], "qnum": 7, "ans": "B", "law_ref": {"law": "公平交易法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=G0300024"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產經紀相關法規概要ANS.pdf", "source_qnum": 7}, {"subject": "不動產經紀相關法規概要", "year": "111", "q": "主管機關收到對於涉有違反公平交易法規定之檢舉，而發動調查得進行之程序敘述，何者錯誤？", "options": ["(A)通知當事人及關係人到場陳述意見", "(B)通知當事人及關係人提出帳冊、文件及其他必要之資料或證物", "(C)派員前往當事人及關係人之事務所、營業所或其他場所為必要之調查", "(D)因被害人之請求，如為事業之故意行為，得依侵害情節，酌定損害額以上之賠償"], "qnum": 9, "ans": "D", "law_ref": {"law": "公平交易法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=G0300024"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產經紀相關法規概要ANS.pdf", "source_qnum": 9}, {"subject": "不動產經紀相關法規概要", "year": "111", "q": "當事人對主管機關依公平交易法所為之處分或決定不服者，應如何處理？", "options": ["(A)直接適用行政訴訟程序", "(B)依訴願法提起訴願", "(C)對主管機關提出民事訴訟", "(D)直接適用國家賠償程序"], "qnum": 10, "ans": "A", "law_ref": {"law": "公平交易法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=G0300024"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產經紀相關法規概要ANS.pdf", "source_qnum": 10}, {"subject": "不動產經紀相關法規概要", "year": "111", "q": "企業經營者未經邀約而與消費者在其住居所、工作場所、公共場所或其他場所所訂立之契約，依\n消費者保護法之規定，屬於下列何者之定義？", "options": ["(A)通訊交易", "(B)定型化契約", "(C)訪問交易", "(D)個別磋商契約"], "qnum": 11, "ans": "C", "law_ref": {"law": "消費者保護法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=J0070001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產經紀相關法規概要ANS.pdf", "source_qnum": 11}, {"subject": "不動產經紀相關法規概要", "year": "111", "q": "甲建商與乙消費者訂立預售屋定型化契約前，並沒有給合理期間供乙審閱全部條款內容，依消費\n者保護法之規定，乙可以如何主張權利？", "options": ["(A)要求甲建商回收該批商品或停止其服務", "(B)主張甲建商應負損害賠償責任", "(C)主張除去其危害", "(D)主張其條款不構成契約之內容。但乙得主張該條款仍構成契約之內容"], "qnum": 12, "ans": "D", "law_ref": {"law": "不動產經紀業管理條例", "article": "第19條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產經紀相關法規概要ANS.pdf", "source_qnum": 12}, {"subject": "不動產經紀相關法規概要", "year": "111", "q": "中央主管機關得擬訂特定行業定型化契約應記載或不得記載事項。下列應記載或不得記載事項之\n敘述何者錯誤？", "options": ["(A)中央主管機關公告應記載之事項，雖未記載於定型化契約，仍構成契約之內容", "(B)違反中央主管機關公告之定型化契約應記載或不得記載事項之定型化契約，其定型化契約條款"], "qnum": 13, "ans": "D", "law_ref": {"law": "不動產經紀業管理條例", "article": "第19條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產經紀相關法規概要ANS.pdf", "source_qnum": 13}, {"subject": "不動產經紀相關法規概要", "year": "111", "q": "企業經營者與消費者簽訂定型化之分期付款買賣契約，依消費者保護法規定，該契約書應載明之\n事項不包含下列那一項？", "options": ["(A)頭期款", "(B)企業經營者保留契約內容或期限之變更權或解釋權", "(C)各期價款與其他附加費用合計之總價款與現金交易價格之差額", "(D)利率"], "qnum": 14, "ans": "B", "law_ref": {"law": "消費者保護法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=J0070001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產經紀相關法規概要ANS.pdf", "source_qnum": 14}, {"subject": "不動產經紀相關法規概要", "year": "111", "q": "企業經營者對於消費者之申訴，依消費者保護法規定，應於申訴之日起，至多幾日內妥適處理之？", "options": ["(A)七日", "(B)十日", "(C)十五日", "(D)三十日"], "qnum": 15, "ans": "C", "law_ref": {"law": "消費者保護法", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=J0070001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產經紀相關法規概要ANS.pdf", "source_qnum": 15}, {"subject": "不動產經紀相關法規概要", "year": "111", "q": "依公寓大廈管理條例之規定，下列之定義何者正確？", "options": ["(A)約定專用部分：指公寓大廈專有部分經約定供共同使用者", "(B)管理負責人：指由區分所有權人會議決議執行建築物管理維護事務之公寓大廈管理服務人員或"], "qnum": 17, "ans": "D", "law_ref": {"law": "公寓大廈管理條例", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產經紀相關法規概要ANS.pdf", "source_qnum": 17}, {"subject": "不動產經紀相關法規概要", "year": "111", "q": "公寓大廈共用部分不得獨立使用供做專有部分。依公寓大廈管理條例之規定，其為特定情形者，\n並不得為約定專用部分。下列情形非屬前述之特定情形？", "options": ["(A)公寓大廈本身所占之地面", "(B)公寓大廈基礎、主要樑柱、承重牆壁、樓地板及屋頂之構造", "(C)其他有固定使用方法，並屬區分所有權人生活利用上不可或缺之專用部分", "(D)連通數個專有部分之走廊或樓梯，及其通往室外之通路或門廳；社區內各巷道、防火巷弄"], "qnum": 18, "ans": "C", "law_ref": {"law": "公寓大廈管理條例", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產經紀相關法規概要ANS.pdf", "source_qnum": 18}, {"subject": "不動產經紀相關法規概要", "year": "111", "q": "依公寓大廈管理條例之規定，區分所有權人或住戶積欠應繳納之公共基金或應分擔或其他應負擔\n之費用，至少逾多少期或達相當金額，經定相當期間催告仍不給付者，管理負責人或管理委員會\n得訴請法院命其給付應繳之金額及遲延利息？", "options": ["(A)一期", "(B)二期", "(C)三期", "(D)六期"], "qnum": 19, "ans": "B", "law_ref": {"law": "公寓大廈管理條例", "article": "第3條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產經紀相關法規概要ANS.pdf", "source_qnum": 19}, {"subject": "不動產經紀相關法規概要", "year": "111", "q": "規約除應載明專有部分及共用部分範圍外，有特定之情形，非經載明於規約者，不生效力。下列\n敘述何者非屬之？", "options": ["(A)違反義務之處理方式", "(B)禁止住戶飼養動物之特別約定", "(C)財務運作之監督規定", "(D)他住戶因維護、修繕專有部分，必須進入或使用其專有部分或約定專用部分時，不得拒絕"], "qnum": 20, "ans": "D", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產經紀相關法規概要ANS.pdf", "source_qnum": 20}, {"subject": "不動產經紀相關法規概要", "year": "111", "q": "如果有一交易違反公平交易法，下列有關於行使損害賠償之敘述何者正確？", "options": ["(A)自此一交易日起二年不行使請求權，請求權時效消滅", "(B)被害人不論何時得知損害，自得知之日起逾二年不行使請求權，請求權時效消滅", "(C)自此一交易日起逾十年，請求權時效消滅", "(D)被害人自此一交易日起，其請求權之行使沒有時效限制"], "qnum": 23, "ans": "C", "law_ref": {"law": "民法", "article": "第213條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產經紀相關法規概要ANS.pdf", "source_qnum": 23}, {"subject": "不動產經紀相關法規概要", "year": "111", "q": "對經紀人違反不動產經紀業管理條例規定之懲戒，下列何者正確？", "options": ["(A)經紀人員違反規定收取差價或其他報酬，應予申誡", "(B)經紀人員在執行業務過程中，未以不動產說明書向與委託人交易之相對人解說，應予申誡", "(C)經紀人員無故洩漏對於因業務知悉或持有之他人秘密，應予六個月以上三年以下之停止執行業"], "qnum": 24, "ans": "B", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產經紀相關法規概要ANS.pdf", "source_qnum": 24}, {"subject": "不動產經紀相關法規概要", "year": "111", "q": "經紀業尚未與委託人簽訂委託契約書便刊登廣告及銷售時，依規定由直轄市、縣（市）主管機關\n處多少罰鍰？", "options": ["(A)新臺幣六千元以上三萬元以下罰鍰", "(B)新臺幣一萬元以上五萬元以下罰鍰", "(C)新臺幣三萬元以上十五萬元以下罰鍰", "(D)新臺幣六萬元以上三十萬元以下罰鍰"], "qnum": 25, "ans": "D", "law_ref": {"law": "不動產經紀業管理條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060017"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/不動產經紀相關法規概要ANS.pdf", "source_qnum": 25}, {"subject": "土地法與土地相關稅法概要", "year": "111", "q": "依土地稅法規定，土地所有權人辦理土地移轉繳納土地增值稅時，在其持有土地期間內，因重新\n規定地價增繳之地價稅，准予抵繳其應納之土地增值稅之總額，以不超過土地移轉時應繳增值稅\n總額多少為限？", "options": ["(A)百分之一", "(B)百分之二", "(C)百分之三", "(D)百分之五"], "qnum": 3, "ans": "D", "law_ref": {"law": "土地稅法", "article": "第30條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130013"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 3}, {"subject": "土地法與土地相關稅法概要", "year": "111", "q": "依房屋稅條例之規定，下列有關房屋稅納稅義務人之敘述，何者錯誤？", "options": ["(A)原則上向房屋所有人徵收之", "(B)未辦建物所有權第一次登記且所有人不明之房屋，向使用執照所載起造人徵收之", "(C)未辦建物所有權第一次登記且所有人不明之房屋，無使用執照者，向建造執照所載起造人徵收之", "(D)未辦建物所有權第一次登記且所有人不明之房屋，無使用執照、亦無建造執照者，暫不徵收之"], "qnum": 4, "ans": "D", "law_ref": {"law": "房屋稅條例", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0130021"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/土地法與土地相關稅法概要ANS.pdf", "source_qnum": 4}, {"subject": "土地法與土地相關稅法概要", "year": "111", "q": "依契稅條例之規定，下列敘述何者錯誤？", "options": ["(A)買賣契稅，應由出賣人申報納稅", "(B)典權契稅，應由典權人申報納稅", "(C)買賣契稅之稅率為其契價百分之六", "(D)分割契稅之稅率為其契價百分之二"], "qnum": 5, "ans": "A", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/土地法與土地相關稅法概要ANS.pdf", "source_qnum" ？", "options": ["(A)管理人管理本人事務之有益費用支出償還請求權", "(B)清償管理人因管理事務所負債務之請求權", "(C)管理人因管理事務所受損害之賠償請求權", "(D)管理人管理本人事務之報酬請求權"], "qnum": 7, "ans": "D", "law_ref": {"law": "民法", "article": "第172條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 7}, {"subject": "民法概要", "year": "111", "q": "有關現行民法代理制度之介紹，下列何者錯誤？", "options": ["(A)未經本人事前同意之自己代理，對於本人而言，係無效之代理行為", "(B)民法第169 條表見代理效力之發生，須無本人之授予代理權為其要件", "(C)間接代理人之代理行為不會對本人直接發生效力", "(D)代理人為代理行為時，被相對人詐欺，本人得自行撤銷該代理行為"], "qnum": 8, "ans": "A", "law_ref": {"law": "民法", "article": "第103條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 8}, {"subject": "民法概要", "year": "111", "q": "對於民法上有關法人規定之說明，下列何者正確？", "options": ["(A)財團法人具有自律法人之性質", "(B)社員資格須經社團之董事會特別決議同意，且有正當理由時，方能開除之", "(C)財團法人之設立，得以遺囑為之", "(D)社團法人以社團董事會為其最高意思機關"], "qnum": 9, "ans": "C", "law_ref": {"law": "民法親屬編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000004"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 9}, {"subject": "民法概要", "year": "111", "q": "依現行民法有關住所之規定，下列何者錯誤？", "options": ["(A)夫妻於雙方共同協議前，推定以共同戶籍地為其法定之住所", "(B)意定住所之設定須具備久住之意思及居住之事實", "(C)因特定行為選定居所，關於其行為，不得視為住所", "(D)16 歲之年輕人，僅能以其父母之住所為法定住所"], "qnum": 10, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 10}, {"subject": "民法概要", "year": "111", "q": "關於民法第74 條暴利行為之規定，下列敘述何者正確？", "options": ["(A)當事人無論於財產給付前或給付後，均得聲請撤銷該暴利行為", "(B)撤銷權自該法律行為成立時起一年內不行使，罹於消滅時效而消滅", "(C)行使暴利行為之撤銷權時，應以意思表示向相對人為之", "(D)暴利行為自始當然無效"], "qnum": 11, "ans": "A", "law_ref": {"law": "民法總則編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 11}, {"subject": "民法概要", "year": "111", "q": "下列何者非法律明文規定屬於連帶債務之性質？", "options": ["(A)合夥財產不足清償合夥債務時，各合夥人對於該不足額之債務", "(B)數人共同不法侵害他人權利所生之損害賠償債務", "(C)共同繼承人對於被繼承人，於繼承所得遺產限度內之遺產債務", "(D)共有人對於他共有人因分割而得之物，所負之擔保責任債務"], "qnum": 12, "ans": "D", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 12}, {"subject": "民法概要", "year": "111", "q": "下列何者非屬贈與人或其繼承人，得主張撤銷贈與契約之原因？", "options": ["(A)附有負擔之贈與，贈與人已為給付而受贈人因過失不履行其負擔者", "(B)受贈人對於贈與人有扶養義務而不履行義務者", "(C)受贈人因故意不法行為致贈與人死亡者", "(D)定期給付之贈與，而受贈人已死亡者"], "qnum": 13, "ans": "D", "law_ref": {"law": "民法", "article": "第406條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 13}, {"subject": "民法概要", "year": "111", "q": "甲與乙結婚，生有三個女兒丙、丁、戊。丙因未婚生有二子庚及辛，曾與其母乙發生重大爭吵及\n言語侮辱情事，而遭甲表示剝奪其繼承權。丁則於甲生前即已向甲表示，當甲百年後將拋棄繼承\n權。設甲死亡時留有遺產現金600 萬元，並未立有遺囑。問:甲之遺產依法應如何分配？", "options": ["(A)乙、丙、丁、戊各150 萬元", "(B)乙、戊各200 萬元，庚、辛各100 萬元", "(C)乙、丁、戊各150 萬元，庚、辛各75 萬元", "(D)乙、戊各300 萬元"], "qnum": 15, "ans": "A", "law_ref": {"law": "民法", "article": "第1154條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 15}, {"subject": "民法概要", "year": "111", "q": "關於限定繼承之敘述，下列何者正確？", "options": ["(A)限定繼承係指繼承人自繼承開始時，僅承受被繼承人財產上之權利，而不繼承其債務", "(B)繼承人縱未依法開具遺產清冊陳報法院，並不當然喪失限定繼承之利益", "(C)繼承人隱匿被繼承人之遺產而情節重大者，仍可主張限定繼承之利益", "(D)繼承人應先對受遺贈人交付遺贈，其次償還優先權之債務，再清償普通債務"], "qnum": 16, "ans": "B", "law_ref": {"law": "民法", "article": "第1154條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 16}, {"subject": "民法概要", "year": "111", "q": "關於夫妻法定財產制之規定，下列敘述何者正確？", "options": ["(A)夫或妻之財產分為婚前財產與婚後財產，婚前財產由夫妻各自所有，婚後財產則由夫妻共有", "(B)夫或妻於婚姻關係存續中就其婚後財產所為之無償行為，應將該財產追加計算，視為現存之婚"], "qnum": 17, "ans": "C", "law_ref": {"law": "民法", "article": "第1025條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 17}, {"subject": "民法概要", "year": "111", "q": "甲將其A 地設定地上權予乙，乙於A 土地上興建B 屋一棟。其後甲為貸款擔保而將其A 地設定\n抵押權予丙，乙亦因其貸款擔保而將B 屋設定抵押權予丁。下列敘述何者正確？", "options": ["(A)若丁實行抵押權拍賣B 屋時，A 地所有權應併付拍賣之", "(B)若丁實行抵押權拍賣B 屋時，地上權應併付拍賣之", "(C)若丙實行抵押權拍賣A 地所有權時，B 屋應併付拍賣之", "(D)若丙實行抵押權拍賣A 地所有權時，地上權應併付拍賣之"], "qnum": 18, "ans": "B", "law_ref": {"law": "民法", "article": "第860條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 18}, {"subject": "民法概要", "year": "111", "q": "甲無權占有乙之土地種植果樹，其果實歸屬於何人？", "options": ["(A)果實在與果樹分離前或分離後，均屬於甲所有", "(B)果實在與果樹分離前或分離後，均屬於乙所有", "(C)果實在與果樹分離前屬於甲所有，分離後屬於乙所有", "(D)果實在與果樹分離前屬於乙所有，分離後屬於甲所有"], "qnum": 19, "ans": "B", "law_ref": {"law": "民法", "article": "第944條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 19}, {"subject": "民法概要", "year": "111", "q": "特定物買賣，若因物有瑕疵而出賣人依法應負物之瑕疵擔保責任時，下列何者非買受人依法所得\n主張之權利？", "options": ["(A)解除買賣契約", "(B)請求減少買賣價金", "(C)請求另行交付無瑕疵之物", "(D)故意不告知瑕疵時，請求損害賠償"], "qnum": 20, "ans": "C", "law_ref": {"law": "民法債編", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000002"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 20}, {"subject": "民法概要", "year": "111", "q": "關於租賃法律關係之敘述，下列何者正確？", "options": ["(A)期限逾一年之不動產租賃契約，應以字據訂立之，否則契約無效", "(B)定有期限之不動產租賃，因其價值之昇降，當事人得聲請法院增減其租金", "(C)不動產之出租人就租金債權，對於承租人之物置於該不動產者，有法定質權", "(D)租用基地建築房屋者，承租人於契約成立後，得請求出租人為地上權之登記"], "qnum": 21, "ans": "D", "law_ref": {"law": "民法", "article": "第421條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 21}, {"subject": "民法概要", "year": "111", "q": "二人互負債務而其給付種類相同，並均屆清償期者，得以其債務與他方之債務互為下列何項主張，\n以消滅其債務？", "options": ["(A)抵銷", "(B)抵充", "(C)免除", "(D)混同"], "qnum": 22, "ans": "A", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 22}, {"subject": "民法概要", "year": "111", "q": "關於財團法人之敘述，下列何者正確？", "options": ["(A)財團法人得為公益或營利之目的而設立", "(B)財團法人於設立登記前，應得主管機關之許可", "(C)財團法人之最高意思機關為總會，且為必設之機關", "(D)財團法人若以營利為目的設立，其取得法人資格，依特別法之規定"], "qnum": 24, "ans": "B", "law_ref": {"law": "土地登記規則", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070031"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 24}, {"subject": "民法概要", "year": "111", "q": "下列何者屬於當然無效之法律行為？", "options": ["(A)單獨虛偽意思表示而該情形為相對人所明知者", "(B)詐欺之意思表示係由第三人所為，而相對人明知其事實或可得而知者", "(C)無權利人就權利標的物為處分後，取得其權利者", "(D)限制行為能力人用詐術使人信其為有行為能力人，所為之法律行為"], "qnum": 25, "ans": "A", "law_ref": {"law": "民法", "article": "第15條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=B0000001"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/111/民法概要ANS.pdf", "source_qnum": 25}, {"subject": "不動產估價概要", "year": "112", "q": "不動產估價師受託評估總統府價值，此屬於何種價格種類？", "options": ["(A)申報價格", "(B)特殊價格", "(C)特定價格", "(D)限定價格"], "qnum": 2, "ans": "B", "law_ref": {"law": "不動產經紀業管理條例", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070046"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 2}, {"subject": "不動產估價概要", "year": "112", "q": "各直轄市、縣（市）國土計畫於110 年4 月30 日公告實施，此為影響不動產價格之何種因素？", "options": ["(A)一般因素", "(B)市場因素", "(C)區域因素", "(D)個別因素"], "qnum": 3, "ans": "A", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 3}, {"subject": "不動產估價概要", "year": "112", "q": "收益性不動產價值是由現在至將來所能帶給權利人之利潤總計，估價師求取將來的收益據以評估\n不動產價值，應重視何種不動產估價原則？", "options": ["(A)期日原則", "(B)外部性原則", "(C)預測原則", "(D)內部性原則"], "qnum": 4, "ans": "C", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 4}, {"subject": "不動產估價概要", "year": "112", "q": "老舊公寓因加裝電梯設備，價格也因此提升，此為何種不動產原則？", "options": ["(A)收益分配原則", "(B)貢獻原則", "(C)均衡原則", "(D)供需原則"], "qnum": 5, "ans": "B", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 5}, {"subject": "不動產估價概要", "year": "112", "q": "依不動產估價技術規則規定，比較標的為父親賣給兒子之交易，應進行何種調整？", "options": ["(A)情況調整", "(B)價格日期調整", "(C)區域因素調整", "(D)個人因素調整"], "qnum": 6, "ans": "A", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 6}, {"subject": "不動產估價概要", "year": "112", "q": "下列之建物殘餘價格率，何者符合不動產估價技術規則之規定？", "options": ["(A)20%", "(B)18%", "(C)12%", "(D)8%"], "qnum": 7, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 7}, {"subject": "不動產估價概要", "year": "112", "q": "下列何者不是收益法推算勘估標的總費用之項目？", "options": ["(A)地價稅", "(B)房屋稅", "(C)土地增值稅", "(D)維修費"], "qnum": 9, "ans": "C", "law_ref": {"law": "不動產估價技術規則", "article": "第20條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 9}, {"subject": "不動產估價概要", "year": "112", "q": "有一幢公寓每坪平均售價為60 萬元，1 樓每坪售價為75 萬元，4 樓每坪售價為50 萬元，建物價\n格占不動產價格之40%，若4 樓之樓層別效用比為100%，則1 樓之樓層別效用比為何？", "options": ["(A)175%", "(B)150%", "(C)120%", "(D)102%"], "qnum": 10, "ans": "B", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 10}, {"subject": "不動產估價概要", "year": "112", "q": "就勘估標的所需要各種建築材料及人工之數量，逐一乘以價格日期當時該建築材料之單價及人工\n工資，並加計管理費、稅捐、資本利息及利潤，以求取勘估標的營造施工費之方法為何？", "options": ["(A)間接法", "(B)淨計法", "(C)工程造價比較法", "(D)單位面積比較法"], "qnum": 12, "ans": "B", "law_ref": {"law": "稅捐稽徵法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=G0340023"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 12}, {"subject": "不動產估價概要", "year": "103", "q": "不動產租金估計，以估計勘估標的之何種租金為原則？", "options": ["(A)市場租金", "(B)差額租金", "(C)實質租金", "(D)經濟租金"], "qnum": 13, "ans": "C", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/103/不動產估價概要ANS.pdf", "source_qnum": 2}, {"subject": "不動產估價概要", "year": "112", "q": "決定收益資本化率之方法中，選擇數個與勘估標的相同或相似之比較標的，以其淨收益除以價格\n後，以所得之商數加以比較決定之方法為何？", "options": ["(A)風險溢酬法", "(B)市場萃取法", "(C)債務保障比率法", "(D)折現現金流量分析法"], "qnum": 14, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 14}, {"subject": "不動產估價概要", "year": "112", "q": "依不動產估價技術規則之規定，有關特殊宗地估價之敘述，下列何者正確？", "options": ["(A)高爾夫球場之估價，以比較法估價為原則", "(B)溫泉地之估價，以比較法估價為原則", "(C)鹽田之估價，以比較法估價為原則", "(D)林地之估價，以比較法估價為原則"], "qnum": 15, "ans": "C", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 15}, {"subject": "不動產估價概要", "year": "112", "q": "當債務保障比率要求為1.5 倍，貸款常數為0.1，不動產價格為新臺幣60 億元，自有資金為新臺\n幣15 億元，不足資金則跟銀行貸款。請問在前述情況下收益資本化率（折現率）為何？", "options": ["(A)15%", "(B)11.25%", "(C)5%", "(D)3.75%"], "qnum": 18, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第20條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 18}, {"subject": "不動產估價概要", "year": "112", "q": "在宗地估價中，公共設施用地及公共設施保留地之估價，以下列那一種方法估價為原則？", "options": ["(A)比較法", "(B)收益法", "(C)成本法", "(D)土地開發分析法"], "qnum": 19, "ans": "A", "law_ref": {"law": "不動產估價技術規則", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 19}, {"subject": "不動產估價概要", "year": "112", "q": "下列何者不屬於土地建築開發之間接成本項目？", "options": ["(A)建築開發之施工人員施工費用", "(B)建築開發之規劃設計費", "(C)建築開發之管理費", "(D)建築開發之銷售費"], "qnum": 20, "ans": "A", "law_ref": {"law": "建築法", "article": "", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=D0070105"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 20}, {"subject": "不動產估價概要", "year": "112", "q": "有關房地成本價格之計算公式，下列何者正確？", "options": ["(A)房地成本價格＝土地總成本＋建物成本價格", "(B)房地成本價格＝土地總成本＋建物總成本", "(C)房地成本價格＝土地價格＋建物成本價格－建物累積折舊額", "(D)房地成本價格＝土地價格＋建物成本價格＋建物累積折舊額"], "qnum": 21, "ans": "A", "law_ref": {"law": "不動產估價技術規則", "article": "第27條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 21}, {"subject": "不動產估價概要", "year": "112", "q": "下列那一種方法不屬於計算收益資本化率或折現率之方法？", "options": ["(A)加權平均資金成本法", "(B)有效總收入乘數法", "(C)折現現金流量分析法", "(D)風險溢酬法"], "qnum": 22, "ans": "C", "law_ref": {"law": "不動產估價技術規則", "article": "第25條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 22}, {"subject": "不動產估價概要", "year": "112", "q": "比較法估價試算價格之調整運算過程中，區域因素調整、個別因素調整或區域因素及個別因素內\n之任一單獨項目之價格調整率大於（甲），或情況、價格日期、區域因素及個別因素調整總調整率\n大於（乙）時，判定該比較標的與勘估標的差異過大，應排除該比較標的之適用。請問（甲）與\n（乙）各為多少？", "options": ["(A)（甲）為百分之十五，（乙）為百分之十五", "(B)（甲）為百分之十五，（乙）為百分之三十", "(C)（甲）為百分之三十，（乙）為百分之十五", "(D)（甲）為百分之三十，（乙）為百分之三十"], "qnum": 23, "ans": "B", "law_ref": {"law": "不動產估價技術規則", "article": "第14條", "url": "https://law.moj.gov.tw/ENG/LawClass/LawAll.aspx?pcode=H0060018"}, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 23}, {"subject": "不動產估價概要", "year": "112", "q": "如果一開發案開發後預期總銷售金額為新臺幣10 億元，適當之利潤率為10%，開發所需之直接\n成本為新臺幣6 億元，開發所需之間接成本為新臺幣2 億元，開發所需總成本之資本利息綜合利\n率為5%。請問下列何者最接近此一開發案之土地開發分析價格？", "options": ["(A)新臺幣2 億元", "(B)新臺幣1.5 億元", "(C)新臺幣1.091 億元", "(D)新臺幣0.658 億元"], "qnum": 24, "ans": "D", "law_ref": null, "source": "重要考訊/考古題/專技證照/不動產經紀人/112/不動產估價概要ANS.pdf", "source_qnum": 24}, {"subject": "不動產估價概要", "year": "112", "q": "有關一宗土地內有數種不同法定用途時之估價敘述，下列何者錯誤？", "options": ["(A)估價前應先考量其最有效使用再決定估價方式", "(B)在考量宗地狀況後可以視不同法定用途採分別估價", "(C)估價前應先考量各種用途之相關性及分割之難易度再決定估價方式", "(D)估價時無須考量是否有數種不同法定用途，只需依其主要用途估價"], "qnum": 25, "ans": "D", "law_ref": {"law": "不動產估價技術規則", "article": "第2條", "url": "https://l
